    Activity:
      type: object
      properties:
        type:
          type: string
          description: type of activity
          enum:
          - start
          - end
          - service
          - pickupShipment
          - deliverShipment
          - pickup
          - delivery
          - break
        id:
          type: string
          description: "Id referring to the underlying service or shipment, i.e. the\
            \ shipment or service this activity belongs to"
        name:
          type: string
          description: "Human-readable name copied from the underlying service or\
            \ shipment, if one was set on the request. Omitted for `start`/`end` activities\
            \ and when the request did not specify a name."
        location_id:
          type: string
          description: Id that refers to address
        address:
          $ref: "#/components/schemas/ResponseAddress"
        arr_time:
          type: integer
          description: "Arrival time at this activity in seconds. If type is `start`,\
            \ this is not available (since it makes no sense to have `arr_time` at\
            \ start). However, `end_time` is available and actually means \\\"departure\
            \ time\\\" at start location. It is important to note that `arr_time`\
            \ does not necessarily mean \\\"start of underlying activity\\\", it solely\
            \ means arrival time at activity location. If this activity has no time\
            \ windows and if there are no further preparation times, `arr_time` is\
            \ equal to activity start time."
          format: int64
        end_time:
          type: integer
          description: "End time of and thus departure time at this activity. If type\
            \ is `end`, this is not available (since it makes no sense to have an\
            \ `end_time` at end) `end_time` at each activity is equal to the departure\
            \ time at the activity location."
          format: int64
        end_date_time:
          type: string
          description: "Translation of unix timestamp in `end_time` to end date time\
            \ string with zone offset. It will be in the following ISO-8601 format:\
            \ 2007-12-03T10:15:30+01:00."
          format: date-time
        arr_date_time:
          type: string
          description: "Translation of unix timestamp in `arr_time` to arrival date\
            \ time string with zone offset. It will be in the following ISO-8601 format:\
            \ 2007-12-03T10:15:30+01:00."
          format: date-time
        waiting_time:
          type: integer
          description: Waiting time at this activity in seconds. A waiting time can
            occur if the activity has at least one time window. If `arr_time` < `time_window.earliest`
            a waiting time of `time_window_earliest` - `arr_time` occurs.
          format: int64
        preparation_time:
          type: integer
          description: preparation time at this activity in seconds
          format: int64
        setup_time:
          type: integer
          description: "Setup time at this activity in seconds. Setup time is charged\
            \ when the location differs from the previous activity, representing location\
            \ overhead like dock check-in or security clearance."
          format: int64
        distance:
          type: integer
          description: Cumulative distance from start to this activity in meters.
          format: int64
        driving_time:
          type: integer
          description: Cumulative driving time from start to this activity in seconds.
          format: int64
        load_before:
          type: array
          description: Array with size/capacity dimensions before this activity
          items:
            type: integer
            description: dimension value
            format: int32
        load_after:
          type: array
          description: Array with size/capacity dimensions after this activity
          items:
            type: integer
            description: dimension value
            format: int32
        priority:
          maximum: 10
          minimum: 1
          type: integer
          description: "Priority copied from the underlying service or shipment (1\
            \ = highest, 10 = lowest, default 2). Omitted for `start`/`end` activities."
          format: int32
        group:
          type: string
          description: Group identifier copied from the underlying activity (pickup
            or delivery side for shipments). Omitted for `start`/`end` activities
            and when the request did not specify a group.
        departure_window:
          $ref: "#/components/schemas/ActivityDepartureWindow"
        time_window:
          allOf:
          - $ref: "#/components/schemas/TimeWindow"
          - description: "The time window the solver actually scheduled this activity\
              \ into. Only present when the request specified at least one explicit,\
              \ non-default time window for the activity; the trivial `[0, MAX]` window\
              \ is suppressed."
    Vehicle:
      required:
      - vehicle_id
      type: object
      properties:
        vehicle_id:
          type: string
          description: "Specifies the ID of the vehicle. Ids must be unique, i.e.\
            \ if there are two vehicles with the same ID, an error is returned."
          example: vehicle-1
        type_id:
          type: string
          description: "The type ID assigns a vehicle type to this vehicle. You can\
            \ specify types in the array of vehicle types. If you omit the type ID,\
            \ the default type is used. The default type is a `car` with a capacity\
            \ of 0."
          example: my-own-type
          default: default-type
        shifts:
          type: array
          description: An array of shift configurations for this vehicle.
          items:
            $ref: "#/components/schemas/Shift"
        start_address:
          $ref: "#/components/schemas/Address"
        end_address:
          $ref: "#/components/schemas/Address"
        break:
          anyOf:
          - $ref: "#/components/schemas/TimeWindowBreak"
          - $ref: "#/components/schemas/DriveTimeBreak"
        return_to_depot:
          type: boolean
          description: "If it is false, the algorithm decides where to end the vehicle\
            \ route. It ends in one of your customers' locations. The end is chosen\
            \ such that it contributes to the overall objective function, e.g. min\
            \ transport_time. If it is true, you can either specify a specific end\
            \ location (which is then regarded as end depot) or you can leave it and\
            \ the driver returns to its start location."
          default: true
        earliest_start:
          type: integer
          description: Earliest start of vehicle in seconds. It is recommended to
            use the unix timestamp.
          format: int64
          default: 0
        latest_end:
          type: integer
          description: "Latest end of vehicle in seconds, i.e. the time the vehicle\
            \ needs to be at its end location at latest. Omit this field to indicate\
            \ no limit."
          format: int64
        latest_start:
          type: integer
          description: "Latest start of vehicle in seconds. If specified and greater\
            \ than earliest_start, the optimizer determines the best departure time\
            \ within the [earliest_start, latest_start] window to minimize waiting\
            \ time. (beta)"
          format: int64
        departure_preference:
          type: string
          description: "Controls departure preference when latest_start is set. \"\
            late\" (default) departs as late as possible while meeting all time windows.\
            \ \"early\" departs as early as possible, eliminating waiting time along\
            \ the route. Ignored without latest_start. (beta)"
          default: late
          enum:
          - early
          - late
        skills:
          type: array
          description: "An array of skills, i.e. an array of strings (not case sensitive)."
          example:
          - drilling_machine
          - screw_driver
          items:
            type: string
        max_distance:
          type: integer
          description: Specifies the maximum distance (in meters) a vehicle can go.
          format: int64
          example: 400000
        max_driving_time:
          type: integer
          description: "Specifies the maximum driving time (in seconds) a vehicle/driver\
            \ is allowed, i.e. the maximum time spent on the road (service and waiting\
            \ times are not included). Note that `preparation_time` of services counts\
            \ as driving time."
          format: int64
          example: 28800
        max_service_time:
          type: integer
          description: "Specifies the maximum on-site time (in seconds) a vehicle/driver\
            \ is allowed, i.e. the sum of all service durations (scaled by the vehicle\
            \ type's service_time_factor) plus setup times along the route. Driving,\
            \ waiting and break times are not included."
          format: int64
          example: 14400
        max_working_time:
          type: integer
          description: "Specifies the maximum working time (in seconds) a vehicle/driver\
            \ is allowed: driving time (incl. preparation times) plus on-site time\
            \ (service durations scaled by service_time_factor plus setup times).\
            \ Waiting and break times are not included. Use `max_route_duration` instead\
            \ if waiting time should count towards the limit."
          format: int64
          example: 36000
        max_route_duration:
          type: integer
          description: "Specifies the maximum duration (in seconds) of the vehicle's\
            \ route, i.e. the time between the vehicle's actual departure from its\
            \ start location and its arrival at its end location (or at its last stop\
            \ if `return_to_depot` is false). Unlike `max_working_time`, waiting and\
            \ break times count towards this limit, so it bounds the time the driver\
            \ is away. Unlike `latest_end`, it is measured from the actual departure:\
            \ with `latest_start` the optimizer may depart later than `earliest_start`,\
            \ and the limit applies to the route from that later departure."
          format: int64
          example: 36000
        max_jobs:
          type: integer
          description: Specifies the maximum number of jobs a vehicle can load.
          format: int32
          example: 12
        min_jobs:
          type: integer
          description: "Specifies the minimum number of jobs a vehicle should load.\
            \ This is a soft constraint, i.e. if it is not possible to fulfill “min_jobs”\
            , we will still try to get as close as possible to this constraint."
          format: int32
          example: 12
        max_activities:
          type: integer
          description: Specifies the maximum number of activities a vehicle can conduct.
          format: int32
          example: 24
        move_to_end_address:
          type: boolean
          description: Indicates whether a vehicle should be moved even though it
            has not been assigned any jobs.
    GroupRelation:
      required:
      - groups
      - type
      type: object
      properties:
        type:
          type: string
          description: |
            Specifies the type of relation. It must be either of type `in_sequence`, `in_direct_sequence` or `neighbor`.
          example: in_direct_sequence
        groups:
          type: array
          description: An array of groups that should be related
          example:
          - group-A
          - group-B
          items:
            type: string
            description: group of services or shipments
    GeocodingPoint:
      type: object
      properties:
        lat:
          type: number
          description: Latitude
          format: double
        lng:
          type: number
          description: Longitude
          format: double
    Clusters:
      type: object
      properties:
        name:
          type: string
          description: id of customer
          example: GraphHopper GmbH
        center:
          $ref: "#/components/schemas/ClusterCustomerAddress"
        min_quantity:
          type: number
          description: Specifies min. quantity of this cluster
          format: int32
          example: 10
        max_quantity:
          type: number
          description: Specifies max. quantity of this cluster
          format: int32
          example: 10
    MatrixResponseHints:
      type: object
      properties:
        message:
          type: string
          description: Short description of this hint
        details:
          type: string
          description: Details of this hint
        invalid_from_points:
          type: array
          description: Optional. An array of from_point indices of points that could
            not be found. Will only be added if `fail_fast=false` and some `from_point`s
            were not found.`
          items:
            type: number
            format: int32
        invalid_to_points:
          type: array
          description: Optional. An array of to_point indices of points that could
