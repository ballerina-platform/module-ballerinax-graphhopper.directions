tags:
- name: Map Data and Routing Profiles
  description: "\nThe default data source is [OpenStreetMap](https://www.openstreetmap.org).\
    \ As an alternative, we also offer TomTom MultiNet.\n\nPlease read in [our attribution\
    \ page](https://www.graphhopper.com/attribution/) on how to attribute these different\
    \ data sources.\n\n# OpenStreetMap\n\n#### Geographical Coverage\n\n[OpenStreetMap](https://www.openstreetmap.org)\
    \ covers the whole world. If you want to see for yourself if we can provide data\
    \ suitable for your region,\nplease visit [GraphHopper Maps](https://graphhopper.com/maps/).\n\
    You can edit and modify OpenStreetMap data if you find that important information\
    \ is missing, e.g. a weight limit for a bridge.\n[Here](https://wiki.openstreetmap.org/wiki/Beginners%27_guide)\
    \ is a beginner's guide that shows how to add data. If you have edited data, we\
    \ usually consider your data after 1 week at the latest.\n\n#### Standard Routing\
    \ Profiles\n\nThe Routing, Matrix and Route Optimization APIs support the following\
    \ profiles. But also see the section about customized profiles below the table.\n\
    \nName             | Description           | Restrictions                    \
    \    | Icon\n-----------------|:----------------------|:------------------------------------|:---------------------------------------------------------\n\
    car              | Car mode              | car access, weight=2500kg, width=2m,\
    \ height=2m           | ![car image](./img/car.png)\ncar_avoid_motorway | Car\
    \ mode            | like car that heavily penalizes motorways        | ![car image](./img/car.png)\n\
    car_avoid_ferry    | Car mode            | like car that heavily penalizes ferries\
    \          | ![car image](./img/car.png)\ncar_avoid_toll     | Car mode      \
    \      | like car that heavily penalizes tolls and ferries| ![car image](./img/car.png)\n\
    small_truck        | Small truck like a Mercedes Sprinter, Ford Transit or Iveco\
    \ Daily | height=2.7m, width=2+0.28m, length=5.5m, weight=2080+1400 kg | ![small\
    \ truck image](./img/small_truck.png)\ntruck              | Truck like a MAN or\
    \ Mercedes-Benz Actros              | height=3.7m, width=2.6+0.34m, length=12m,\
    \ weight=13000+13000 kg, hgv=yes, 3 Axes | ![truck image](./img/truck.png)\nscooter\
    \            | Moped mode          | Fast inner city, often used for food delivery,\
    \ is able to ignore certain bollards, maximum speed of roughly 50km/h. weight=300kg,\
    \ width=1m, height=2m | ![scooter image](./img/scooter.png)\nfoot       | Pedestrian\
    \ routes | foot access         | ![foot image](./img/foot.png)\nhike       | Pedestrian\
    \ routes prioritizing scenic beauty and longer distances than with the `foot`\
    \ profile, designed for hiking experiences rather than casual walks. Walking duration\
    \ is influenced by elevation differences. May include challenging or potentially\
    \ dangerous trail sections requiring appropriate preparation, equipment and caution.\
    \ Use the `hike_rating` [path detail](/openapi/routing/postroute#routing/postroute/t=request&path=details)\
    \ for this information.  | foot access, but with potentially dangerous [SAC-scales](https://wiki.openstreetmap.org/wiki/Key:sac_scale)\
    \         | ![hike image](./img/hike.png)\nbike       | Trekking bike avoiding\
    \ hills | bike access         | ![Bike image](./img/bike.png)\nmtb        | Mountainbike\
    \                 | bike access         | ![Mountainbike image](./img/mtb.png)\n\
    racingbike | Bike preferring roads        | bike access         | ![Racingbike\
    \ image](./img/racingbike.png)\necargobike | Similar to racingbike but a bit faster\
    \ and with width constraints. | bike access but without steps and footways | ![Racingbike\
    \ image](./img/racingbike.png)\nas_the_crow_flies | Only available for the Cluster\
    \ API. Uses the straight-line (or \"direct\") distance. This allows to use 5x\
    \ more customers than the contractual \"locations\" limit defines. | -       \
    \  | -\n\nNote:\n\n * the free package supports only the routing profiles `car`,\
    \ `bike` or `foot`\n * up to 3 different routing profiles can be used in a single\
    \ request towards the Route Optimization API. The number of vehicles is unaffected\
    \ and depends on your subscription.\n * a sophisticated `motorcycle` profile is\
    \ available up on request. It is powered by the [Kurviger](https://kurviger.de/en)\
    \ Routing API and favors curves and slopes while avoiding cities and highways.\n\
    \ \n#### Customized Routing Profiles\n\nCustomized routing profiles let you modify\
    \ any vehicle profile, including speed, access restrictions, and other parameters.\
    \ Read more about this [in the documentation](#tag/Custom-Profiles).\nCustom profiles\
    \ work for the Routing, Route Optimization and Matrix API.\n\nFor the Routing\
    \ API, it is also possible to modify the profile on a per-request basis using\
    \ [custom models](#tag/Custom-Model), without needing to create a separate custom\
    \ profile in advance.\nThis enables dynamic adjustments to routing preferences,\
    \ such as avoiding certain areas or applying vehicle-specific restrictions, directly\
    \ within each request.\n\n# TomTom MultiNet\n\nThrough a partnership with TomTom,\
    \ we offer the TomTom MultiNet map as an alternative to OSM. Consider this option\n\
    if your application requires more data-driven travel time estimates than our OSM-based\
    \ map can provide.\n\nThis map can sometimes give more accurate travel time estimates\
    \ and produce higher-quality routes. It uses\nlink speeds that vary over the time\
    \ of day, accounting for different traffic conditions during rush hours.\n\nThis\
    \ map is updated quarterly. Optionally, we can take currently known road closures\
    \ from a live feed into account.\n\n#### Geographical Coverage\n\nTomTom MultiNet\
    \ is a global map covering more than 150 countries and 30 territories.\n\n####\
    \ Routing Profiles\n\nName       | Description           | Restrictions      \
    \        | Icon\n-----------|:----------------------|:--------------------------|:---------------------------------------------------------\n\
    car        | Car mode              | car access                | ![car image](./img/car.png)\n\
    small_truck| Small truck like a Mercedes Sprinter, Ford Transit or Iveco Daily\
    \ | height=2.7m, width=2+0.28m, length=5.5m, weight=2080+1400 kg | ![small truck\
    \ image](./img/small_truck.png)\n"
- name: Route Optimization
  description: |
    The Route Optimization API solves [traveling salesman](https://en.wikipedia.org/wiki/Travelling_salesman_problem) and [vehicle routing problems](https://en.wikipedia.org/wiki/Vehicle_routing_problem): given a set of stops to visit and a set of vehicles to visit them with, it returns an assignment of stops to vehicles and an order to visit them in, minimizing an objective you choose (total time, number of vehicles used, longest single route, etc.) while respecting constraints you specify (time windows, vehicle capacities, driver skills, and many more).

    This page describes the conceptual model. The endpoint reference pages linked at the bottom describe the request and response schema in detail. If you prefer to learn by example, jump to the [API Explorer](https://explorer.graphhopper.com/?endpoint=vrp) or the [Getting Started tutorial](https://www.graphhopper.com/blog/2019/05/17/getting-started-with-the-optimization-api-traveling-salesman-problem/).

    # Mental Model

    A request describes a **fleet**, a **workload**, and an **objective**. The API returns a **solution**.

    The **fleet** is the set of vehicles that will execute the routes. Vehicles are described individually (start and end location, optional shift schedule); shared characteristics (routing profile, capacity, speed, cost per hour and per kilometer) are factored out into vehicle types.

    The **workload** is the set of orders to be served. Each order is either a **service** (a single stop) or a **shipment** (a paired pickup and delivery that must end up on the same route, in order).

    The **objective** is what the optimizer minimizes. Total time, number of vehicles used, longest single route, fairness across drivers. You choose, and you can combine multiple objectives in priority order.

    A **solution** is a list of routes (one per used vehicle), each an ordered list of activities with arrival and departure times, plus an `unassigned` list for orders that could not be placed.

    Two further mechanisms refine the model:

    **Constraints** restrict which solutions are valid. Hard constraints (time windows, capacity, skills, allowed vehicles) leave non-conforming orders unassigned; soft constraints (priority, preferred vehicles) influence the optimizer without forbidding violations.

    **Relations** link orders to each other beyond what an objective and constraints can express. They state that certain orders must be served on the same route, in a given sequence, or within a geographic flow, independently of what the optimizer would otherwise choose.

    These five elements — fleet, workload, objective, constraints, relations — are everything you ever describe in a request. The rest of this page explains how to use each of them well.

    # Minimal Example

    A request with one vehicle, one vehicle type, four services, a relation, and an objective to minimize total time. One service exceeds the vehicle's capacity and will be left unassigned. The `in_direct_sequence` relation forces order-3 to be served immediately after the vehicle's start, followed immediately by order-2:

    ```json
    {
      "vehicles": [
        {
          "vehicle_id": "driver-1",
          "type_id": "van",
          "start_address": { "location_id": "depot", "lon": 13.3888, "lat": 52.5170 },
          "earliest_start": 1746612000
        }
      ],
      "vehicle_types": [
        {
          "type_id": "van",
          "profile": "car",
          "capacity": [10]
        }
      ],
      "services": [
        {
          "id": "order-1",
          "address": { "location_id": "order-1", "lon": 13.3762, "lat": 52.5206 },
          "size": [2],
          "duration": 300,
          "time_windows": [{ "earliest": 1746612000, "latest": 1746615600 }]
        },
        {
          "id": "order-2",
          "address": { "location_id": "order-2", "lon": 13.4050, "lat": 52.5200 },
          "size": [3],
          "duration": 300
        },
        {
          "id": "order-3",
          "address": { "location_id": "order-3", "lon": 13.4270, "lat": 52.5230 },
          "size": [1],
          "duration": 300
        },
        {
          "id": "order-4",
          "address": { "location_id": "order-4", "lon": 13.395163, "lat": 52.526215 },
          "size": [20],
          "duration": 300
        }
      ],
      "objectives": [
        { "type": "min", "value": "completion_time" }
      ],
      "relations": [ { "type": "in_direct_sequence", "ids": ["start","order-3","order-2"] } ],
      "configuration": { "routing": { "calc_points": true } }
    }
    ```

    The response contains a `solution` with a `routes` array (one per used vehicle) and an `unassigned` object for orders that could not be placed:

    ```json
    {
      "solution": {
        "distance": 10424,
        "transport_time": 1279,
        "completion_time": 2179,
        "no_vehicles": 1,
        "no_unassigned": 1,
        "routes": [
          {
            "vehicle_id": "driver-1",
            "points": [
              { "type": "LineString", "coordinates": [[13.3888,52.517],"...",  [13.427,52.523]] },
              { "type": "LineString", "coordinates": [[13.427,52.523], "...", [13.405,52.52]] },
              { "type": "LineString", "coordinates": [[13.405,52.52],  "...", [13.3762,52.5207]] },
              { "type": "LineString", "coordinates": [[13.3762,52.5207],"...",[13.3888,52.517]] }
            ],
            "activities": [
              { "type": "start", "location_id": "depot", "arr_time": 1746612000, "end_time": 1746612000, "load_after": [0] },
              { "type": "service", "id": "order-3", "location_id": "order-3", "arr_time": 1746612352, "end_time": 1746612652, "load_before": [0], "load_after": [1] },
              { "type": "service", "id": "order-2", "location_id": "order-2", "arr_time": 1746612966, "end_time": 1746613266, "load_before": [1], "load_after": [4] },
              { "type": "service", "id": "order-1", "location_id": "order-1", "arr_time": 1746613640, "end_time": 1746613940, "load_before": [4], "load_after": [6], "time_window": { "earliest": 1746612000, "latest": 1746615600 } },
              { "type": "end", "location_id": "depot", "arr_time": 1746614179, "end_time": 1746614179, "load_before": [6] }
            ]
          }
        ],
        "unassigned": {
          "services": ["order-4"],
          "details": [{ "id": "order-4", "code": 3, "reason": "does not fit into any vehicle due to capacity" }]
        }
      }
    }
    ```

    Note that `time_windows` use Unix timestamps (recommended). The `in_direct_sequence` relation forced the solver to visit order-3 then order-2 immediately after the start, even though a different sequence might have been shorter. `order-4` was left unassigned with reason code 3 (capacity exceeded: size 20 vs. vehicle capacity 10). Because `configuration.routing.calc_points` is `true`, the response includes a `points` array with one LineString geometry per leg — use these to render routes on a map without a separate Routing API call.

    # Concepts

    ## Services vs. Shipments

    The choice matters because it changes what the optimizer is allowed to do.

    A **service** is loaded onto the vehicle for the rest of the route (if `type` is `service` or `pickup`) or treated as already-loaded at the depot and dropped at the customer (`type: delivery`). The optimizer is free to interleave services from different customers in any order that satisfies constraints.

    A **shipment** introduces an ordering constraint: the pickup of shipment X must happen before the delivery of shipment X, on the same route. Between those two stops, the optimizer can interleave other services or other shipments' pickups and deliveries, as long as capacity holds.

    Use services for typical last-mile delivery (where goods come from a single depot), customer visits, technician dispatch. Use shipments when goods move directly between customer locations: courier work, ride-hailing, moving services, vehicle repositioning.

    ## Constraints: Hard vs. Soft

    Constraints fall into two categories, and understanding the difference is critical for diagnosing why the solver returned the result it did.

    **Hard constraints** must be satisfied. If they cannot be, the order is left unassigned and appears in `solution.unassigned`. Hard constraints include:

    - Time windows on services, shipments, and vehicle shifts
    - Vehicle capacity vs. order size
    - Skills (a service's `required_skills` must be a subset of the assigned vehicle's `skills`)
    - `allowed_vehicles` and `disallowed_vehicles` lists
    - `max_distance`, `max_driving_time`, `max_service_time`, `max_working_time`, `max_route_duration`, `max_jobs`, `max_activities` per vehicle
    - `max_time_in_vehicle` for deliveries
    - Relation constraints (`in_sequence`, `in_direct_sequence`, `in_same_route`, `in_area_sequence`)

    **Soft constraints** influence the solution but do not prevent assignment. Violating them costs the optimizer "score," so it tries to avoid them, but will accept a violation if there's no alternative. Soft constraints include:

    - `priority` on services and shipments (high-priority orders get assigned first when not all can be served)
    - `preferred_vehicles`
    - `min_jobs` per vehicle

    When an order ends up unassigned, the response includes `solution.unassigned.details` with a code indicating the most likely reason (capacity, time window, skill mismatch, etc.) and a `reasons` array with all probable causes ranked by likelihood. The full code table is in the [POST /vrp reference](#operation/solveVRP).

    ## Relations: Shaping the Solution

    The objectives plus hard and soft constraints can express most of what a router needs, but not everything. Real-world dispatchers carry knowledge that resists formalization: a driver prefers to clear the north side of town before lunch, two stops at the same office should be done back-to-back so the driver only signs in once, a particular customer expects to be the first visit of the day, the morning route should sweep west-to-east before circling back. These aren't gaps in the API — they're the gap between any abstract objective and the messy reality of operations. Drivers have preferences, customers have habits, and dispatchers have judgment that earned its keep over years.

    **Relations are the escape hatch for that gap.** Instead of trying to encode every preference as an objective or constraint, you let the optimizer do its job within boundaries you define. A relation says "whatever else you decide, this constraint must hold."

    The available relation types:

    - **`in_same_route`** — the related items must end up on the same vehicle, regardless of order.
    - **`not_in_same_route`** — the related items must end up on different vehicles. This is the only exclusion relation; all others pull items together.
    - **`in_sequence`** — the related items must appear in the listed order on a single route, but other stops may be inserted between them.
    - **`in_direct_sequence`** — the related items must appear in the listed order on a single route, with no stops in between.
    - **`neighbor`** — the related items must be served by the same vehicle and appear next to each other, but in any order.
    - **`in_area_sequence`** — each area is defined by an anchor stop and a radius; all stops within that radius belong to the area. The areas must be visited in the given order, while the optimizer remains free to sequence stops within each area.

    `in_area_sequence` is unique among the six in that the grouping is defined spatially, by an anchor stop and a radius, rather than by labels you assign to individual orders. A dispatcher picks a few anchor stops, sets a radius for each, orders the resulting areas, and the optimizer respects the geographic flow while still finding the best sequence within each area. The dispatcher's tacit knowledge about traffic, neighborhood characteristics, or driver preference becomes a few clicks; the optimizer handles the rest.

    ### Two Granularities: Orders and Groups

    Relations operate at two granularities, depending on which field you populate.

    **Order-level relations** use the `ids` field, listing individual service or shipment ids. `in_sequence` over `["service-A", "service-B"]` means service-A must be served before service-B on the same route.

    **Group-level relations** use the `group` field, listing group labels instead of order ids. `in_sequence` over groups `["downtown", "uptown"]` is a higher-order constraint: every stop tagged `group: "downtown"` must be served before every stop tagged `group: "uptown"`. The relation operates on the clusters as units, not on the individual stops inside them.

    Group-level relations are what make interactive UIs practical. A dispatcher assigns a group label to a set of stops in a neighborhood, and a single relation entry sequences that group against another, regardless of how many stops are inside either one. The dispatcher works with a handful of meaningful clusters; the request stays compact regardless of how many orders the underlying problem contains.

    ### Groups Own Semantics

    Groups are not only labels you reference from relations. Assigning the same group label to two or more orders is itself a constraint.

    Tagging orders with the same group does two things at once. First, it treats them as a contiguous cluster: wherever they are served, they appear as a block, with no other stops inserted between them. Second, it leaves the order within that block to the optimizer. A group is in effect a "weak in_sequence": the stops stay together, but the algorithm picks the best internal sequence.

    The cluster constraint is about contiguity, not route assignment. In a multi-vehicle problem, the orders in group A and the orders in group B can land on different routes; the optimizer is free to make that choice. On each route a group appears on, its members are contiguous. If you want all members of a group on the same route, add an `in_same_route` relation over the group, or pin the group to a specific vehicle by adding a `vehicle_id` to the relation.

    Ungrouped orders are by default not allowed to be inserted inside a group; if you need that flexibility, set `configuration.optimization.free_insertion` to true. You can then exempt specific groups (typically conventional ones like `"asap"` or `"last"`) from free insertion via `free_insertion_exempt_groups`, so those groups remain compact while other ungrouped orders move freely.

    ### Practical Notes

    Relations are hard constraints: an order in an unsatisfiable relation appears in `unassigned` with reason code 21 (or 29 for group constraints). They compose with all other constraints, so a relation that conflicts with a time window or capacity will leave the affected orders unassigned.

    Relations can also be built dynamically. A common pattern is to take the result of a first optimization, extract the sequence the optimizer chose, and feed it back as `in_direct_sequence` relations to lock that sequence in for the next request. This is useful when re-planning around late-breaking changes without disrupting an already-communicated route. Watch for cases where the new constraints over-constrain the problem and previously-assignable orders become unassigned.

    ## Choosing an Objective

    Pick the objective that matches what you're actually optimizing for. The defaults that suit most use cases:

    **Just minimize total time:** `min completion_time`. This is the right answer for ~80% of real dispatch problems.

    **Use as few vehicles as possible, then minimize time:** combine `min vehicles` followed by `min completion_time`. The order matters: the optimizer treats objectives lexicographically, so vehicles are minimized first, completion time second.

    **Finish all routes as early as possible (minimize the longest route):** `min-max completion_time`. Useful when you have a hard end-of-day deadline and want all drivers home around the same time.

    **Distribute work fairly across drivers:** `balance completion_time` (Beta) or `balance activities`. The `balance` type minimizes the variance of workload, while `min-max` only minimizes the longest route. Use `balance` when fairness matters; use `min-max` when only the latest finish time matters.

    **Travel time only, ignoring waiting at customer sites:** `min transport_time`. Rare. Most users actually want `completion_time`.

    For a deeper discussion, see [completion time vs. transport time](https://www.graphhopper.com/blog/2016/06/20/what-is-the-difference-between-the-minimization-of-completion-time-and-minimizing-transport-time/).

    ## Modeling Time at a Stop

    Every stop has a timeline the optimizer tracks: arrival, preparation, waiting, setup, service, departure. Getting this right matters because it determines when time windows are evaluated, how long a vehicle stays, and ultimately what the optimizer can fit into a route.

    Three parameters control how long a vehicle spends at a stop, and they differ in *when* they apply and *how often* they are charged:

    - **`duration`** is the actual service time — loading, unloading, performing a task. It is charged for every activity, so two deliveries at the same warehouse each add their own duration.
    - **`preparation_time`** is time spent after arrival but before the time window is evaluated — finding a parking spot, walking from the truck to the entrance. It is charged once per location: if the vehicle serves multiple orders at the same address consecutively, preparation happens only on the first.
    - **`setup_time`** is fixed overhead that happens after the time window opens but before service begins — dock check-in, security clearance, equipment setup. Like preparation time, it is charged once per location.

    The full sequence is: `arrival → preparation_time → waiting (if early) → setup_time → duration → departure`. A **time window** defines when an activity can *start* — the vehicle must begin service between `earliest` and `latest`. It does not require the activity to finish within the window; a service that starts at `latest` and runs for its full duration will end after the window closes, and that is valid. A vehicle that arrives before `earliest` waits (after preparation) until the window opens, then starts setup, then performs the service.

    Most problems only need `duration`. Add `preparation_time` when vehicles consistently lose time reaching the actual service point (urban deliveries with scarce parking, large campus sites). Add `setup_time` when certain locations impose a fixed entry overhead regardless of how many tasks you perform there. If you are unsure, start with `duration` alone — the other two are refinements, not requirements.

    For a detailed walkthrough with a timeline diagram and comparison table, see [Stop Timing: preparation, setup and duration](https://www.graphhopper.com/blog/2026/05/27/stop-timing-preparation-setup-and-duration/).

    ## Synchronous vs. Asynchronous

    Two endpoints solve the same problem with different delivery mechanisms.

    **`POST /vrp`** (synchronous) returns the solution in the response body. Use this when the problem is small enough to solve in under 10 seconds. If the solver runs longer, the request times out and you lose the work.

    **`POST /vrp/optimize`** (asynchronous) returns a `job_id` immediately. You then poll **`GET /vrp/solution/{jobId}`** every 500ms or so until `status` is `finished`. Use this for any problem that might exceed 10 seconds.

    As a rule of thumb, prefer the synchronous endpoint for problems with a single vehicle and up to 200 stops. If you're unsure, start synchronous; if you hit timeouts, switch to async. The async workflow has the same request body, so switching is a one-line change.

    ## Endpoints

    - [POST /vrp](#operation/solveVRP): synchronous endpoint. Returns the solution in the response. Suitable for problems that solve in under 10 seconds.
    - [POST /vrp/optimize](#operation/asyncVRP): asynchronous endpoint. Returns a `job_id`; fetch the solution from the endpoint below. Use this for problems that take longer than 10 seconds. The request body is identical to `/vrp`.
    - [GET /vrp/solution/{jobId}](#operation/getSolution): poll this endpoint until `status` is `finished`. Recommended interval: 500ms.

    ## Further reading

    - [Getting Started with the Optimization API](https://www.graphhopper.com/blog/2019/05/17/getting-started-with-the-optimization-api-traveling-salesman-problem/) — step-by-step walkthrough of a first VRP request
    - [Area Sequencing: shape your routes by area](https://www.graphhopper.com/blog/2026/05/04/area-sequencing-shape-your-routes-by-area/) — using `in_area_sequence` to control geographic flow
    - [Solving a TSP with a week-planning horizon and driver shifts](https://www.graphhopper.com/blog/2020/07/15/how-to-solve-a-traveling-salesman-problem-with-a-week-planning-horizon-and-driver-shifts/)
    - [Scheduling technicians with skills and multiple dependencies](https://www.graphhopper.com/blog/2016/06/03/how-to-route-technicians-with-skills-and-multiple-dependencies-between-tasks/)
    - [Completion time vs. transport time](https://www.graphhopper.com/blog/2016/06/20/what-is-the-difference-between-the-minimization-of-completion-time-and-minimizing-transport-time/)
    - [Modeling multi-trip routes for a single vehicle](https://www.graphhopper.com/blog/2016/07/21/how-to-model-multiple-delivery-routes-with-a-single-vehicle/)
- name: Routing
  description: |
    The Routing API calculates the best path connecting two or more points, where the meaning of ''best'' depends on the vehicle profile and use case.
    Besides path coordinates it can return turn-by-turn instructions, elevation, [path details](https://www.graphhopper.com/blog/2019/11/28/routing-api-using-path-details/) and other useful information about the route.

    Use our [API Explorer](https://explorer.graphhopper.com/) to explore the Routing API.
- name: Matrices
  description: |
    The Matrix API calculates distances and times between multiple start and destination locations.
    It can compute full NxN matrices or asymmetric matrices with separate origin and destination sets.
- name: Geocoding
  description: |
    _Geocoding_ describes the process of transforming an textual address representation to a coordinate (`latitude,longitude`).
    For example the conversion from `Berlin` to `52.5170365,13.3888599`.

    _Reverse geocoding_ converts a coordinate to a textual address representation or place name. Find out more about Geocoding itself on [Wikipedia](http://en.wikipedia.org/wiki/Geocoding).
- name: Isochrones
  description: |
    An isochrone of a location is ''a line connecting points at which a vehicle arrives at the same time'', see Wikipedia.
    With the same API you can also calculate isodistances, just use the parameter distance_limit instead of time_limit`.

    Some possible areas in which this API may be useful to you:

    - real estate analysis
    - realtors
    - vehicle scheduling
    - geomarketing
    - reach of electric vehicles
    - transport planning
    - logistics (distribution and retail network planning)

    See the [clients](#section/API-Clients) section in the main documentation, and [our API explorer](https://explorer.graphhopper.com/?endpoint=isochrone).
- name: Map Matching
  description: |
    You can snap measured GPS points typically as GPX files to a digital
    road network to e.g. clean data or attach certain data like elevation or turn instructions to it.

    See the [clients](#section/API-Clients) section in the main documentation, and [our API explorer](https://explorer.graphhopper.com/?endpoint=match).

    The cost for one request depends on the number of GPS location and is documented [here](https://support.graphhopper.com/support/solutions/articles/44000718211-what-is-one-credit-).

    One request should not exceed the Map Matching API location limit depending on the package, see the pricing in our dashboard.
- name: Clustering
  description: |
    It solves the “capacity clustering problem” by assigning a set of customers to a given number of distinct groups (called clusters).
    The API “clusters” by minimizing the total distance from each individual customer to its designated group median.
    It can also consider minimum and maximum capacity restrictions for each group.

    Clustering can be used in many practical applications.
    For example, it can help to plan territories, i.e. territory optimization for field teams with large territories for field workers,
    or to solve large vehicle routing problems (VRP).

    Try Clustering in our [API Explorer](https://explorer.graphhopper.com/?endpoint=cluster)!

    The idea is to divide a certain number of customers, a pre-specified number of clusters. As already written above, a distribution is sought that minimizes the total cost (e.g. distance or time or a function of distance and time).
    We currently support two approaches.

    1. You can simply define a certain number of clusters via configuration ("clustering" with empty set of "clusters") and additionally how many customers should be in such a cluster.
    This is defined by an upper and lower limit ("min_quantity" and "max_quantity). The algorithm then searches for suitable clusters and divides the customers into these clusters.

    2. You can explicitly define clusters via "clusters". In this way, each individual cluster can be defined.
    This approach not only allows each cluster to have its own capacity upper and lower bound, but each cluster can also be assigned a fixed cluster center.
    In contrast to 1. the algorithm then does not search for a suitable center, but assigns the customers given the fixed centers to each cluster. Note that if you define clusters
    explicitly, any configuration of "clustering" will be overwritten by these explicit clusters.
- name: Custom Model
  description: "\nA custom model allows you to modify the default routing behavior\
    \ of a vehicle profile by specifying a set of rules in JSON language.\nThere are\
    \ three JSON properties to change a profile: `priority`, `speed` and `distance_influence`\
    \ that are described in great detail in the next sections and you can get a quick\
    \ overview in this [example-driven blog post](https://www.graphhopper.com/blog/2020/05/31/examples-for-customizable-routing/).\n\
    \nBut first we will give an introductory example for each of these JSON properties.\
    \ Let's start with `speed`:\n\n```json\n{\n  \"speed\": [{\n    \"if\": \"road_class\
    \ == MOTORWAY\",\n    \"limit_to\": \"90\"\n  }]\n}\n```\n\nAs you might have\
    \ already guessed this limits the speed on motorways to 90km/h.\nChanging the\
    \ speed will of course change the travel time, but at the same time this makes\
    \ other road classes more likely as well, so you can use this model to avoid motorways.\n\
    \nYou can immediately try this out in the Browser [on GraphHopper Maps](https://graphhopper.com/maps/?point=50.856527%2C12.876127&point=51.02952%2C13.295603&profile=car&custom_model=%7B%22speed%22%3A%5B%7B%22if%22%3A%22road_class+=%3D+MOTORWAY%22%2C%22limit_to%22%3A%2290%22%7D%5D%7D).\n\
    GraphHopper Maps offers an interactive text editor to comfortably enter custom\
    \ models.\nYou can open it by pressing the gear icon in the top left corner. It\
    \ will check the syntax of your custom model and mark errors in red. You can press\n\
    Ctrl+Space or Alt+Enter to retrieve auto-complete suggestions. Pressing Ctrl+Enter\
    \ will send a routing request for the\ncustom model you entered. To disable the\
    \ custom model you click the gear icon again.\n\nIn the second example we show\
    \ how to avoid certain road classes without changing the travel time:\n\n```json\n\
    {\n  \"priority\": [{\n    \"if\": \"road_class == LIVING_STREET || road_class\
    \ == RESIDENTIAL || road_class == UNCLASSIFIED\",\n    \"multiply_by\": \"0.1\"\
    \n  }]\n}\n```\n\nThis example avoids certain smaller streets. [View it in GraphHopper\
    \ Maps](https://graphhopper.com/maps/?point=51.125708%2C13.067915&point=51.125964%2C13.082271&profile=car&custom_model=%7B%22priority%22%3A%5B%7B%22if%22%3A%22road_class+=%3D+LIVING_STREET+%7C%7C+road_class+%3D%3D+RESIDENTIAL+%7C%7C+road_class+%3D%3D+UNCLASSIFIED%22%2C%22multiply_by%22%3A%220.1%22%7D%5D%7D).\n\
    \nThe third example shows how to prefer shortest paths:\n\n```json\n{\n  \"distance_influence\"\
    : 200\n}\n```\n\n[View this example in GraphHopper Maps](https://graphhopper.com/maps/?point=51.04188%2C13.057766&point=51.057527%2C13.068237&profile=car&custom_model=%7B%22distance_influence%22%3A200%7D).\n\
    \nThere is a fourth JSON property `areas` that allows you to define areas that\
    \ can then be used in the `if` or `else_if` conditions for `speed` and `priority`.\n\
    Please read more about this and the other properties below and try some examples\
    \ in\n[GraphHopper Maps](https://graphhopper.com/maps/) with the help of\n[this\
    \ blog post](https://www.graphhopper.com/blog/2020/05/31/examples-for-customizable-routing/).\n\
    \n\n## Customizing speed\n\nWhen using custom models you do not need to define\
    \ rules that specify a speed for every road segment, but rather GraphHopper\n\
    assumes a default speed. All you need to do is adjust this default speed to your\
    \ use-case as you will always use the custom \nmodel in conjunction with a routing\
    \ profile which is used to determine the default speed.\n\nThe custom model is\
    \ a JSON object and the first property we will learn about here is the `speed`\
    \ property. The `speed`\nproperty's value is a list of conditional statements\
    \ that modify the default speed. Every such statement consists of a\ncondition\
    \ and an operation. The different statements are applied to the default speed\
    \ from top to bottom, i.e.\nstatements that come later in the list are applied\
    \ to the resulting value of previous operations. Each statement is only\nexecuted\
    \ if the corresponding condition applies for the current road segment. This will\
    \ become more clear in the following\nexamples.\n\nCurrently the custom model\
    \ language supports two operators:\n\n- `multiply_by` multiplies the speed value\
    \ with a given number\n- `limit_to` limits the speed value to a given number\n\
    \n#### Conditional multiplication\n\nLet's start with a simple example using `multiply_by`:\n\
    \n```json\n{\n  \"speed\": [\n    {\n      \"if\": \"road_class == MOTORWAY\"\
    ,\n      \"multiply_by\": \"0.5\"\n    }\n  ]\n}\n```\n\nThis custom model reduces\
    \ the speed of every road segment for which the `road_class` attribute is `MOTORWAY`\
    \ to\nfifty percent of the default speed (the default speed is multiplied by `0.5`).\
    \ Again, the default speed is the speed\nthat GraphHopper would normally use for\
    \ the profile's vehicle. Note the `if` clause which means that the operation\n\
    (`multiply_by`) is only applied *if* the condition `road_class == MOTORWAY` is\
    \ fulfilled for the road segment under\nconsideration. The `==` indicates equality,\
    \ i.e. the condition reads \"the road_class equals MOTORWAY\". If you're a bit\n\
    familiar with programming note that the condition (the value of the `if` key)\
    \ is just a boolean condition in Java\nlanguage (other programming languages like\
    \ C or JavaScript are very similar in this regard). A more complex condition\n\
    could look like this: `road_class == PRIMARY || road_class == TERTIARY` which\
    \ uses the **or**\n(`||`) operator and literally means \"road_class equals PRIMARY\
    \ or road_class equals TERTIARY\".\n\nThere can be multiple such 'if statements'\
    \ in the speed section, and they are evaluated from top to bottom:\n\n```json\n\
    {\n  \"speed\": [\n    {\n      \"if\": \"road_class == MOTORWAY\",\n      \"\
    multiply_by\": \"0.5\"\n    },\n    {\n      \"if\": \"road_class == PRIMARY ||\
    \ road_environment == TUNNEL\",\n      \"multiply_by\": \"0.7\"\n    }\n  ]\n\
    }\n```\n\nIn this example the default speed of road segments with `road_class\
    \ == MOTORWAY` will be multiplied by `0.5`, the default speed\nof road segments\
    \ with `road_class == PRIMARY` will be multiplied by `0.7` and for road segments\
    \ with both `road_class == MOTORWAY` and\n`road_environment == TUNNEL` the default\
    \ speed will be multiplied first by `0.5` and then by `0.7`. So overall the\n\
    default speed will be multiplied by `0.35`. For road segments with `road_class\
    \ == PRIMARY` and `road_environment == TUNNEL` we\nonly multiply by `0.7`, even\
    \ though both parts of the second condition apply. It only matters whether the\
    \ road segment matches\nthe condition or not.\n\n`road_class` and `road_environment`\
    \ are road attributes of 'enum' type, i.e. their value can only be one of a fixed\
    \ set of\nvalues, like `MOTORWAY` for `road_class`.\n\nOther road attributes like\
    \ `road_class_link` are of `boolean` type. They can be used as conditions directly,\
    \ for example:\n\n```json\n{\n  \"speed\": [\n    {\n      \"if\": \"road_class_link\"\
    ,\n      \"multiply_by\": \"0.6\"\n    }\n  ]\n}\n```\n\nwhich means that for\
    \ road segments with `road_class_link==true` the speed factor will be `0.6`.\n\
    \nFor attributes with numeric values, like `max_width` you should not use the\
    \ `==` (equality) or `!=` (\ninequality) operators, but the numerical comparison\
    \ operators \"bigger\" `>`, \"bigger or equals\" `>=`, \"smaller\" `<`, or\n\"\
    smaller or equals\" `<=`, e.g.:\n\n```json\n{\n  \"speed\": [\n    {\n      \"\
    if\": \"max_width < 2.5\",\n      \"multiply_by\": \"0.8\"\n    }\n  ]\n}\n```\
    \ \n\nwhich means that for all road segments with `max_width` smaller than `2.5m`\
    \ the speed is multiplied by `0.8`.\n\n\n### Conditional capping\n\nBesides the\
    \ `multiply_by` operator there is also the `limit_to` operator. As the name suggests\
    \ `limit_to` limits the\ncurrent value to the given value. Take this example:\n\
    \n```json\n{\n  \"speed\": [\n    {\n      \"if\": \"road_class == MOTORWAY\"\
    ,\n      \"multiply_by\": \"0.8\"\n    },\n    {\n      \"if\": \"surface == GRAVEL\"\
    ,\n      \"limit_to\": \"60\"\n    }\n  ]\n}\n```\n\nThis implies that on all\
    \ road segments with the `GRAVEL` value for `surface` the speed will be at most\
    \ `60km/h`,\nregardless of the default speed and the previous rules. So for a\
    \ road segment with `road_class == MOTORWAY`,\n`surface == GRAVEL` and default\
    \ speed `100` the first statement reduces the speed from `100` to `80` and the\
    \ second\nstatement further reduces the speed from `80` to `60`. If the `road_class`\
    \ was `PRIMARY` and the default speed was `50`\nthe first rule would not apply\
    \ and the second rule would do nothing, because limiting `50` to `60` still yields\
    \ `50`.\n\nA common use-case for the `limit_to` operation is the following pattern:\n\
    \n```json\n{\n  \"speed\": [\n    {\n      \"if\": \"true\",\n      \"limit_to\"\
    : \"90\"\n    }\n  ]\n}\n```\n\nwhich means that the speed is limited to `90km/h`\
    \ for all road segments regardless of its properties. The condition\n\"`true`\"\
    \ is always fulfilled.\n\n### Conditionals with multiple branches\n\nThe `else`\
    \ statement allows you to define that some operations should be applied if an\
    \ road segment does **not** match a\ncondition. So this example:\n\n```json\n\
    {\n  \"speed\": [\n    {\n      \"if\": \"road_class == MOTORWAY\",\n      \"\
    multiply_by\": \"0.5\"\n    },\n    {\n      \"else\": \"\",\n      \"limit_to\"\
    : \"50\"\n    }\n  ]\n}\n```\n\nmeans that for all road segments with `road_class\
    \ == MOTORWAY` we multiply the default speed by `0.5` and for all others we\n\
    limit the default speed to `50` (but never both).\n\nIn case you want to distinguish\
    \ more than two cases (road segments that match or match not a condition) you\
    \ can use `else_if`\nstatements which are only evaluated in case the previous\
    \ `if` or `else_if` statement did **not** match:\n\n```json\n{\n  \"speed\": [\n\
    \    {\n      \"if\": \"road_class == MOTORWAY\",\n      \"multiply_by\": \"0.5\"\
    \n    },\n    {\n      \"else_if\": \"road_environment == TUNNEL\",\n      \"\
    limit_to\": \"70\"\n    },\n    {\n      \"else\": \"\",\n      \"multiply_by\"\
    : \"0.9\"\n    }\n  ]\n}\n```\n\nSo if the first condition matches (`road_class\
    \ == MOTORWAY`) the default speed is multiplied by `0.5`, but the other two\n\
    statements are ignored. Only if the first statement does not match (e.g. `road_class\
    \ == PRIMARY`) the second statement\nis even considered and only if it matches\
    \ (`road_environment == TUNNEL`) the default speed is limited to 70. The last\n\
    operation (`multiply_by: \"0.9\"`) is only applied if both previous conditions\
    \ did not match.\n\n`else` and `else_if` statements always require a preceding\
    \ `if` or `else_if` statement. However, there can be multiple\n'blocks' of subsequent\
    \ `if/else_if/else` statements in the list of rules for `speed`.\n\n`else_if`\
    \ is useful for example in case you have multiple `multiply_by` operations, but\
    \ you do not want that the speed\ngets reduced by all of them. For the following\
    \ model\n\n```json\n{\n  \"speed\": [\n    {\n      \"if\": \"road_class == MOTORWAY\"\
    ,\n      \"multiply_by\": \"0.5\"\n    },\n    {\n      \"else_if\": \"road_environment\
    \ == TUNNEL\",\n      \"multiply_by\": \"0.8\"\n    }\n  ]\n}\n```\n\nonly the\
    \ first factor (`0.5`) will be applied even for road segments that fulfill both\
    \ conditions.\n\n## Limit rules to certain areas\n\nYou can not only modify the\
    \ speed of road segments based on properties, like we saw in the previous examples,\
    \ but you\ncan also modify the speed of road segments based on their location.\
    \ To do this you need to first create and add some\nareas to the `areas` section\
    \ of the custom model. You can then use the name of these areas in the conditions\
    \ of your\n`if/else/else_if` statements.\n\nIn the following example we multiply\
    \ the speed of all road segments in an area called `custom1` with `0.7` and also\
    \ limit it\nto `50km/h`. Note that each area's name needs to be prefixed with\
    \ `in_`:\n\n```json\n{\n  \"speed\": [\n    {\n      \"if\": \"in_custom1\",\n\
    \      \"multiply_by\": \"0.7\"\n    },\n    {\n      \"if\": \"in_custom1\",\n\
    \      \"limit_to\": \"50\"\n    }\n  ],\n  \"areas\": {\n    \"type\": \"FeatureCollection\"\
    ,\n    \"features\": [{\n      \"type\": \"Feature\",\n      \"id\": \"custom1\"\
    ,\n      \"geometry\": {\n        \"type\": \"Polygon\",\n        \"coordinates\"\
    : [\n          [\n            [\n              1.525,\n              42.511\n\
    \            ],\n            [\n              1.510,\n              42.503\n \
    \           ],\n            [\n              1.531,\n              42.495\n  \
    \          ],\n            [\n              1.542,\n              42.505\n   \
    \         ],\n            [\n              1.525,\n              42.511\n    \
    \        ]\n          ]\n        ]\n      }\n    }]\n  }\n}\n```\n\nAreas are\
    \ given in GeoJson format (FeatureCollection). Currently a member of this collection\
    \ must be a `Feature` with a\ngeometry type `Polygon`. Note that the coordinates\
    \ array of `Polygon` is an array of arrays that\neach must describe a closed ring,\
    \ i.e. the first point must be equal to the last, identical to the GeoJSON specs.\n\
    Each point is given as an array [longitude, latitude], so the `coordinates` array\
    \ has three dimensions total.\n\nUsing the `areas` feature you can also block\
    \ entire areas i.e. by multiplying the speed with `0`, but for this you\nshould\
    \ rather use the `priority` section that we will explain next.\n\n## Customizing\
    \ priority\n\nMake sure you read the introductory section of this document to\
    \ learn what the `priority` factor means. In short it\nallows similar modifications\
    \ as `speed`, but instead of modifying the road segment weights *and* travel times\
    \ it will only\naffect the weights. By default, the priority is `1` for every\
    \ road segment, so it does not affect the weight. However,\nchanging the priority\
    \ of a road can yield a relative weight difference in comparison to other roads.\n\
    \nCustomizing the `priority` works very much like changing the `speed`, so in\
    \ case you did not read the section about\n`speed` you should go back there and\
    \ read it now. The only real difference is that there is no `limit_to` operator\
    \ for\n`priority`. As a quick reminder here is an example for priority:\n\n```json\n\
    {\n  \"priority\": [\n    {\n      \"if\": \"road_class == MOTORWAY\",\n     \
    \ \"multiply_by\": \"0.5\"\n    },\n    {\n      \"else_if\": \"road_class ==\
    \ SECONDARY\",\n      \"multiply_by\": \"0.9\"\n    },\n    {\n      \"if\": \"\
    road_environment == TUNNEL\",\n      \"multiply_by\": \"0.1\"\n    }\n  ]\n}\n\
    ```\n\nmeans that road segments with `road_class==MOTORWAY` and `road_environment==TUNNEL`\
    \ get priority `0.5*0.1=0.05` and\nthose with `road_class==SECONDARY` and no TUNNEL,\
    \ get priority `0.9` and so on.\n\nEdges with lower priority values will be less\
    \ likely part of the optimal route calculated by GraphHopper, higher values\n\
    mean that these road segments shall be preferred. If you do not want to state\
    \ which road segments shall be avoided, but\nrather which ones shall be preferred,\
    \ you need to **decrease** the priority of others:\n\n```json\n{\n  \"priority\"\
    : [\n    {\n      \"if\": \"road_class != CYCLEWAY\",\n      \"multiply_by\":\
    \ \"0.8\"\n    }\n  ]\n}\n```\n\nmeans decreasing the priority for all road_classes\
    \ *except* cycleways.\n\nJust like we saw for `speed` you can also adjust the\
    \ priority for road segments in a certain area. It works exactly the\nsame way:\n\
    \n```json\n{\n  \"priority\": [\n    {\n      \"if\": \"in_custom1\",\n      \"\
    multiply_by\": \"0.7\"\n    }\n  ]\n}\n```\n\nTo block an entire area set the\
    \ priority value to `0`. You can even set the priority only for certain roads\
    \ in an area\nlike this:\n\n```json\n{\n  \"priority\": [\n    {\n      \"if\"\
    : \"road_class == MOTORWAY && in_custom1\",\n      \"multiply_by\": \"0.1\"\n\
    \    }\n  ]\n}\n```\n\nSome other useful attributes to restrict access to certain\
    \ roads depending on your vehicle dimensions are the\nfollowing:\n\n```json\n\
    {\n  \"priority\": [\n    {\n      \"if\": \"max_width < 2.5\",\n      \"multiply_by\"\
    : \"0\"\n    },\n    {\n      \"if\": \"max_length < 10\",\n      \"multiply_by\"\
    : \"0\"\n    },\n    {\n      \"if\": \"max_weight < 3.5\",\n      \"multiply_by\"\
    : \"0\"\n    }\n  ]\n}\n```\n\nwhich means that the priority for all road segments\
    \ that allow a maximum vehicle width of `2.5m`, a maximum vehicle\nlength of `10m`\
    \ or a maximum vehicle weight of `3.5tons`, or less, is zero, i.e. these \"narrow\"\
    \ road segments are\nblocked.\n\n## Customizing distance_influence\n\nThe `distance_influence`\
    \ property allows you to control the trade-off between a fast route (minimum time)\
    \ and a short route\n(minimum distance). The larger `distance_influence` is the\
    \ more GraphHopper will prioritize routes with a small\ntotal distance. More precisely,\
    \ the `distance_influence` is the time you need to save on a detour (a longer\
    \ distance\nroute option) such that you prefer taking the detour compared to a\
    \ shorter route. Please note that this value is a number, not a string.\n\nA value\
    \ of `100` means that one extra kilometer of detour must save you `100s` of travelling\
    \ time or else you are not \nwilling to take the detour. Or to put it another\
    \ way, if a reference route takes `600s` and is `10km` long, \n`distance_influence=100`\
    \ means that you are willing to take an alternative route that is `11km` long\
    \ only if \nit takes no longer than `500s` (saves `100s`). Things get a bit more\
    \ complicated when `priority` is not `1`, but the \neffect stays the same: The\
    \ larger `distance_influence` is, the more GraphHopper will focus on finding short\
    \ routes.\n\n\n## Road attributes\n\nGraphHopper stores different attributes for\
    \ every road segment. Some frequently used are the following (some of their possible\
    \ values are given in brackets):\n\n- road_class: (OTHER, MOTORWAY, TRUNK, PRIMARY,\
    \ SECONDARY, TRACK, STEPS, CYCLEWAY, FOOTWAY, ...)\n- road_environment: (ROAD,\
    \ FERRY, BRIDGE, TUNNEL, ...)\n- road_access: (DESTINATION, DELIVERY, PRIVATE,\
    \ NO, ...)\n- surface: (PAVED, DIRT, SAND, GRAVEL, ...)\n- smoothness: (EXCELLENT,\
    \ GOOD, INTERMEDIATE, ...)\n- toll: (MISSING, NO, HGV, ALL)\n- bike_network, foot_network:\
    \ (MISSING, INTERNATIONAL, NATIONAL, REGIONAL, LOCAL, OTHER)\n- country: (`MISSING`\
    \ or the country as a `ISO3166-1:alpha3` code e.g. `DEU`)\n- hazmat: (YES, NO),\
    \ hazmat_tunnel: (A, B, .., E), hazmat_water: (YES, PERMISSIVE, NO)\n- hgv: (MISSING,\
    \ YES, DESIGNATED, ...)\n- track_type: (MISSING, GRADE1, GRADE2, ..., GRADE5)\n\
    - urban_density: (RURAL, RESIDENTIAL, CITY)\n\n\nTo learn about all available\
    \ encoded values you can query the `/info` endpoint\n\nBesides this kind of categories,\
    \ which can take multiple different string values, there are also some that represent\
    \ a\nboolean value (they are either true or false for a given road segment), like:\n\
    \n- road_class_link\n- roundabout\n\nThere are also some that take on a numeric\
    \ value, like:\n\n- average_slope: a number for 100 * \"elevation change\" / edge_distance\
    \ for a road segment; it changes the sign in reverse direction; see also max_slope\n\
    - curvature: \"beeline distance\" / edge_distance (0..1) e.g. a curvy road is\
    \ smaller than 1\n- hike_rating, horse_rating, mtb_rating: a number from 0 to\
    \ 6 for the `sac_scale` in OSM, e.g. 0 means \"missing\", 1 means \"hiking\",\
    \ 2 means \"mountain_hiking\" and so on\n- lanes: number of lanes\n- max_slope:\
    \ an unsigned decimal for the maximum slope (100 * \"elevation change / distance_i\"\
    ) of an edge with `sum(distance_i)=edge_distance`. Important for longer road segments\
    \ where ups (or downs) can be much bigger than the average_slope.\n- max_speed:\
    \ the speed limit from a sign (km/h)\n- max_height (meter), max_width (meter),\
    \ max_length (meter)\n- max_weight (ton)\n\n\n## Limitations\n\nYou can directly\
    \ use custom models with the [POST Route Endpoint](#operation/postRoute).\n\n\
    To use custom models with the Route Optimization API or the Matrix API, use the\
    \ [Profiles API](#tag/Custom-Profiles)\nto create a new named profile with your\
    \ custom model. You can then use that profile like you\nwould use a pre-defined\
    \ profile.\n\nThis feature will strongly benefit from feedback, so do not hesitate\
    \ to share your experience, your favorite custom\nmodel or some of the problems\
    \ you ran into when you tried building your own custom model.\n\n## Troubleshooting\n\
    \n### Recommendations\n\nFor debugging you can use the custom model editor in\
    \ [GraphHopper Maps](https://graphhopper.com/maps/) (click the 'gear' button in\
    \ the top left).\n\nWhen debugging problems with custom models you should first\
    \ try if your request goes through without an error using an empty custom model.\n\
    \n### Route calculation is slower\n\nThe route calculation with custom_models\
    \ will be slower as a different algorithm has to be used. The more the result\
    \ deviates from the optimum the slower the response can get.\n\nIf you create\
    \ [custom profile](#tag/Custom-Profiles) with a custom_model you'll get faster\
    \ response times nearly as fast as the default vehicle profile.\n\nIf a custom\
    \ profile is not something you can use then for certain use cases you can make\
    \ the route calculation faster when you tune the `custom_model` and e.g. exclude\
    \ certain ways via `{ \"if\": \"road_class == TRACK || road_class == RESIDENTIAL\"\
    , \"multiply_by\": \"0\" }` in the `priority`.\n\nIf this is still not sufficient\
    \ and you need even faster response times, you can use the parameter `astarbi.epsilon`\
    \ (`>=1`). This enables a heuristic that speeds up routing \nbut may occasionally\
    \ cause unwanted detours. The closer this value is to 1, the nearer the route\
    \ is to optimal.\nIn practice, a value 1.3-1.4 provides good speed improvements\
    \ (10-20%) while causing little to no deviation from the optimal route in most\
    \ cases.\n\n### All routes for my custom model fail\n\nThis could mean that either\
    \ your custom model made some of the roads near the start and destination inaccessible,\
    \ \nthen usually we return a PointNotFoundException with the point_index with\
    \ the \"location snap\" problem.\n\nOr, the custom model made a route between\
    \ your start and destination impossible, then we return a ConnectionNotFoundException.\
    \ This happens e.g. when you exclude tunnels, \nferries or motorways but all routes\
    \ between start and destination have these road attributes satisfied, i.e. we\
    \ cannot find a route.\n\n**Solution for both cases**: relax your custom model\
    \ and e.g. instead of excluding certain road attributes via `\"multiply_by\":\
    \ \"0\"` you should try to use `\"0.01\"`.\n"
- name: Custom Profiles
  description: |2

    You can create routing profiles that are customized to your needs. You can take advantage of
    all the modelling options described in the [Custom Model section](#tag/Custom-Model) and use the created custom profile (prefix `cp_`)
    with our Routing, Matrix and Route Optimization APIs.

    Note that the geographic coverage of a custom profile is restricted and the maximum possible coverage depends on the selected plan.

    A curl example to create a profile:

    ```
    curl -X POST -H "Content-Type: application/json" "https://graphhopper.com/api/1/profiles?key=YOUR_KEY" -d '{"bounds":{"bbox":[11.45462,48.00954,11.77322,48.2076]},"custom_model":{"priority":[{"if":"road_class == MOTORWAY","multiply_by":"0"}]},"profile":"car"}'
    ```

    Instead of a rectangle (`bbox`) the `bounds` can also be one or more polygons as GeoJSON features:

    ```
    "bounds": { "features": [ { "type": "Feature", "geometry": { "type": "Polygon", "coordinates": [[[11.8, 48.14], [11.73, 48.24], [11.57, 48.29], [11.42, 48.24], [11.35, 48.14], [11.42, 48.03], [11.57, 47.99], [11.73, 48.03], [11.8, 48.14]]] } } ] }
    ```

    To quickly test your custom_model you can use the Routing API where a different custom model can be specified in every request.
    Or use [GraphHopper Maps](https://graphhopper.com/maps/) and click the gear button.

    **Creating custom profiles using the API Explorer**

    Besides using the `/profiles` endpoint directly you can also create custom profiles using [our API explorer](https://explorer.graphhopper.com/?endpoint=profiles).

     1. Visit the [API explorer](https://explorer.graphhopper.com/?endpoint=profiles).
     2. Set your API key with the "API key" button.
     2. Now copy and paste the JSON to create a custom profile into the input window. To get started you can use the already pre-filled example, which will create a
        custom profile that excludes motorways and is limited to the Munich area.
     3. Click "Send". This creates a custom profile. Copy the returned `id` from the output window (it starts with `cp_`).
     4. To try this profile out you change the drop down to "Optimization API", pick the first example and replace `car` in `"profile": "car"` (`vehicle_types` section) with the profile `id` you just copied and click "Send".

    The optimized route no longer uses motorways. Keep in mind that this is a simple example and the custom model language
    is a lot more powerful than this with which you can avoid, exclude or prefer certain areas or road classes and a lot more.
    Make sure you read the [Custom Model section](#tag/Custom-Model) to learn about all the details.

    Note that you can use the profile `id` just as well for the `/matrix` or `/route` endpoint. E.g. select "Routing API"
    and use the profile `id` in the request.
paths:
  /route:
    get:
      tags:
      - Routing
      summary: Calculate a route
      description: "For the GET request you specify the parameters in the URL and\
        \ can try it directly in every browser.\nHowever, it has some disadvantages\
        \ when using many points (URL length limit) and the [`custom_model` Feature](#tag/Custom-Model)\
        \ cannot be used. \nTherefore, our recommended endpoint is the [POST route\
        \ endpoint](#operation/postRoute).\n"
      operationId: getRoute
      parameters:
      - name: profile
        in: query
        required: false
        style: form
        explode: true
        schema:
          $ref: "#/components/schemas/VehicleProfileId"
      - name: point
        in: query
        description: |
          The points for which the route should be calculated. Format: `latitude,longitude`. Specify at least an origin and a destination. Via points are possible.
          The maximum number depends on your plan.
        required: true
        style: form
        explode: true
        schema:
          type: array
          items:
            type: string
        example:
        - "51.131,12.414"
        - "48.224,3.867"
      - name: point_hint
        in: query
        description: |
          The `point_hint` is typically a road name to which the associated `point` parameter should be snapped to. Specify no `point_hint` parameter or the same number as you have `point` parameters.
        required: false
        style: form
        explode: true
        schema:
          type: array
          items:
            type: string
      - name: snap_prevention
        in: query
        description: |
          Optional parameter. 'Snapping' is the process of finding the closest road location for GPS coordinates provided in the `point` parameter. The `snap_prevention` parameter allows you to prevent snapping to specific types of roads. For example, if `snap_prevention` is set to bridge, the routing engine will avoid snapping to a bridge, even if it is the closest road for the given `point`. Current supported values: `motorway`, `trunk`, `ferry`, `tunnel`, `bridge` and `ford`. Multiple values are specified like `snap_prevention=ferry&snap_prevention=motorway`. Note that once snapped the routing algorithm can still route over bridges (or the other values). To avoid this you need to use the `custom_model`.
        required: false
        style: form
        explode: true
        schema:
          type: array
          items:
            type: string
      - name: curbside
        in: query
        description: |
          Optional parameter. It specifies on which side a point should be relative to the driver when she leaves/arrives at a start/target/via point. You need to specify this parameter for either none or all points. Only supported for motor vehicles and OpenStreetMap.
        required: false
        style: form
        explode: true
        schema:
          type: array
          items:
            type: string
            enum:
            - any
            - right
            - left
      - name: locale
        in: query
        description: |
          The locale of the resulting turn instructions. E.g. `pt_PT` for Portuguese or `de` for German.
        required: false
        style: form
        explode: true
        schema:
          type: string
          default: en
      - name: elevation
        in: query
        description: |
          If `true`, a third coordinate, the altitude, is included with all positions in the response.
          This changes the format of the `points` and `snapped_waypoints` fields of the response, in both their
          encodings. Unless you switch off the `points_encoded` parameter, you need special code on the
          client side that can handle three-dimensional coordinates.
        required: false
        style: form
        explode: true
        schema:
          type: boolean
          default: false
      - name: details
        in: query
        description: "Optional parameter. The following path details are available:\
          \ `street_name`, `street_ref`, `street_destination`, `leg_time`, `leg_distance`,\
          \ `roundabout`, `country`, `time`, `distance`, `max_speed`,\n`max_weight`,\
          \ `max_width`, `toll`, `road_class`, `road_class_link`, `road_access`, `road_environment`,\
          \ `hazmat`, `hazmat_tunnel`, `hazmat_water`, \n`lanes`, `surface`, `smoothness`,\
          \ `hike_rating`, `mtb_rating`, `foot_network`, `bike_network`. Read more\
          \ about the usage of path details [here](https://discuss.graphhopper.com/t/2539).\n"
        required: false
        style: form
        explode: true
        schema:
          type: array
          items:
            type: string
      - name: optimize
        in: query
        description: |
          Normally, the calculated route will visit the points in the order you specified them.
          If you have more than two points, you can set this parameter to `"true"` and the points may be re-ordered to minimize the total travel time.
          Keep in mind that the limits on the number of locations of the Route Optimization API applies, and the request costs more credits.
          If you set it to "true" then it cannot be used with `ch.disable: true`. If you still want to use the custom model with route optimization, then you'll need to use the [Profiles API](#tag/Custom-Profiles).
        required: false
        style: form
        explode: true
        schema:
          type: string
          default: "false"
      - name: instructions
        in: query
        description: |
          If instructions should be calculated and returned
        required: false
        style: form
        explode: true
        schema:
          type: boolean
          default: true
      - name: calc_points
        in: query
        description: |
          If the points for the route should be calculated at all.
        required: false
        style: form
        explode: true
        schema:
          type: boolean
          default: true
      - name: debug
        in: query
        description: |
          If `true`, the output will be formatted.
        required: false
        style: form
        explode: true
        schema:
          type: boolean
          default: false
      - name: points_encoded
        in: query
        description: |
          Allows changing the encoding of location data in the response. The default is polyline encoding, which is compact
          but requires special client code to unpack. (We provide it in our JavaScript client library!)
          Set this parameter to `false` to switch the encoding to simple coordinate pairs like `[lon,lat]`, or `[lon,lat,elevation]`.
          See the description of the response format for more information.
        required: false
        style: form
        explode: true
        schema:
          type: boolean
          default: true
      - name: ch.disable
        in: query
        description: |
          Use `true` to enable the flexible mode to use the `custom_model` or any of the following options below.
        required: false
        style: form
        explode: true
        schema:
          type: boolean
          default: false
      - name: heading
        in: query
        description: |
          Favour a heading direction for a certain point. Specify either one heading for the start point or as many as there are points.
          In this case headings are associated by their order to the specific points. Headings are given as north based clockwise angle between 0 and 360 degree.
          This parameter also influences the tour generated with `algorithm=round_trip` and forces the initial direction.  Requires `ch.disable=true`.
        required: false
        style: form
        explode: true
        schema:
          type: array
          items:
            type: integer
            format: int32
      - name: heading_penalty
        in: query
        description: |
          Time penalty in seconds for not obeying a specified heading. Requires `ch.disable=true`.
        required: false
        style: form
        explode: true
        schema:
          type: integer
          format: int32
          default: 300
      - name: pass_through
        in: query
        description: |
          If `true`, u-turns are avoided at via-points with regard to the `heading_penalty`. Requires `ch.disable=true`.
        required: false
        style: form
        explode: true
        schema:
          type: boolean
          default: false
      - name: algorithm
        in: query
        description: "Rather than looking for the shortest or fastest path, this parameter\
          \ lets you solve two different problems related to routing:\nWith `alternative_route`,\
          \ we give you not one but several routes that are close to optimal, but\n\
          not too similar to each other. Limitation: works with custom_model but not\
          \ with custom profiles.\nWith `round_trip`, the route will get you back\
          \ to where you started. This is meant for fun (think of\na bike trip), so\
          \ we will add some randomness.\nYou can control both of these features with\
          \ additional parameters, see below. \n"
        required: false
        style: form
        explode: true
        schema:
          type: string
          enum:
          - round_trip
          - alternative_route
      - name: round_trip.distance
        in: query
        description: |
          If `algorithm=round_trip`, this parameter configures approximative length of the resulting round trip.
        required: false
        style: form
        explode: true
        schema:
          type: integer
          format: int32
          default: 10000
      - name: round_trip.seed
        in: query
        description: |
          If `algorithm=round_trip`, this sets the random seed. Change this to get a different tour for each value.
        required: false
        style: form
        explode: true
        schema:
          type: integer
          format: int64
      - name: alternative_route.max_paths
        in: query
        description: |
          If `algorithm=alternative_route`, this parameter sets the number of maximum paths which should be calculated. Increasing can lead to worse alternatives.
        required: false
        style: form
        explode: true
        schema:
          type: integer
          format: int32
          default: 2
      - name: alternative_route.max_weight_factor
        in: query
        description: |
          If `algorithm=alternative_route`, this parameter sets the factor by which the alternatives routes can be longer than the optimal route. Increasing can lead to worse alternatives.
        required: false
        style: form
        explode: true
        schema:
          type: number
          default: 1.4
      - name: alternative_route.max_share_factor
        in: query
        description: |
          If `algorithm=alternative_route`, this parameter specifies how similar an alternative route can be to the optimal route. Increasing can lead to worse alternatives.
        required: false
        style: form
        explode: true
        schema:
          type: number
          default: 0.6
      responses:
