              description: Your remaining credits until the reset. This value is measured
                before the current request's cost is deducted. Subtract `X-RateLimit-Credits`
                to get the balance after the request.
              style: simple
              explode: false
              schema:
                type: integer
            X-RateLimit-Reset:
              description: The number of seconds that you have to wait before a reset
                of the credit count is done.
              style: simple
              explode: false
              schema:
                type: integer
            X-RateLimit-Credits:
              description: "The credit costs for this request. Note it could be a\
                \ decimal and even negative number, e.g. when an async request failed."
              style: simple
              explode: false
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileResponse"
  /profiles/calculate:
    post:
      tags:
      - Custom Profiles
      summary: Submit a profile creation job
      description: |
        An alternate endpoint for computing a profile for a large boundary asynchronously, where a request against the regular
        endpoint would result in a timeout.

        The request format is the same, but instead of the result, you are given a job identification number that
        you can use to retrieve the result once it is available.
      operationId: calculateProfile
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileRequest"
        required: true
      responses:
        "200":
          description: A jobId you can use to retrieve the calculated profile.
          headers:
            X-RateLimit-Limit:
              description: Your current daily credit limit.
              style: simple
              explode: false
              schema:
                type: integer
            X-RateLimit-Remaining:
              description: Your remaining credits until the reset. This value is measured
                before the current request's cost is deducted. Subtract `X-RateLimit-Credits`
                to get the balance after the request.
              style: simple
              explode: false
              schema:
                type: integer
            X-RateLimit-Reset:
              description: The number of seconds that you have to wait before a reset
                of the credit count is done.
              style: simple
              explode: false
              schema:
                type: integer
            X-RateLimit-Credits:
              description: "The credit costs for this request. Note it could be a\
                \ decimal and even negative number, e.g. when an async request failed."
              style: simple
              explode: false
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobId"
  /profiles/solution/{jobId}:
    get:
      tags:
      - Custom Profiles
      summary: Retrieve result of a profile creation job
      operationId: getProfileSolution
      parameters:
      - name: jobId
        in: path
        description: The jobId you received when you submitted the job.
        required: true
        style: simple
        explode: false
        schema:
          type: string
      responses:
        "200":
          description: A response containing the custom profile
          headers:
            X-RateLimit-Limit:
              description: Your current daily credit limit.
              style: simple
              explode: false
              schema:
                type: integer
            X-RateLimit-Remaining:
              description: Your remaining credits until the reset. This value is measured
                before the current request's cost is deducted. Subtract `X-RateLimit-Credits`
                to get the balance after the request.
              style: simple
              explode: false
              schema:
                type: integer
            X-RateLimit-Reset:
              description: The number of seconds that you have to wait before a reset
                of the credit count is done.
              style: simple
              explode: false
              schema:
                type: integer
            X-RateLimit-Credits:
              description: "The credit costs for this request. Note it could be a\
                \ decimal and even negative number, e.g. when an async request failed."
              style: simple
              explode: false
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InlineResponse2001"
  /profiles/{profileId}:
    delete:
      tags:
      - Custom Profiles
      summary: Delete a custom routing profile
      operationId: deleteProfile
      parameters:
      - name: profileId
        in: path
        description: The profile to delete
        required: true
        style: simple
        explode: false
        schema:
          type: string
          example: cp_shc_1_4390ba24-e6cb-406b-acc6-3402dd4d229d
      responses:
        "200":
          description: A response containing the status
          headers:
            X-RateLimit-Limit:
              description: Your current daily credit limit.
              style: simple
              explode: false
              schema:
                type: integer
            X-RateLimit-Remaining:
              description: Your remaining credits until the reset. This value is measured
                before the current request's cost is deducted. Subtract `X-RateLimit-Credits`
                to get the balance after the request.
              style: simple
              explode: false
              schema:
                type: integer
            X-RateLimit-Reset:
              description: The number of seconds that you have to wait before a reset
                of the credit count is done.
              style: simple
              explode: false
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InlineResponse2002"
components:
  schemas:
    CostMatrixDataInfo:
      type: object
      properties:
        copyrights:
          type: array
          items:
            type: string
        took:
          type: number
          format: double
      description: Additional information for your request
    Address:
      required:
      - lat
      - location_id
      - lon
      type: object
      properties:
        location_id:
          type: string
          description: Specifies the id of the location.
          example: 550e8400-e29b-11d4-a716-446655440000
        name:
          type: string
          description: Name of location.
          example: "Queens Victoria Street 70, Second Floor, Flat 245"
        lon:
          type: number
          description: Longitude of location.
          format: double
          example: -0.092869
        lat:
          type: number
          description: Latitude of location.
          format: double
          example: 51.512665
        street_hint:
          type: string
          description: "Optional parameter. Specifies a hint containing the street\
            \ name to better snap the coordinates (lon,lat) to the road network. For\
            \ example, if an address or building has two or more neighboring streets,\
            \ you can control which street is used to find the closest location."
          example: Queens Victoria Street 70
        curbside:
          type: string
          description: |
            Optional parameter. Specifies on which side a point should be relative to the driver when they leave/arrive at a start/target/via point. Only supported for motor vehicles and OpenStreetMap.
            If you would like to arrive at this address without having to cross the street, use `curbside=right/left` for countries with right/left-hand driving. Using `curbside=any` is the same as not specifying this parameter at all.
          default: any
          enum:
          - right
          - left
          - any
    Configuration:
      type: object
      properties:
        routing:
          $ref: "#/components/schemas/Routing"
        optimization:
          $ref: "#/components/schemas/Optimization"
      description: Specifies general configurations that are taken into account when
        solving the vehicle routing problem.
    TimeWindowBreak:
      required:
      - duration
      - earliest
      - latest
      type: object
      properties:
        earliest:
          type: integer
          description: Specifies the earliest start time of the break in seconds.
          format: int64
          example: 1550136467
        latest:
          type: integer
          description: Specifies the latest start time of break in seconds.
          format: int64
          example: 1550148467
        duration:
          type: integer
          description: Specifies the duration of the break in seconds.
          format: int64
          example: 2700
    Stop:
      type: object
      properties:
        address:
          $ref: "#/components/schemas/Address"
        duration:
          maximum: 604800
          minimum: 0
          type: integer
          description: "Specifies the duration of the pickup or delivery in seconds,\
            \ e.g. how long it takes to load or unload items. This time is charged\
            \ for each stop—if multiple pickups or deliveries occur at the same location,\
            \ their durations are summed."
          format: int64
          example: 1800
          default: 0
        preparation_time:
          maximum: 604800
          minimum: 0
          type: integer
          description: "Specifies the preparation time in seconds. This time is added\
            \ after arrival and before the pickup or delivery can begin, modeling\
            \ tasks like finding a parking spot. Preparation time is only charged\
            \ once when the location differs from the previous stop—if multiple consecutive\
            \ activities share the same location, it is applied only to the first."
          format: int64
          example: 300
          default: 0
        setup_time:
          maximum: 604800
          minimum: 0
          type: integer
          description: "Specifies the setup time in seconds. This is a fixed overhead\
            \ charged when arriving at a new location (e.g., dock check-in, security\
            \ clearance, equipment preparation). Unlike `duration`, setup time is\
            \ only charged once per location—if multiple consecutive activities share\
            \ the same location, it is applied only to the first. The activity timeline\
            \ is: arrival → preparation_time → waiting (if early) → setup_time → duration."
          format: int64
          example: 600
          default: 0
        time_windows:
          type: array
          description: "Specifies an array of time window objects (see time window\
            \ object below). For example, if an item needs to be delivered between\
            \ 7am and 10am then specify the array as follows: [ { \"earliest\": 25200,\
            \ \"latest\" : 32400 } ] (starting the day from 0 in seconds)."
          example:
          - earliest: 32400
            latest: 36000
          - earliest: 50400
            latest: 54000
          items:
            $ref: "#/components/schemas/TimeWindow"
        group:
          type: string
          description: "Group this stop belongs to. Orders with the same group label\
            \ are treated as a contiguous cluster — they stay together as a block,\
            \ but the optimizer picks the internal sequence. Groups can also be referenced\
            \ in group-level relations to enforce constraints like `in_sequence` across\
            \ entire clusters."
          example: ASAP
    ClusterRequest:
      type: object
      properties:
        configuration:
          $ref: "#/components/schemas/ClusterConfiguration"
        clusters:
          type: array
          items:
            $ref: "#/components/schemas/Clusters"
        customers:
          type: array
          items:
            $ref: "#/components/schemas/ClusterCustomer"
    GeocodingResponse:
