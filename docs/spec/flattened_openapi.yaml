        id: cp_shc_1_6544924f-4d20-4f71-b86d-6b1f0740fcf8
        profile: car
        bounds:
          bbox:
          - 11.45462
          - 48.00954
          - 11.77322
          - 48.2076
        custom_model:
          areas:
            type: FeatureCollection
            features: []
          priority:
          - if: road_access == PRIVATE
            multiply_by: "0"
          - if: road_class == MOTORWAY
            multiply_by: "0"
          speed: []
    Algorithm:
      type: object
      properties:
        problem_type:
          type: string
          enum:
          - min
          - min-max
        objective:
          type: string
          enum:
          - transport_time
          - completion_time
      description: Use `objectives` instead.
      deprecated: true
    BadRequest:
      type: object
      properties:
        message:
          type: string
          description: Short error message
          example: Bad Request
        hints:
          type: array
          description: Optional error information.
          items:
            $ref: "#/components/schemas/ErrorMessage"
        status:
          type: string
          description: status
          example: finished
          default: finished
    Objective:
      required:
      - type
      - value
      type: object
      properties:
        type:
          type: string
          description: |
            Type of objective function, i.e. `min`, `min-max`, or `balance`.

             * `min`: Minimizes the objective value.
             * `min-max`: Minimizes the maximum objective value.
             * `balance`: **(Beta)** Optimizes for balanced workloads across drivers. Use with `value: completion_time` to balance working time, or `value: activities` to balance the number of stops per driver.

            For instance, `min` -> `vehicles` minimizes the number of employed vehicles.
            `min` -> `completion_time` minimizes the sum of your vehicle routes' completion time.

            If you use, for example, `min-max` -> `completion_time`, it minimizes the maximum of your vehicle routes' completion time, i.e. it minimizes the overall makespan.
            This only makes sense if you have more than one vehicle. In case of one vehicle, switching from `min` to `min-max` should not have any impact.
            If you have more than one vehicle, then the algorithm tries to constantly move stops from one vehicle to another such that
            the completion time of longest vehicle route can be further reduced. For example, if you have one vehicle that takes 8 hours
            to serve all customers, adding another vehicle (and using `min-max`) might halve the time to serve all customers to 4 hours. However,
            this usually comes with higher transport costs.

            If you want to minimize `vehicles` first and, second, `completion_time`, you can also combine different objectives like this:

            ```json
            "objectives" : [
               {
                  "type": "min",
                  "value": "vehicles"
               },
               {
                  "type": "min",
                  "value": "completion_time"
               }
            ]
            ```

            If you want to balance activities or the number of stops among all employed drivers, you need to specify it as follows:

            ```json
            "objectives" : [
               {
                  "type": "min-max",
                  "value": "completion_time"
               },
               {
                  "type": "min-max",
                  "value": "activities"
               }
            ]
            ```

            #### Balance Objective (Beta)

            The `balance` objective type provides a more sophisticated approach to workload balancing compared to `min-max`.
            While `min-max` only minimizes the maximum route value, `balance` optimizes for equal distribution of work across all drivers
            by minimizing the coefficient of variation (CV) of workloads.

            Use `balance` with:
             * `value: completion_time` - Balance working time (service time + travel time + waiting time) across drivers
             * `value: activities` - Balance the number of stops per driver

            The optional `level` parameter (1-3) controls how strongly to prioritize balance:
             * `level: 1` - Mild balance preference, allows some variation for better travel efficiency
             * `level: 2` - Moderate balance (default), good trade-off between balance and efficiency
             * `level: 3` - Strict balance, prioritizes equal workloads even at the cost of longer travel

            Example:
            ```json
            "objectives" : [
               {
                  "type": "balance",
                  "value": "completion_time",
                  "level": 2
               }
            ]
            ```

            **When to use `balance` vs `min-max`:**
             * Use `balance` when you want all drivers to have similar workloads (fairness)
             * Use `min-max` when you only care about minimizing the longest route (makespan)

            **Note:** The `balance` objective currently only supports services. Requests that combine `balance` objectives with shipments will return a `400` error.
          default: min
          enum:
          - min
          - min-max
          - balance
        value:
          type: string
          description: |
            The value of the objective function.
            The objective value `transport_time` solely considers the time
            your drivers spend on the road, i.e. transport time. In contrary to `transport_time`, `completion_time` also takes waiting times at customer sites into account.
            The `completion_time` of a route is defined as the time from starting to ending the route,
            i.e. the route's transport time, the sum of waiting times plus the sum of activity durations.
            The `completion_time_last_stop`, on the other hand, refers to the completion time of the very last order in a tour or, in other words,
            the completion time without the last section from the last stop to the end of the tour.
            This is typically used if the orders are to be processed as quickly as possible.
            If you solely want to minimize route duration, you should use simply use `route_duration`.
            The objective value `vehicles` can only be used along with `min` and minimizes vehicles.

            For `balance` objective type, only `completion_time` and `activities` are supported.
          default: transport_time
          enum:
          - completion_time
          - completion_time_last_stop
          - route_duration
          - transport_time
          - vehicles
          - activities
        level:
          maximum: 3
          minimum: 1
          type: integer
          description: |
            **(Beta)** Level for `balance` objectives (1-3). Controls how strongly to prioritize balanced workloads.

             * `1` - Accept some workload variation for better travel efficiency
             * `2` - Moderate balance (default)
             * `3` - Strictly equal workloads, even at cost of longer travel

            Only valid when `type` is `balance`. Ignored for other objective types.
          format: int32
          default: 2
      example:
        type: min
        value: vehicles
