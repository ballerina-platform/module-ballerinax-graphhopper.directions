    ProfileResponse:
      type: object
      properties:
        profile:
          type: string
          description: The built-in profile this custom profile is based on.
        bounds:
          type: object
          description: The area of the profile as specified in the request.
          anyOf:
          - $ref: "#/components/schemas/BBox"
          - $ref: "#/components/schemas/FeatureCollection"
