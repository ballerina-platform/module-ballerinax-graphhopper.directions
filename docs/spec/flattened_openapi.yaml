    Shipment:
      required:
      - delivery
      - id
      - pickup
      type: object
      properties:
        id:
          type: string
          description: "Specifies the ID of the shipment. IDs must be unique, so there\
            \ must not be two services/shipments with the same ID."
          example: 7fe77504-7df8-4497-843c-02d70b6490ce
        name:
          type: string
          description: "A meaningful name for the shipment, e.g. \"pick up and deliver\
            \ pizza to Peter\"."
          example: pick up and deliver pizza to Peter
        priority:
          type: integer
          description: |
            Specifies the priority. Can be 1 = high priority to 10 = low priority. Priority only affects the solution when not all shipments can be assigned  (e.g., due to insufficient vehicle capacity, conflicting time windows,  or vehicle constraints). In these cases, the optimizer preferentially  assigns high-priority shipments and leaves low-priority shipments unassigned.  The lower the priority, the earlier these shipments are omitted from  the solution. When all shipments can be served within the given constraints,  priority has no effect - all shipments are assigned regardless of their  priority values, and the optimizer focuses solely on the specified objective  (e.g., minimizing distance or number of vehicles).
          format: int32
          example: 1
          default: 2
        pickup:
          $ref: "#/components/schemas/Stop"
        delivery:
          $ref: "#/components/schemas/Stop"
        size:
          type: array
          description: "Size can have multiple dimensions and should correspond to\
            \ the capacity dimension array of the vehicle type. For example, if the\
            \ item that needs to be delivered has two size dimensions, volume and\
            \ weight, specify it as follows: [ 20, 5 ], assuming a volume of 20 and\
            \ a weight of 5."
          example:
