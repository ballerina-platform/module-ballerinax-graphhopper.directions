          description: "See [priority customization](#tag/Custom-Model/Customizing-priority)"
          items:
            type: object
        distance_influence:
          type: number
          description: "Use higher values to prefer shorter routes. See [here](#tag/Custom-Model/Customizing-distance_influence)\
            \ for more details."
          default: 70
        areas:
          type: object
          description: |
            Areas are given in a GeoJson format. Currently only one format is supported: one object with type Feature, a geometry with type Polygon and optional (but ignored) id and properties fields. See more details and an example [here](#tag/Custom-Model/Define-areas).
      description: "The custom_model modifies the routing behaviour of the given `profile`.\
        \ See the [detailed documentation](#tag/Custom-Model). \nHere is a complete\
        \ example that limits all speeds to 100km/h, avoids motorways and makes shorter\
        \ routes a bit more likely than the default due to a higher distance_influence.\n\
        \n```json\n{\n  \"speed\": [\n    {\n      \"if\": \"true\",\n      \"limit_to\"\
        : 100\n    }\n  ],\n  \"priority\": [\n    {\n      \"if\": \"road_class ==\
        \ MOTORWAY\",\n      \"multiply_by\": 0.1\n    }\n  ],\n  \"distance_influence\"\
        : 100\n}\n```        \n"
    InlineResponse200:
      properties:
        solution:
          $ref: "#/components/schemas/MatrixResponse"
        status:
          type: string
          enum:
          - processing
          - finished
    ClusterConfiguration:
      type: object
      properties:
        response_type:
          type: string
          description: Specifies the response format. You can either choose `geojson`
            or `json`.
          example: json
          default: json
        routing:
          $ref: "#/components/schemas/ClusterConfigurationRouting"
        clustering:
          $ref: "#/components/schemas/ClusterConfigurationClustering"
    JobRelation:
      required:
      - ids
      - type
      type: object
      properties:
        type:
          type: string
          description: |+
            Specifies the type of relation. It must be either of type `in_same_route`, `not_in_same_route`, `in_sequence`, `in_direct_sequence`, `neighbor` or `in_area_sequence`.

            `in_same_route`: As the name suggests, it enforces the specified services or shipments to be in the same route. It can be specified as follows:

            ```json
            {
               "type": "in_same_route",
               "ids": ["serv_i_id","serv_j_id"]
            }
            ```

            This enforces service i to be in the same route as service j no matter which vehicle will be employed. If a specific vehicle (driver) is required to conduct this, just add a `vehicle_id` like this:

            ```
            {
               "type": "in_same_route",
               "ids": ["serv_i_id","serv_j_id"],
               "vehicle_id": "vehicle1"
            }
            ```

            This not only enforces service i and j to be in the same route, but also ensures that both services are in the route of `vehicle1`.

            *Tip*: This way initial loads and vehicle routes can be modelled. For example, if your vehicles are already on the road and new orders come in, then vehicles can still be rescheduled subject to the orders that have already been assigned to these vehicles.

            `not_in_same_route`: It ensures that 2 or more orders are not transported by the same vehicle. It can be specified as follows:

            ```json
            {
               "type": "not_in_same_route",
               "ids": ["serv_i_id","serv_j_id"]
            }
            ```


            `in_sequence`: This relation type enforces n jobs to be in sequence. It can be specified as

            ```json
            {
               "type": "in_sequence",
               "ids": ["serv_i_id","serv_j_id"]
            }
            ```

            which means that service j needs to be in the same route as service i AND it needs to occur somewhere after service i. As described above, if a specific vehicle needs to perform these services, just add `vehicle_id`.


            `in_direct_sequence`: This enforces n services or shipments to be in direct sequence. It can be specified as

            ```json
            {
               "type": "in_direct_sequence",
               "ids": ["serv_i_id","serv_j_id","serv_k_id"]
            }
            ```

            This causes service j to occur directly after service i, and service k to occur directly after service j, i.e. in strict sequence. Again, a specific vehicle can be assigned by adding a `vehicle_id` to the relation.

            When a plain shipment id (without the `_pickup`/`_delivery` suffix described below) is used in an `in_direct_sequence` relation, it stands for the whole shipment: its pickup directly followed by its delivery. For example, `"ids": ["ship_1","ship_2"]` enforces the strict activity sequence pickup of 1, delivery of 1, pickup of 2, delivery of 2 — with no other stops in between. If other activities should be allowed between a shipment's pickup and delivery, reference the activities individually via the `_pickup`/`_delivery` suffixes instead.

            `neighbor`: This specifies a neighbor relationship, i.e., if services i and j are to be neighbors, i must be either immediately before or after j. It can be specified as follows:

            ```json
            {
                "type": "neighbor",
                "ids": ["serv_i_id","serv_j_id"]
            }
            ```

            `in_area_sequence`: This defines an area-level visit order. You pick one job per area as an anchor and set a radius. All other jobs within the radius of an anchor are automatically clustered into that area. Areas are visited in the specified order, and within each area the optimizer handles the details. It can be specified as follows:

            ```json
            {
               "type": "in_area_sequence",
               "ids": ["job_area_a","job_area_b","job_area_c"],
               "area_radius": 5000
            }
            ```

            This means: visit the area around `job_area_a` first, then the area around `job_area_b`, then `job_area_c`. Any ungrouped job within 5000 meters (road distance) of an anchor is automatically assigned to that area. Jobs outside all radii are placed wherever fits best.

            You can assign the area sequence to a specific vehicle:

            ```json
            {
               "type": "in_area_sequence",
               "ids": ["job_area_a","job_area_b"],
               "area_radius": 5000,
               "vehicle_id": "vehicle1"
            }
            ```

            Multiple `in_area_sequence` relations can be used to assign different area sequences to different vehicles. If an anchor job already has a `group`, that group name is used instead of an auto-generated one, and nearby jobs are assigned to it.

            *Special IDs*:
            If you look at the previous example and you want service i to be the first in the route, use the special ID `start` as follows:

            ```json
            {
               "type": "in_direct_sequence",
               "ids": ["start","serv_i_id","serv_j_id","serv_k_id"]
            }
            ```

            This enforces the direct sequence of i, j, and k at the beginning of the route. If this sequence should be at the end of the route, use the special ID `end` like this:

            ```json
            {
               "type": "in_direct_sequence",
               "ids": ["serv_i_id","service_j_id","serv_k_id","end"]
            }
            ```

            If you deal with services then you need to use the 'id' of your services in the field 'ids'. To also consider sequences of the pickups and deliveries of your shipments, you need to use a special ID, i.e. use the shipment id plus the keyword `_pickup` or `_delivery`. For example, to ensure that the pickup and delivery of the shipment with the id 'my_shipment' are direct neighbors, you need the following specification:

            ```
            {
               "type": "in_direct_sequence",
               "ids": ["my_ship_pickup","my_ship_delivery"]
            }
            ```

          example: in_direct_sequence
        ids:
          type: array
          description: "Specifies an array of shipment and/or service ids that are\
            \ in relation. If you deal with services then you need to use the id of\
            \ your services in ids. To also consider sequences of the pickups and\
            \ deliveries of your shipments, you need to use a special ID, i.e. use\
            \ your shipment id plus the keyword `_pickup` or `_delivery`. If you want\
            \ to place a service or shipment activity at the beginning of your route,\
            \ use the special ID `start`. In turn, use `end` to place it at the end\
            \ of the route."
          example:
          - pickup-1
          - pickup-2
          items:
            type: string
        vehicle_id:
          type: string
          description: "Id of pre-assigned vehicle, i.e. the vehicle id that is determined\
            \ to conduct the services and shipments in this relation."
          example: driver-Peter
        area_radius:
          type: number
          description: Radius in meters. Required for `in_area_sequence` relations.
            Jobs within this road distance of an anchor job are automatically assigned
            to that area.
          example: 5000
    Optimization:
      type: object
      properties:
        free_insertion:
          type: boolean
          description: "If you use groups, you sometimes want to place orders without\
            \ group assignment in the best position, i.e. sometimes in the middle\
            \ of a group and not before or after the group. This is not allowed by\
            \ default. However, if this field here is \"true\", these orders (without\
            \ a group assignment) can be inserted freely."
          default: false
        free_insertion_exempt_groups:
          type: array
          description: "When `free_insertion` is enabled, ungrouped orders can be\
            \ inserted anywhere, including inside groups. Use this property to specify\
            \ groups where ungrouped orders should NOT be inserted. This is useful\
            \ when you have groups like \"asap\" (must be served first) or \"last\"\
            \ (must be served last) that should stay compact. For example, with `free_insertion_exempt_groups:\
            \ [\"asap\", \"last\"]`, ungrouped orders can be inserted freely between\
            \ other groups, but not inside the \"asap\" or \"last\" groups, and not\
            \ between start and \"asap\" or between \"last\" and end when using `in_direct_sequence`\
            \ relations with these groups."
          items:
            type: string
        auto_assign_radius:
          type: number
          description: "Radius in meters. When set to a positive value, ungrouped\
            \ jobs are automatically assigned to the nearest existing group based\
            \ on road distance. This is useful when you use groups and group-level\
            \ `in_sequence` to define an area visit order, and want new jobs to automatically\
            \ cluster into the right area. Jobs outside the radius of all groups remain\
            \ ungrouped. Requires `free_insertion: true` for ungrouped jobs to be\
            \ placed freely."
          default: 0
      description: This contains all optimization specific configurations.
