          description: Overall preparation time in seconds.
          format: int64
        setup_time:
          type: integer
          description: Overall setup time in seconds.
          format: int64
        completion_time:
          type: integer
          description: "Overall completion time in seconds, i.e. the sum of each route's\
            \ operation time."
          format: int64
          example: 12000
        no_vehicles:
          type: integer
          description: Number of employed vehicles.
          format: int32
          example: 10
        no_unassigned:
          type: integer
          description: Number of jobs that could not be assigned to final solution.
          format: int32
          example: 1
        routes:
          type: array
          description: An array of routes
          items:
            $ref: "#/components/schemas/Route"
        unassigned:
          $ref: "#/components/schemas/SolutionUnassigned"
      description: Only available if status field indicates `finished`.
    CostMatrix:
      type: object
      properties:
        type:
          type: string
          description: Type of cost matrix. Currently "default" and "google" are supported.
          enum:
          - default
          - google
        location_ids:
          type: array
          items:
            type: string
        data:
          $ref: "#/components/schemas/CostMatrixData"
        profile:
          type: string
          description: "Vehicle profile, or empty for a catch-all fallback."
    IsochroneResponse:
      type: object
      properties:
        polygons:
          type: array
          description: |
            The list of polygons in GeoJson format. It can be used e.g. in the Leaflet framework:

            ```
            L.geoJson(json.polygons).addTo(map)
            ```

            The number of polygon is identical to the specified buckets in the query. Every polygon contains the bucket number in the properties section of the GeoJson.
          items:
            $ref: "#/components/schemas/IsochroneResponsePolygon"
      example:
        polygons:
        - properties:
            bucket: 0
          type: Feature
          geometry:
            type: Polygon
            coordinates:
            - - 13.351851
              - 52.51345
            - - 13.350402
              - 52.516949
            - - 13.352598
              - 52.522252
            - - 13.351851
              - 52.51345
    RequestRelations:
      anyOf:
      - $ref: "#/components/schemas/JobRelation"
      - $ref: "#/components/schemas/GroupRelation"
    DriveTimeBreak:
      required:
      - duration
      - max_driving_time
      type: object
      properties:
        duration:
          type: integer
          description: Specifies the duration of the break in seconds.
          format: int64
          example: 2700
        max_driving_time:
          type: integer
          description: Specifies the max driving time (in a row) without break in
            seconds.
          format: int64
          example: 14400
        initial_driving_time:
          type: integer
          description: Specifies the initial (current) driving time of a driver to
            allow dynamic adaptations in seconds.
          format: int64
          example: 3600
        possible_split:
          type: array
          description: Array specifying how a break duration (in seconds) can be split
            into several smaller breaks
          example:
          - 900
          - 1800
          items:
            type: integer
            format: int64
    RoutePoints:
      description: The geometry of the route. The format depends on the value of `points_encoded`.
      anyOf:
      - $ref: "#/components/schemas/EncodedLineString"
      - $ref: "#/components/schemas/LineString"
    GeocodingLocation:
      type: object
      properties:
        point:
          $ref: "#/components/schemas/GeocodingPoint"
        osm_id:
          type: integer
          description: The OSM ID of the entity
          format: int64
        osm_type:
          type: string
          description: "N = node, R = relation, W = way"
        osm_key:
          type: string
          description: The OSM key of the entity
        name:
          type: string
          description: "The name of the entity. Can be a boundary, POI, address, etc"
        country:
          type: string
          description: The country of the address
        city:
          type: string
          description: The city of the address
        state:
          type: string
          description: The state of the address
        street:
          type: string
          description: The street of the address
        housenumber:
          type: string
          description: The housenumber of the address
        postcode:
          type: string
          description: The postcode of the address
    ClusterCustomer:
      type: object
      properties:
        id:
          type: string
          description: id of customer
          example: GraphHopper GmbH
        address:
          $ref: "#/components/schemas/ClusterCustomerAddress"
        quantity:
          type: number
          description: demand of customer
          format: int32
          example: 10
    Pickup:
      $ref: "#/components/schemas/Stop"
    FeatureCollectionFeatures:
      type: object
      properties:
        type:
          type: string
          enum:
          - Feature
        geometry:
          $ref: "#/components/schemas/Polygon"
    VehicleType:
      required:
      - type_id
      type: object
      properties:
        type_id:
          type: string
          description: "Specifies the id of the vehicle type. If a vehicle needs to\
            \ be of this type, it should refer to this with its type_id attribute."
          example: my-own-type
        profile:
          $ref: "#/components/schemas/VehicleProfileId"
        capacity:
          type: array
          description: "Specifies an array of capacity dimension values which need\
            \ to be int values. For example, if there are two dimensions such as volume\
            \ and weight then it needs to be defined as [ 1000, 300 ] assuming a maximum\
            \ volume of 1000 and a maximum weight of 300."
          example:
          - 100
          - 500
          items:
            type: integer
            format: int32
          default:
          - 0
        speed_factor:
          type: number
          description: "Specifies a speed factor for this vehicle type. For example,\
            \ if a vehicle using this type should travel at half the speed calculated\
            \ by our routing engine, set the speed factor to 0.5."
          format: double
          default: 1
        service_time_factor:
          type: number
          description: "Specifies a service time factor for this vehicle type. For\
            \ example, if a vehicle/driver using this type can complete services twice\
            \ as fast as specified in the service or shipment, set this to 0.5."
          format: double
          default: 1
        cost_per_meter:
          type: number
          description: "**_BETA feature_**! Cost parameter per distance unit, here\
            \ meter is used"
          format: double
        cost_per_second:
          type: number
          description: "**_BETA feature_**! Cost parameter per time unit, here second\
            \ is used"
          format: double
        cost_per_activation:
          type: number
          description: "**_BETA feature_**! Cost parameter vehicle activation, i.e.\
            \ fixed costs per vehicle"
          format: double
        consider_traffic:
          type: boolean
          description: "Specifies whether traffic should be considered. If \"tomtom\"\
            \ is used and this is false, free-flow travel times from TomTom are calculated.\
            \ If this is true, historical traffic information is used. Traffic data\
            \ is not yet available for \"openstreetmap\", so setting this to true\
            \ has no effect when using OpenStreetMap."
          default: false
        network_data_provider:
          type: string
          description: "Specifies the network data provider. Either use [`openstreetmap`](#tag/Map-Data-and-Routing-Profiles/OpenStreetMap)\
            \ (default) or [`tomtom`](#tag/Map-Data-and-Routing-Profiles/TomTom) (add-on\
            \ required)."
          default: openstreetmap
          enum:
          - openstreetmap
          - tomtom
    Request:
      type: object
      properties:
        vehicles:
          minItems: 1
          type: array
          description: Specifies the available vehicles.
          items:
            $ref: "#/components/schemas/Vehicle"
        vehicle_types:
          type: array
          description: Specifies the available vehicle types. These types can be assigned
            to vehicles.
          items:
            $ref: "#/components/schemas/VehicleType"
        services:
          type: array
          description: "Specifies the orders of the type \"service\". These are, for\
            \ example, pickups, deliveries, or other stops to be visited by the specified\
            \ vehicles. Each of these orders contains only one location."
          items:
            $ref: "#/components/schemas/Service"
        shipments:
          type: array
          description: "Specifies the available shipments. Each shipment consists\
            \ of a pickup and a delivery. For a single shipment, the pickup must always\
            \ occur before the delivery. However, pickups and deliveries from multiple\
            \ shipments can be sequenced independently."
          items:
            $ref: "#/components/schemas/Shipment"
        relations:
          type: array
          description: Defines additional relationships between orders.
          items:
            $ref: "#/components/schemas/RequestRelations"
        algorithm:
          $ref: "#/components/schemas/Algorithm"
        objectives:
          type: array
          description: Specifies an objective function. The vehicle routing problem
            is solved in such a way that this objective function is minimized.
          example:
          - type: min
            value: vehicles
          - type: min
            value: completion_time
          items:
            $ref: "#/components/schemas/Objective"
        cost_matrices:
          type: array
          description: Specifies your own transport time and distance matrices.
          items:
            $ref: "#/components/schemas/CostMatrix"
        configuration:
          $ref: "#/components/schemas/Configuration"
    ClusterResponse:
      type: object
      properties:
        copyrights:
          type: array
          example:
          - GraphHopper
          - OpenStreetMap contributors
          items:
            type: string
        status:
          type: string
          description: Indicates the current status of the job
          example: finished
          enum:
          - waiting_in_queue
          - processing
          - finished
        waiting_time_in_queue:
          type: number
          format: double
        processing_time:
          type: number
          format: double
          example: 4900
        clusters:
          type: array
          items:
            $ref: "#/components/schemas/Cluster"
    Cluster:
      type: object
      properties:
        quantity:
          type: number
          description: Cluster size
          format: int32
          example: 40
        ids:
          type: array
          description: Array of customer ids assigned to this specific cluster
          example:
          - GraphHopper GmbH
          items:
            type: string
    Service:
      required:
      - id
      type: object
      properties:
        id:
          type: string
          description: Specifies the id of the service. Ids need to be unique so there
            must not be two services/shipments with the same id.
          example: 7fe77504-7df8-4497-843c-02d70b6490ce
        type:
          type: string
          description: "Specifies type of service. This makes a difference if items\
            \ are loaded or unloaded, i.e. if one of the size dimensions > 0. If it\
            \ is specified as `service` or `pickup`, items are loaded and will stay\
            \ in the vehicle for the rest of the route (and thus consumes capacity\
            \ for the rest of the route). If it is a `delivery`, items are implicitly\
            \ loaded at the beginning of the route and will stay in the route until\
            \ delivery (and thus releases capacity for the rest of the route)."
          example: delivery
          default: service
          enum:
          - service
          - pickup
          - delivery
        priority:
          type: integer
          description: |
            Specifies the priority. Can be 1 = high priority to 10 = low priority. Priority only affects the solution when not all services can be assigned  (e.g., due to insufficient vehicle capacity, conflicting time windows,  or vehicle constraints). In these cases, the optimizer preferentially  assigns high-priority services and leaves low-priority services unassigned.  The lower the priority, the earlier these services are omitted from  the solution. When all services can be served within the given constraints,  priority has no effect - all services are assigned regardless of their  priority values, and the optimizer focuses solely on the specified objective  (e.g., minimizing distance or number of vehicles).
          format: int32
          example: 1
          default: 2
        name:
          type: string
          description: "A meaningful name for the service, e.g. `\"deliver pizza\"\
            `."
          example: deliver pizza
        address:
          $ref: "#/components/schemas/Address"
        duration:
          maximum: 604800
          minimum: 0
          type: integer
          description: "Specifies the duration of the service in seconds, i.e. how\
            \ long it takes to perform the actual service. This time is charged for\
            \ each activity—if multiple services occur at the same location, their\
            \ durations are summed."
          format: int64
          example: 1800
          default: 0
        preparation_time:
          maximum: 604800
          minimum: 0
          type: integer
          description: "Specifies the preparation time in seconds. This time is added\
            \ after arrival and before the service can begin, modeling tasks like\
            \ finding a parking spot. Preparation time is only charged once when the\
            \ location differs from the previous stop—if multiple consecutive activities\
            \ share the same location, it is applied only to the first."
          format: int64
          example: 300
          default: 0
        setup_time:
          maximum: 604800
          minimum: 0
          type: integer
          description: "Specifies the setup time in seconds. This is a fixed overhead\
            \ charged when arriving at a new location (e.g., dock check-in, security\
            \ clearance, equipment preparation). Unlike `duration`, setup time is\
            \ only charged once per location—if multiple consecutive activities share\
            \ the same location, it is applied only to the first. The activity timeline\
            \ is: arrival → preparation_time → waiting (if early) → setup_time → duration."
          format: int64
          example: 600
          default: 0
        time_windows:
          type: array
          description: "Specifies an array of time window objects (see TimeWindow\
            \ object below). Specify the time either with the recommended Unix timestamp\
            \ (the number of seconds since 1970-01-01) or you can count the seconds\
            \ relative to Monday morning 00:00 and define the whole week in seconds.\
            \ For example, Monday 9am is represented by 9 hours * 3600 sec/hour =\
            \ 32400. Wednesday 1pm corresponds to 2 days * 24 hours/day * 3600 sec/hour\
            \ + 13 hours * 3600 sec/hour = 219600. See our tutorial for more information."
          example:
          - earliest: 32400
            latest: 36000
          - earliest: 50400
            latest: 54000
          items:
            $ref: "#/components/schemas/TimeWindow"
        size:
          type: array
          description: "Size can have multiple dimensions and should correspond to\
            \ the capacity dimension array of the vehicle type. For example, if the\
            \ item that needs to be delivered has two size dimensions, volume and\
            \ weight, specify it as follows: [ 20, 5 ], assuming a volume of 20 and\
            \ a weight of 5."
          example:
          - 30
          - 5
          - 1
          items:
            type: integer
            format: int32
          default:
          - 0
        required_skills:
          type: array
          description: "Specifies an array of required skills, i.e. an array of strings\
            \ (not case sensitive). For example, if this service needs to be performed\
            \ by a technician with a `drilling_machine` and a `screw_driver`, specify\
            \ the array as follows: `[\"drilling_machine\",\"screw_driver\"]`. This\
            \ means that the service can only be done by a vehicle (technician) that\
            \ has both `drilling_machine` AND `screw_driver` in its skill array. Otherwise,\
            \ it remains unassigned."
          example:
          - drilling_machine
          - screw_driver
          items:
            type: string
        allowed_vehicles:
          type: array
          description: "Specifies an array of allowed vehicles, i.e. an array of vehicle\
            \ IDs. For example, if this service can only be performed by EITHER `technician_peter`\
            \ OR `technician_stefan`, specify this as follows: `[\"technician_peter\"\
            ,\"technician_stefan\"]`."
          example:
          - technician_peter
          - technician_stefan
          items:
            type: string
        disallowed_vehicles:
          type: array
          description: "Specifies an array of disallowed vehicles, i.e. an array of\
            \ vehicle IDs."
          example:
          - driver-A
          - driver-B
          items:
            type: string
        preferred_vehicles:
          type: array
          description: Specifies an array of preferred vehicles.
          items:
            $ref: "#/components/schemas/PreferredVehicle"
        max_time_in_vehicle:
          type: integer
          description: "Specifies the maximum time in seconds a delivery can stay\
            \ in the vehicle. Currently, it only works with services of \"type\":\"\
            delivery\". Omit this field to indicate no limit."
          format: int64
          example: 900
        group:
          type: string
          description: "Group this service belongs to. Orders with the same group\
            \ label are treated as a contiguous cluster — they stay together as a\
            \ block, but the optimizer picks the internal sequence. Groups can also\
            \ be referenced in group-level relations to enforce constraints like `in_sequence`\
            \ across entire clusters."
          example: group-A
    Routing:
      type: object
      properties:
        calc_points:
          type: boolean
          description: "It lets you specify whether the API should provide you with\
            \ route geometries for vehicle routes or not. Thus, you do not need to\
            \ do extra routing to get the polyline for each route."
          default: false
        consider_traffic:
          type: boolean
          description: Indicates whether historical traffic information should be
            considered.
          default: false
        network_data_provider:
          type: string
          description: "Specifies the data provider. Read more about it [here](#tag/Map-Data-and-Routing-Profiles)."
          default: openstreetmap
          enum:
          - openstreetmap
          - tomtom
        curbside_strictness:
          type: string
          description: In some cases curbside constraints cannot be fulfilled. For
            example in one-way streets you cannot arrive at a building that is on
            the left side of the street such that the building is to the right of
            you (unless you drove the one-way street the wrong/illegal way). You can
            set the `curbside_strictness` to `soft` to ignore the curbside constraint
            in such cases or set it to `strict` to get an error response instead.
            You can also set it to `ignore` to ignore all curbside constraints (this
            is useful to compare the results with and without constraints without
            modifying every single address).
          default: soft
          enum:
          - ignore
          - soft
          - strict
        fail_fast:
          type: boolean
          description: Indicates whether matrix calculation should fail immediately
            when points cannot be connected.
          default: false
        return_snapped_waypoints:
          type: boolean
          description: "Indicates whether the solution should include snapped waypoints.\
            \ Unlike the address coordinates, a snapped waypoint is the access point\
            \ to the road network."
          default: false
        snap_preventions:
          type: array
          description: "Optional parameter. 'Snapping' is the process of finding the\
            \ closest road location for GPS coordinates provided in the `points` array.\
            \ The `snap_preventions` array allows you to prevent snapping to specific\
            \ types of roads. For example, if the array includes `bridge`, then the\
            \ routing engine will avoid snapping to a bridge, even if it is the closest\
            \ road for the given point. Note that once snapped the routing algorithm\
            \ can still route over bridges (or the other values). To avoid this you\
            \ need to use the `custom_model`."
          example:
          - motorway
          - trunk
          - bridge
          - tunnel
          - ferry
          - ford
          items:
            type: string
            enum:
            - motorway
            - trunk
            - bridge
            - ford
            - tunnel
            - ferry
      description: This contains all routing specific configurations.
    SolutionUnassigned:
      type: object
      properties:
        services:
          type: array
          description: An array of ids of unassigned services
          example:
          - service-1
          - service-3
          items:
            type: string
            description: Id of unassigned service
        shipments:
          type: array
          description: An array of ids of unassigned shipments
          example:
          - shipment-5
          items:
            type: string
            description: Id of unassigned shipments
        breaks:
          type: array
          description: An array of ids of unassigned breaks
          items:
            type: string
            description: Id of unassigned breaks
        details:
          type: array
          description: "An array of details, i.e. reason for unassigned services or\
            \ shipments"
          items:
            $ref: "#/components/schemas/Detail"
        activities:
          type: array
          description: |
            Per-activity breakdown of every unassigned job. For each unassigned **service** there is exactly one entry; for each unassigned **shipment** there are two entries (one with `type: "pickupShipment"` and one with `type: "deliverShipment"`), both sharing the shipment id.

            Schedule-derived fields (`arr_time`, `end_time`, `waiting_time`, `distance`, `driving_time`, `preparation_time`, `setup_time`, `load_before`, `load_after`) are zero or omitted because the job was never placed on a route. The descriptive fields `name`, `priority`, and `group` are echoed from the original request when present, so consumers can render or audit unassigned stops without joining back to the request. `time_window` is omitted because the solver never picked one.
          items:
            $ref: "#/components/schemas/Activity"
    ProfileRequest:
      type: object
      properties:
        profile:
          type: string
          description: The built-in profile your new custom profile shall be based
            on.
          enum:
          - foot
          - bike
          - ecargobike
          - car
          - small_truck
          - truck
          - scooter
        bounds:
          type: object
          description: "The area of the profile, either a rectangle (`bbox`) or polygons\
            \ (`features`)."
          anyOf:
          - $ref: "#/components/schemas/BBox"
          - $ref: "#/components/schemas/FeatureCollection"
        custom_model:
          $ref: "#/components/schemas/CustomModelForProfile"
      example:
        bounds:
          bbox:
          - 11.45462
          - 48.00954
          - 11.77322
          - 48.2076
        custom_model:
          priority:
          - if: road_access == PRIVATE
            multiply_by: "0"
          - if: road_class == MOTORWAY
            multiply_by: "0"
        profile: car
    IsochroneResponsePolygon:
      type: object
      properties:
        properties:
          $ref: "#/components/schemas/IsochroneResponsePolygonProperties"
        type:
          type: string
        geometry:
          $ref: "#/components/schemas/Polygon"
      description: A found path
    VehicleProfileId:
      type: string
      description: "The routing profile. It determines the network, speed and other\
        \ physical attributes used when computing the route. See the section about\
        \ [routing profiles](#tag/Map-Data-and-Routing-Profiles) for more details\
        \ and valid profile values."
      default: car
    TimeWindow:
      type: object
      properties:
        earliest:
          type: integer
          description: "Specifies the opening time of the time window in seconds,\
            \ i.e. the earliest time the service can start."
          format: int64
          default: 0
        latest:
          type: integer
          description: "Specifies the closing time of the time window in seconds,\
            \ i.e. the latest time the service can start. Omit this field to indicate\
            \ no limit."
          format: int64
    CustomModel:
      type: object
      properties:
        speed:
          type: array
          description: "See [speed customization](#tag/Custom-Model/Customizing-speed)"
          items:
            type: object
        priority:
          type: array
          description: "See [priority customization](#tag/Custom-Model/Customizing-priority)"
          items:
            type: object
        distance_influence:
          type: number
          description: "Use higher values to prefer shorter routes. See [here](#tag/Custom-Model/Customizing-distance_influence)\
            \ for more details."
          default: 70
        areas:
          $ref: "#/components/schemas/FeatureCollection"
      description: "The custom_model modifies the routing behaviour of the specified\
        \ profile. See the [detailed documentation](#tag/Custom-Model). \nBelow is\
        \ a complete request example in Berlin that limits all speeds to 100km/h,\
        \ excludes motorways and makes shorter routes a bit more likely than the default\
        \ due to a higher distance_influence. \nNote that it also includes the `\"\
        ch.disable\": true` parameter which is required to make use of `custom_model`.\n\
        \n```json\n{\n  \"points\": [\n    [\n      13.31543,\n      52.509535\n \
        \   ],\n    [\n      13.29779,\n      52.512434\n    ]\n  ],\n  \"profile\"\
        : \"car\",\n  \"ch.disable\": true,\n  \"custom_model\": {\n    \"speed\"\
        : [\n      {\n        \"if\": \"true\",\n        \"limit_to\": \"100\"\n \
        \     }\n    ],\n    \"priority\": [\n      {\n        \"if\": \"road_class\
        \ == MOTORWAY\",\n        \"multiply_by\": \"0\"\n      }\n    ],\n    \"\
        distance_influence\": 100\n  }\n} \n```\n"
    Response:
      type: object
      properties:
        copyrights:
          type: array
          example:
          - GraphHopper
          - OpenStreetMap contributors
          items:
            type: string
            description: Attribution
        status:
          type: string
          description: Indicates the current status of the job
          example: finished
          enum:
          - waiting_in_queue
          - processing
          - finished
        waiting_time_in_queue:
          type: integer
          description: Waiting time in milliseconds.
          format: int64
          example: 300000
        processing_time:
          type: integer
          description: "Processing time in ms. If job is still waiting in queue, processing_time\
            \ is 0"
          format: int64
          example: 900000
        solution:
          $ref: "#/components/schemas/Solution"
    ActivityDepartureWindow:
      type: object
      properties:
        earliest:
          type: integer
          description: Earliest feasible departure time in seconds.
          format: int64
        latest:
          type: integer
          description: Latest feasible departure time in seconds.
          format: int64
      description: The feasible departure window for the start activity. Only present
        on start activities when the vehicle has latest_start set. Shows the earliest
        and latest feasible departure times. (beta)
    FeatureCollection:
      type: object
      properties:
        type:
          type: string
          enum:
          - FeatureCollection
        features:
          type: array
          description: A FeatureCollection is an array of type "Feature" from GeoJSON
          items:
            $ref: "#/components/schemas/FeatureCollectionFeatures"
      description: A GeoJSON FeatureCollection. For `bounds` the `type` is optional
        and every feature must be a Polygon.
    LineString:
      type: object
      properties:
        type:
          type: string
        coordinates:
          type: array
          description: |
            A list of coordinate pairs or triples, `[lon,lat]` or `[lon,lat,elevation]`.
          items:
            type: array
            items:
              type: number
    EncodedLineString:
      type: string
      description: "A polyline-encoded list of positions. You'll need to decode this\
        \ string in client code. We provide open source code in [Java](https://github.com/graphhopper/graphhopper/blob/e649aaed8d3f4378bf2d8889bbbc2318261eabb2/web-api/src/main/java/com/graphhopper/http/WebHelper.java#L54)\
        \ and [JavaScript](https://github.com/graphhopper/directions-api-js-client/blob/cf43d1a5bc93a3e8007a44fcfc551117e4fa49bc/src/GHUtil.js#L27)."
    InlineResponse2001:
      properties:
        solution:
          $ref: "#/components/schemas/ProfileResponse"
        status:
          type: string
          enum:
          - processing
          - finished
    InlineResponse2002:
      properties:
        status:
          type: string
          enum:
          - success
    RouteResponsePath:
      type: object
      properties:
        distance:
          type: number
          description: |
            The total distance, in meters. To get this information for one 'leg' please read [this blog post](https://www.graphhopper.com/blog/2019/11/28/routing-api-using-path-details/).
          format: double
        time:
          type: integer
          description: |
            The total travel time, in milliseconds. To get this information for one 'leg' please read [this blog post](https://www.graphhopper.com/blog/2019/11/28/routing-api-using-path-details/).
          format: int64
        ascend:
          type: number
          description: |
            The total ascent, in meters.
          format: double
        descend:
          type: number
          description: |
            The total descent, in meters.
          format: double
        points:
          description: |
            The geometry of the route. The format depends on the value of `points_encoded`.
          anyOf:
          - $ref: "#/components/schemas/EncodedLineString"
          - $ref: "#/components/schemas/LineString"
        snapped_waypoints:
          description: |
            The snapped input points. The format depends on the value of `points_encoded`.
          anyOf:
          - $ref: "#/components/schemas/EncodedLineString"
          - $ref: "#/components/schemas/LineString"
        points_encoded:
          type: boolean
          description: |
            Whether the `points` and `snapped_waypoints` fields are polyline-encoded strings rather than JSON arrays
            of coordinates. See the field description for more information on the two formats.
        bbox:
          type: array
          description: |
            The bounding box of the route geometry. Format: `[minLon, minLat, maxLon, maxLat]`.
          items:
            type: number
            format: double
        instructions:
          type: array
          description: |
            The instructions for this route. This feature is under active development, and our instructions can sometimes be misleading,
            so be mindful when using them for navigation.
          items:
            $ref: "#/components/schemas/RouteResponsePathInstructions"
        details:
          type: object
          description: |
            Details, as requested with the `details` parameter. Consider the value `{"street_name": [[0,2,"Frankfurter Straße"],[2,6,"Zollweg"]]}`.
            In this example, the route uses two streets: The first, Frankfurter Straße, is
            used between `points[0]` and `points[2]`, and the second, Zollweg, between `points[2]` and `points[6]`.
            Read more about the usage of path details [here](https://discuss.graphhopper.com/t/2539).
        points_order:
          type: array
          description: |
            An array of indices (zero-based), specifiying the order in which the input points are visited.
            Only present if the `optimize` parameter was used.
          items:
            type: integer
    ErrorMessage:
      type: object
      properties:
        message:
          type: string
          description: error message
          example: "unsupported json property [vehiles]. allowed properties: [vehicles,\
            \ vehicle_types, services, shipments, relations, algorithm, objectives,\
            \ cost_matrices, configuration]"
        details:
          type: string
          description: Details
          example: class java.lang.IllegalArgumentException
  securitySchemes:
    key:
      type: apiKey
      name: key
      in: query
