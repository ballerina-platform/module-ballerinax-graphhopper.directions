        start_address:
          $ref: "#/components/schemas/Address"
        end_address:
          $ref: "#/components/schemas/Address"
        earliest_start:
          type: integer
          description: Earliest start of vehicle in seconds. It is recommended to
            use the unix timestamp.
          format: int64
          default: 0
        latest_end:
          type: integer
          description: "Latest end of vehicle in seconds, i.e. the time the vehicle\
            \ needs to be at its end location at latest. Omit this field to indicate\
            \ no limit."
          format: int64
        latest_start:
          type: integer
          description: "Latest start of vehicle in seconds. If specified and greater\
            \ than earliest_start, the optimizer determines the best departure time\
            \ within the [earliest_start, latest_start] window to minimize waiting\
            \ time. (beta)"
          format: int64
        departure_preference:
          type: string
          description: "Controls departure preference when latest_start is set. \"\
            late\" (default) departs as late as possible while meeting all time windows.\
            \ \"early\" departs as early as possible, eliminating waiting time along\
            \ the route. Ignored without latest_start. (beta)"
          default: late
          enum:
          - early
          - late
        return_to_depot:
          type: boolean
          description: "If true, vehicle returns to its start location (or specified\
            \ end location). If false, vehicle can end at any customer location that\
            \ optimizes the objective function."
          default: true
        max_service_time:
          type: integer
          description: "Specifies the maximum on-site time (in seconds) for this shift's\
            \ route, i.e. the sum of all service durations (scaled by service_time_factor)\
            \ plus setup times. Driving, waiting and break times are not included.\
            \ Defaults to the vehicle's max_service_time."
          format: int64
          example: 14400
        max_working_time:
          type: integer
          description: "Specifies the maximum working time (in seconds) for this shift's\
            \ route: driving time (incl. preparation times) plus on-site time. Waiting\
            \ and break times are not included. Defaults to the vehicle's max_working_time."
          format: int64
          example: 36000
        max_route_duration:
          type: integer
          description: "Specifies the maximum duration (in seconds) of this shift's\
            \ route, i.e. the time between the actual departure and the arrival at\
            \ the end location, waiting and break times included. Defaults to the\
            \ vehicle's max_route_duration."
          format: int64
          example: 36000
        break:
