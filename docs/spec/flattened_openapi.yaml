  /vrp/optimize:
    post:
      tags:
      - Route Optimization
      summary: Submit a route optimization job
      description: |2

        To solve a vehicle routing problem, perform the following steps:

        1.) Make a HTTP POST to this URL

        ```
        https://graphhopper.com/api/1/vrp/optimize?key=<your_key>
        ```

        It returns a job id (`job_id`).

        2.) Take the job id and fetch the solution for the vehicle routing problem from this URL:

        ```
        https://graphhopper.com/api/1/vrp/solution/<job_id>?key=<your_key>
        ```

        We recommend querying the solution every 500ms until it returns 'status=finished'.

        **Note**: Since the workflow is more complex and you lose some time fetching the solution, you should prefer
        the [synchronous endpoint](#operation/solveVRP) when possible. Use the batch mode only for long-running problems.
      operationId: asyncVRP
      requestBody:
        description: The request that contains the problem to be solved.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Request"
            example:
              vehicles:
              - vehicle_id: vehicle-1
                type_id: cargo-bike
                start_address:
                  location_id: berlin
                  lon: 13.406
                  lat: 52.537
                earliest_start: 1554804329
                latest_end: 1554808329
                max_jobs: 3
              - vehicle_id: vehicle-2
                type_id: cargo-bike
                start_address:
                  location_id: berlin
                  lon: 13.406
                  lat: 52.537
                earliest_start: 1554804329
                latest_end: 1554808329
                max_jobs: 3
                skills:
                - physical strength
              vehicle_types:
              - type_id: cargo-bike
                capacity:
                - 10
                profile: bike
              services:
              - id: s-1
                name: visit-Joe
                address:
                  location_id: 13.375854_52.537338
                  lon: 13.375854
                  lat: 52.537338
                size:
                - 1
                time_windows:
                - earliest: 1554805329
                  latest: 1554806329
              - id: s-2
                name: serve-Peter
                address:
                  location_id: 13.393364_52.525851
                  lon: 13.393364
                  lat: 52.525851
                size:
                - 1
              - id: s-3
                name: visit-Michael
                address:
                  location_id: 13.416882_52.523543
                  lon: 13.416882
                  lat: 52.523543
                size:
                - 1
              - id: s-4
                name: do nothing
                address:
                  location_id: 13.395767_52.514038
                  lon: 13.395767
                  lat: 52.514038
                size:
                - 1
              shipments:
              - id: 7fe77504-7df8-4497-843c-02d70b6490ce
                name: pickup and deliver pizza to Peter
                priority: 1
                pickup:
                  address:
                    location_id: 13.387613_52.529961
                    lon: 13.387613
                    lat: 52.529961
                delivery:
                  address:
                    location_id: 13.380575_52.513614
                    lon: 13.380575
                    lat: 52.513614
                size:
                - 1
                required_skills:
                - physical strength
              objectives:
              - type: min
                value: vehicles
              - type: min
                value: completion_time
              configuration:
                routing:
                  calc_points: true
                  snap_preventions:
                  - motorway
                  - trunk
                  - tunnel
                  - bridge
                  - ferry
        required: true
      responses:
        "200":
          description: A jobId you can use to retrieve your solution from the server
            - see solution endpoint.
          headers:
            X-RateLimit-Limit:
              description: Your current daily credit limit.
              style: simple
              explode: false
              schema:
                type: integer
            X-RateLimit-Remaining:
              description: Your remaining credits until the reset. This value is measured
                before the current request's cost is deducted. Subtract `X-RateLimit-Credits`
                to get the balance after the request.
              style: simple
              explode: false
              schema:
                type: integer
            X-RateLimit-Reset:
              description: The number of seconds that you have to wait before a reset
                of the credit count is done.
              style: simple
              explode: false
              schema:
                type: integer
            X-RateLimit-Credits:
              description: "The credit costs for this request. Note it could be a\
                \ decimal and even negative number, e.g. when an async request failed."
              style: simple
              explode: false
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobId"
          links:
            GetSolutionByJobId:
              operationId: getSolution
              parameters:
                jobId: $response.body#/job_id
              description: |
                The `job_id` value returned in the response can be used as the `jobId` parameter in `GET /vrp/{jobId}`.
        "400":
          description: Error occurred when reading client request. Request is invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BadRequest"
        "500":
          description: Error occurred on server side.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InternalErrorMessage"
