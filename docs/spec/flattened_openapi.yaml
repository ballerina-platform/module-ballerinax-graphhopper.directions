openapi: 3.0.1
info:
  title: GraphHopper Directions API
  description: "\nIntegrate A-to-B route planning, turn-by-turn navigation,\nroute\
    \ optimization, isochrone calculations, location clustering and other tools into\
    \ your application.\n\n  #### Authentication\n  \n  1. [Sign up for GraphHopper](https://graphhopper.com/dashboard/signup)\n\
    \  2. [Create an API key](https://support.graphhopper.com/a/solutions/articles/44001976027)\n\
    \n  Authenticate to the API by passing your key as a query parameter in every\
    \ request.\n\n  #### API Explorer\n\n  You can also try all API parts without\
    \ registration in the [API explorer](https://explorer.graphhopper.com/).\n\n \
    \ #### Costs\n\n  Our pricing is credit based. Read more about it [on our website](https://www.graphhopper.com/pricing/)\
    \ and in [our FAQ](https://www.graphhopper.com/faq/what-is-one-credit/) about\
    \ how the credit cost is calculated.\n\n  #### Client Libraries\n\n  To speed\
    \ up development and make coding easier, we offer a [JavaScript client](https://www.npmjs.com/package/@graphhopper/directions-api-js-client)\
    \ and a\n  [Java client](https://github.com/graphhopper/graphhopper/tree/master/client-hc).\n\
    \n  For turn-by-turn navigation in your iOS or Android app we recommend the [Maplibre\
    \ Navigation SDK](https://github.com/maplibre/maplibre-navigation-android/) (Kotlin\
    \ Multiplatform version), which works well with GraphHopper.\n\n  #### Monitoring\
    \ Usage\n\n  Every response includes four `X-RateLimit-*` headers to track your\
    \ credit consumption:\n\n  | Header | Description |\n  |---|---|\n  | `X-RateLimit-Limit`\
    \ | Your total daily credit limit |\n  | `X-RateLimit-Remaining` | Credits left\
    \ until reset — measured **before** the current request's cost is deducted |\n\
    \  | `X-RateLimit-Reset` | Seconds until the daily credit counter resets |\n \
    \ | `X-RateLimit-Credits` | Credits consumed by the current request |\n\n  To\
    \ compute your actual remaining balance after a request, subtract: `Remaining\
    \ - Credits`. A `429` response means the daily or per-minute limit is exhausted.\n\
    \n  #### Common Workflows\n\n  The APIs are designed to be combined. Here are\
    \ the most common patterns:\n\n  **Delivery / field service app** — Geocoding\
    \ → Route Optimization → Routing\n\n  1. [Geocoding](#tag/Geocoding): convert\
    \ customer addresses to coordinates. Note: the Geocoding response uses `point.lng`\
    \ while the Optimization request uses `lon` — map the field name accordingly.\n\
    \  2. [Route Optimization](#tag/Route-Optimization) (`POST /vrp`): pass the coordinates\
    \ as service addresses along with your vehicles. Set `configuration.routing.calc_points`\
    \ to `true` to get route geometries in the response. The solver assigns stops\
    \ to vehicles, sequences them, and returns routes with arrival times.\n  3. [Routing](#tag/Routing)\
    \ (`POST /route`): optionally, call this per driver route to get turn-by-turn\
    \ instructions. Pass the stop coordinates from the optimization solution as `points`,\
    \ set `instructions` to `true`.\n\n  If you only need geometries (no turn-by-turn\
    \ instructions), step 3 is unnecessary — `calc_points` in step 2 already provides\
    \ them.\n\n  **ETA / distance matrix** — Geocoding → Matrix\n\n  1. [Geocoding](#tag/Geocoding):\
    \ convert addresses to coordinates.\n  2. [Matrix](#tag/Matrices) (`POST /matrix`):\
    \ compute travel times and distances between all pairs (or specific origin/destination\
    \ sets). Useful for displaying ETAs to customers or pre-filtering stops before\
    \ optimization.\n\n  **Simple A-to-B navigation** — Routing only\n\n  Call [Routing](#tag/Routing)\
    \ (`POST /route`) with two or more `points`. No optimization or geocoding needed\
    \ if you already have coordinates.\n\n  To integrate turn-by-turn navigation for\
    \ an app (iOS or Android) have a look into the [Maplibre Navigation SDK](https://github.com/maplibre/maplibre-navigation-android/)\
    \ (Kotlin Multiplatform). Contact us if you need more information.\n\n  #### Optimize\
    \ Response Speed\n\n  1. Reuse SSL/TLS sessions\n\n  You should utilize the SSL\
    \ session to speed up responses after the initial response or use a library that\
    \ does this. E.g. for Java the\n  [OkHttp library](https://square.github.io/okhttp/)\
    \ automatically reuses SSL/TLS sessions and also the browser takes care of this\
    \ automatically.\n  For python you can use the [`requests` library](https://requests.readthedocs.io/en/latest/user/advanced/):\
    \ first you create a\n  session (`session = requests.Session()`) and then do requests\
    \ only with this session instead of directly using \"requests\".\n\n  2. Bandwidth\
    \ reduction\n\n  If you create your own client, make sure it supports http/2 and\
    \ gzipped responses for best speed.\n  If you use Route Optimization or Matrices\
    \ and want to solve large problems, we recommend you to reduce bandwidth\n  by\
    \ [compressing your POST request](https://gist.github.com/karussell/82851e303ea7b3459b2dea01f18949f4)\
    \ and specifying the header\n  as follows: `Content-Encoding: gzip`. This will\
    \ also avoid the HTTP 413 error \"Request Entity Too Large\".\n"
