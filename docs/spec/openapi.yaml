  /match:
    post:
      summary: Map-match a GPX file
      operationId: postGPX
      description: >
        To get a match response you send a GPX file in the body of an HTTP POST
        request and specify request parameters like the `key` and `profile` in
        the URL.

        See below for more supported parameters.
      x-codeSamples:
        - lang: curl
          source: >
            curl -XPOST -H "Content-Type: application/gpx+xml"
            "https://graphhopper.com/api/1/match?profile=car&key=[YOUR_KEY]" -d
            '
              <gpx>
                <trk>
                  <trkseg>
                    <trkpt lat="51.343657" lon="12.360708"></trkpt>
                    <trkpt lat="51.343796" lon="12.361337"></trkpt>
                    <trkpt lat="51.342784" lon="12.361882"></trkpt>
                  </trkseg>
                </trk>
              </gpx>'
        - lang: Java
          source: |
            OkHttpClient client = new OkHttpClient();
            RequestBody body = RequestBody.create("<gpx>" +
                " <trk>" +
                "  <trkseg>" +
                "   <trkpt lat=\"51.343657\" lon=\"12.360708\"></trkpt>" +
                "   <trkpt lat=\"51.343796\" lon=\"12.361337\"></trkpt>" +
                "   <trkpt lat=\"51.342784\" lon=\"12.361882\"></trkpt>" +
                "  </trkseg>" +
                " </trk>" +
                "</gpx>", MediaType.parse("application/gpx+xml"));
            Request request = new Request.Builder()
                .url("https://graphhopper.com/api/1/match?profile=car&key=[YOUR_KEY]")
                .post(body)
                .build();

            Response response = client.newCall(request).execute();
      tags:
        - Map Matching
      parameters:
        - name: gps_accuracy
          in: query
          description: Specify the precision of a point, in meter
          required: false
          schema:
            type: integer
        - name: profile
          in: query
          schema:
            $ref: '#/components/schemas/VehicleProfileId'
        - name: locale
          in: query
          description: >
            The locale of the resulting turn instructions. E.g. `pt_PT` for
            Portuguese or `de` for German.
          schema:
            type: string
            default: en
        - name: elevation
          in: query
          description: >
            If `true`, a third coordinate, the altitude, is included with all
            positions in the response.

            This changes the format of the `points` and `snapped_waypoints`
            fields of the response, in both their

            encodings. Unless you switch off the `points_encoded` parameter, you
            need special code on the

            client side that can handle three-dimensional coordinates.
          schema:
            type: boolean
            default: false
        - name: details
          in: query
          description: >
            Optional parameter. The following path details are available:
            `street_name`, `street_ref`, `street_destination`, `leg_time`,
            `leg_distance`, `roundabout`, `country`, `time`, `distance`,
            `max_speed`,

            `max_weight`, `max_width`, `toll`, `road_class`, `road_class_link`,
            `road_access`, `road_environment`, `hazmat`, `hazmat_tunnel`,
            `hazmat_water`, 

            `lanes`, `surface`, `smoothness`, `hike_rating`, `mtb_rating`,
            `foot_network`, `bike_network`. Read more about the usage of path
            details [here](https://discuss.graphhopper.com/t/2539).
          schema:
            type: array
            items:
              type: string
          explode: true
        - name: instructions
          in: query
          description: |
            If instructions should be calculated and returned
          schema:
            type: boolean
            default: true
        - name: calc_points
          in: query
          description: |
            If the points for the route should be calculated at all.
          schema:
            type: boolean
            default: true
        - name: points_encoded
          in: query
          description: >
            Allows changing the encoding of location data in the response. The
            default is polyline encoding, which is compact

            but requires special client code to unpack. (We provide it in our
            JavaScript client library!)

            Set this parameter to `false` to switch the encoding to simple
            coordinate pairs like `[lon,lat]`, or `[lon,lat,elevation]`.

            See the description of the response format for more information.
          schema:
            type: boolean
            default: true
      requestBody:
        description: A GPX document containing the map-matching input.
        content:
          application/gpx+xml:
            example: |
              <gpx>
                <trk>
                  <trkseg>
                    <trkpt lat="51.343657" lon="12.360708"></trkpt>
                    <trkpt lat="51.343796" lon="12.361337"></trkpt>
                    <trkpt lat="51.342784" lon="12.361882"></trkpt>
                  </trkseg>
                </trk>
              </gpx>
        required: true
      responses:
        '200':
          description: Map matching result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RouteResponse'
          headers:
            X-RateLimit-Limit:
              description: Your current daily credit limit.
              schema:
                type: integer
            X-RateLimit-Remaining:
              description: >-
                Your remaining credits until the reset. This value is measured
                before the current request's cost is deducted. Subtract
                `X-RateLimit-Credits` to get the balance after the request.
              schema:
                type: integer
            X-RateLimit-Reset:
              description: >-
                The number of seconds that you have to wait before a reset of
                the credit count is done.
              schema:
                type: integer
            X-RateLimit-Credits:
              description: >-
                The credit costs for this request. Note it could be a decimal
                and even negative number, e.g. when an async request failed.
              schema:
                type: integer
  /geocode:
    get:
      summary: Geocoding Endpoint
      operationId: getGeocode
      x-codeSamples:
        - lang: curl
          source: >-
            curl
            "https://graphhopper.com/api/1/geocode?q=berlin&locale=de&key=api_key"
        - lang: Java
          source: |-
            OkHttpClient client = new OkHttpClient();
            Request request = new Request.Builder()
                    .url("https://graphhopper.com/api/1/geocode?q=berlin&locale=de&key=api_key")
                    .get()
                    .build();

            Response response = client.newCall(request).execute();
      parameters:
        - name: q
          in: query
          description: >
            A textual description of the address you are looking for. Required
            for forward geocoding. Note that the `default` geocoding provider
            does prefix searches preferable for "autocomplete" use cases, but

            may lead to sub-optimal results if used without user interaction.
            See e.g. `provider=nominatim` as an appropriate alternative for less
            interactive use cases.
          schema:
            type: string
        - name: locale
          in: query
          description: >-
            Display the search results for the specified `locale`. For the
            default geocoding provider `en`, `fr`, `es`, `de`, `pt`, `ru` and
            `it` are supported. Otherwise leave the locale empty.
          schema:
            type: string
            default: en - for the default provider
        - name: limit
          in: query
          description: Specify the maximum number of results to return
          schema:
            type: integer
            format: int32
            default: 5
        - name: reverse
          in: query
          description: >-
            It is `required` to be `true` if you want to do a reverse geocoding
            request. If it is `true`, `point` must be defined as well, and `q`
            must not be used.
          schema:
            type: boolean
            default: false
        - name: debug
          in: query
          description: If `true`, the output will be formatted.
          schema:
            type: boolean
            default: false
        - name: point
          in: query
          description: >-
            _Forward geocoding_: The location bias in the format
            'latitude,longitude' e.g. point=45.93272,11.58803. _Reverse
            geocoding_: The location to find amenities, cities.
          schema:
            type: string
        - name: provider
          in: query
          description: >
            The provider parameter is currently under development and can fall
            back to `default` at any time.

            The intend is to provide alternatives to our default geocoder. Each
            provider has its own strenghts and might fit better for certain
            scenarios, so it's worth to compare the different providers.

            To try it append the `provider`parameter to the URL like
            `&provider=nominatim`,

            the result structure should be identical in all cases - if not,
            please report this back to us.

            Keep in mind that some providers do not support certain parameters
            or don't return some fields, for example `osm_id` and `osm_type` are
            not supported by every geocoding provider.

            If you would like to use additional parameters of one of the
            providers, but it's not available for the GraphHopper Geocoding API,
            yet? Please contact us.


            The credit costs can be different for all providers - see
            [here](https://support.graphhopper.com/support/solutions/articles/44000718211-what-is-one-credit-)
            for more information about it.


            Currently, only the default provider and gisgraphy support
            autocompletion of partial search strings.


            All providers support normal "forward" geocoding and reverse
            geocoding via `reverse=true`.


            #### Default (`provider=default`)


            This provider returns results of our internal geocoding engine. It
            is best suited for use cases with user interaction as it does prefix
            searches required for an "autocomplete" use case

            (a user types an address into a search field).


            In addition to the above documented parameters the following
            parameters are possible:


            * `osm_tag` - you can filter `key:value` or exclude places with
            certain OpenStreetMap tags `!key:value`. E.g.
            `osm_tag=tourism:museum` or just the key `osm_tag=tourism`. To
            exclude multiple tags you add multiple `osm_tag` parameters.

            * `location_bias_scale` - describes how much the prominence of a
            result should still be taken into account. Sensible values go from
            0.0 (ignore prominence almost completely) to 1.0 (prominence has
            approximately the same influence as the location). The default is
            0.2.

            * `zoom` - describes the radius around the center to focus on. This
            is a number that should correspond roughly to the map zoom parameter
            of a corresponding map. The default is zoom=16.

            * `bbox` - the expected format is `minLon,minLat,maxLon,maxLat`.
            This requires reverse=false.

            * `radius` - the search radius in km for the reverse search. This
            requires reverse=true.


            #### Nominatim (`provider=nominatim`)


            The GraphHopper Directions API uses a commercially hosted Nominatim
            geocoder (hosted by [OpenCageData](https://opencagedata.com/)). It
            is best suited for use cases without or less user interaction

            like batch processing or detailed location data retrieval. It is not
            suited for "autocomplete".


            In addition to the above documented parameters we currently support
            the following parameters:


            * countrycode - The country code is a two letter code as defined by
            the ISO 3166-1 Alpha 2 standard. E.g. gb for the United Kingdom, fr
            for France, us for United States.

            * bounds - the expected format is `minLon,minLat,maxLon,maxLat`


            #### Gisgraphy (`provider=gisgraphy`)


            This provider returns results from the Gisgraphy geocoder which you
            can try
            [here](https://services.gisgraphy.com/static/leaflet/index.html).


            **Limitations:** The `locale` parameter is not supported. Gisgraphy
            does not return OSM tags or an extent.


            Gisgraphy has a special autocomplete API, which you can use by
            adding `autocomplete=true` (does not work with `reverse=true`). The
            autocomplete API is optimized on predicting text input, but returns
            less information.


            In addition to the above documented parameters Gisgraphy allows to
            use the following parameters, which can be used as documented
            [here](https://www.gisgraphy.com/documentation/user-guide.php#geocodingservice):


            * `radius` - radius in meters

            * `country` - restrict search for the specified country. The value
            must be the ISO 3166 Alpha 2 code of the country.


            #### OpenCage Data (`provider=opencagedata`)


            This provider returns results from the OpenCageData geocoder which
            you can try [here](https://geocoder.opencagedata.com/demo).

            The difference to the `nominatim` provider is that [other
            geocoders](https://opencagedata.com/credits) might be used under the
            hood.


            In addition to the above documented parameters OpenCage Data allows
            to use the following parameters, which can be used as documented
            [here](https://geocoder.opencagedata.com/api#forward-opt):


            * countrycode - The country code is a two letter code as defined by
            the ISO 3166-1 Alpha 2 standard. E.g. gb for the United Kingdom, fr
            for France, us for United States. 

            * bounds - the expected format is `minLon,minLat,maxLon,maxLat`
          schema:
            type: string
            default: default
      tags:
        - Geocoding
      responses:
        '200':
          description: An array found locations
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeocodingResponse'
          headers:
            X-RateLimit-Limit:
              description: Your current daily credit limit.
              schema:
                type: integer
            X-RateLimit-Remaining:
              description: >-
                Your remaining credits until the reset. This value is measured
                before the current request's cost is deducted. Subtract
                `X-RateLimit-Credits` to get the balance after the request.
              schema:
                type: integer
            X-RateLimit-Reset:
              description: >-
                The number of seconds that you have to wait before a reset of
                the credit count is done.
              schema:
                type: integer
            X-RateLimit-Credits:
              description: >-
                The credit costs for this request. Note it could be a decimal
                and even negative number, e.g. when an async request failed.
              schema:
                type: integer
  /vrp:
    post:
      summary: Solve a route optimization problem
      description: >

        Start by reading the [introduction](#tag/Route-Optimization-API) to the
        Route Optimization API.


        To solve a new vehicle routing problem, make a HTTP POST to this URL


        ```

        https://graphhopper.com/api/1/vrp?key=<your_key>

        ```


        It returns the solution to this problem in the JSON response.


        Please note that this endpoint is well suited for solving smaller
        problems.

        Larger vehicle routing problems that take longer than 10 seconds to
        solve cannot be processed using this endpoint.

        To solve them, please use the [batch mode URL](#operation/asyncVRP)
        instead.
      operationId: solveVRP
      requestBody:
        description: The request that contains the vehicle routing problem to be solved.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Request'
            example:
              vehicles:
                - vehicle_id: vehicle-1
                  type_id: cargo-bike
                  start_address:
                    location_id: berlin
                    lon: 13.406
                    lat: 52.537
                  earliest_start: 1554804329
                  latest_end: 1554808329
                  max_jobs: 3
                - vehicle_id: vehicle-2
                  type_id: cargo-bike
                  start_address:
                    location_id: berlin
                    lon: 13.406
                    lat: 52.537
                  earliest_start: 1554804329
                  latest_end: 1554808329
                  max_jobs: 3
                  skills:
                    - physical strength
              vehicle_types:
                - type_id: cargo-bike
                  capacity:
                    - 10
                  profile: bike
              services:
                - id: s-1
                  name: visit-Joe
                  address:
                    location_id: 13.375854_52.537338
                    lon: 13.375854
                    lat: 52.537338
                  size:
                    - 1
                  time_windows:
                    - earliest: 1554805329
                      latest: 1554806329
                - id: s-2
                  name: serve-Peter
                  address:
                    location_id: 13.393364_52.525851
                    lon: 13.393364
                    lat: 52.525851
                  size:
                    - 1
                - id: s-3
                  name: visit-Michael
                  address:
                    location_id: 13.416882_52.523543
                    lon: 13.416882
                    lat: 52.523543
                  size:
                    - 1
                - id: s-4
                  name: do nothing
                  address:
                    location_id: 13.395767_52.514038
                    lon: 13.395767
                    lat: 52.514038
                  size:
                    - 1
              shipments:
                - id: 7fe77504-7df8-4497-843c-02d70b6490ce
                  name: pickup and deliver pizza to Peter
                  priority: 1
                  pickup:
                    address:
                      location_id: 13.387613_52.529961
                      lon: 13.387613
                      lat: 52.529961
                  delivery:
                    address:
                      location_id: 13.380575_52.513614
                      lon: 13.380575
                      lat: 52.513614
                  size:
                    - 1
                  required_skills:
                    - physical strength
              objectives:
                - type: min
                  value: vehicles
                - type: min
                  value: completion_time
              configuration:
                routing:
                  calc_points: true
                  snap_preventions:
                    - motorway
                    - trunk
                    - tunnel
                    - bridge
                    - ferry
      tags:
        - Route Optimization
      x-codeSamples:
        - lang: curl
          source: >-
            curl -X POST -H "Content-Type: application/json"  
            "https://graphhopper.com/api/1/vrp?key=api_key"   -d '{
              "vehicles": [
                {
                  "vehicle_id": "my_vehicle",
                  "start_address": {
                    "location_id": "berlin",
                    "lon": 13.406,
                    "lat": 52.537
                  }
                }
              ],
              "services": [
                {
                  "id": "hamburg",
                  "name": "visit_hamburg",
                  "address": {
                    "location_id": "hamburg",
                    "lon": 9.999,
                    "lat": 53.552
                  }
                },
                { 
                 "id": "munich",
                  "name": "visit_munich",
                  "address": {
                    "location_id": "munich",
                    "lon": 11.57,
                    "lat": 48.145
                  }
                }
              ]}'
        - lang: Java
          source: >-
            OkHttpClient client = new OkHttpClient();

            MediaType mediaType = MediaType.parse("application/json");

            RequestBody body = RequestBody.create(mediaType, "{\n  \"vehicles\":
            [\n    {\n      \"vehicle_id\": \"my_vehicle\",\n     
            \"start_address\": {\n        \"location_id\": \"berlin\",\n       
            \"lon\": 13.406,\n        \"lat\": 52.537\n      }\n    }\n  ],\n 
            \"services\": [\n    {\n      \"id\": \"hamburg\",\n      \"name\":
            \"visit_hamburg\",\n      \"address\": {\n        \"location_id\":
            \"hamburg\",\n        \"lon\": 9.999,\n        \"lat\":
            53.552\n      }\n    },\n    { \n     \"id\": \"munich\",\n     
            \"name\": \"visit_munich\",\n      \"address\": {\n       
            \"location_id\": \"munich\",\n        \"lon\": 11.57,\n       
            \"lat\": 48.145\n      }\n    }\n  ]}");

            Request request = new Request.Builder()
                    .url("https://graphhopper.com/api/1/vrp?key=api_key")
                    .post(body)
                    .addHeader("content-type", "application/json")
                    .build();

            Response response = client.newCall(request).execute();
