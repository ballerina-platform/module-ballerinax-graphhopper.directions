info:
  title: GraphHopper Directions API
  description: GraphHopper Directions API for A-to-B route planning, turn-by-turn navigation, route optimization, isochrone calculations, map matching, geocoding and location clustering.
  version: 1.0.0
  termsOfService: https://www.graphhopper.com/terms/
  contact:
    name: Support
    email: support@graphhopper.com
    url: https://www.graphhopper.com/
  x-logo:
    url: img/graphhopper-logo.svg
    altText: GraphHopper
servers:
  - url: https://graphhopper.com/api/1
tags:
  - name: Map Data and Routing Profiles
    description: >

      The default data source is [OpenStreetMap](https://www.openstreetmap.org).
      As an alternative, we also offer TomTom MultiNet.


      Please read in [our attribution
      page](https://www.graphhopper.com/attribution/) on how to attribute these
      different data sources.


      # OpenStreetMap


      #### Geographical Coverage


      [OpenStreetMap](https://www.openstreetmap.org) covers the whole world. If
      you want to see for yourself if we can provide data suitable for your
      region,

      please visit [GraphHopper Maps](https://graphhopper.com/maps/).

      You can edit and modify OpenStreetMap data if you find that important
      information is missing, e.g. a weight limit for a bridge.

      [Here](https://wiki.openstreetmap.org/wiki/Beginners%27_guide) is a
      beginner's guide that shows how to add data. If you have edited data, we
      usually consider your data after 1 week at the latest.


      #### Standard Routing Profiles


      The Routing, Matrix and Route Optimization APIs support the following
      profiles. But also see the section about customized profiles below the
      table.


      Name             | Description           |
      Restrictions                        | Icon

      -----------------|:----------------------|:------------------------------------|:---------------------------------------------------------

      car              | Car mode              | car access, weight=2500kg,
      width=2m, height=2m           | ![car image](./img/car.png)

      car_avoid_motorway | Car mode            | like car that heavily penalizes
      motorways        | ![car image](./img/car.png)

      car_avoid_ferry    | Car mode            | like car that heavily penalizes
      ferries          | ![car image](./img/car.png)

      car_avoid_toll     | Car mode            | like car that heavily penalizes
      tolls and ferries| ![car image](./img/car.png)

      small_truck        | Small truck like a Mercedes Sprinter, Ford Transit or
      Iveco Daily | height=2.7m, width=2+0.28m, length=5.5m, weight=2080+1400 kg
