  /cluster:
    post:
      summary: Solve a clustering problem
      description: >

        The Cluster endpoint is used with a POST request towards

        `https://graphhopper.com/api/1/cluster?key=<your_key>`. The solution
        will be provided in the JSON response.

        Please note that for problems that take longer than 10 seconds a bad
        request error is returned.

        In this case please use the asynchronous [Batch Cluster
        Endpoint](#operation/asyncClusteringProblem) instead.
      operationId: solveClusteringProblem
      requestBody:
        description: Request object that contains the problem to be solved
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClusterRequest'
      tags:
        - Clustering
      responses:
        '200':
          description: A response containing the solution
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClusterResponse'
          headers:
            X-RateLimit-Limit:
              description: Your current daily credit limit.
              schema:
                type: integer
            X-RateLimit-Remaining:
              description: >-
                Your remaining credits until the reset. This value is measured
                before the current request's cost is deducted. Subtract
                `X-RateLimit-Credits` to get the balance after the request.
              schema:
                type: integer
            X-RateLimit-Reset:
              description: >-
                The number of seconds that you have to wait before a reset of
                the credit count is done.
              schema:
                type: integer
            X-RateLimit-Credits:
              description: >-
                The credit costs for this request. Note it could be a decimal
                and even negative number, e.g. when an async request failed.
              schema:
                type: integer
        '400':
          description: Error occurred when reading the request. Request is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequest'
        '500':
          description: Error occurred on server side.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalErrorMessage'
  /cluster/calculate:
    post:
      summary: Submit a clustering job
      description: >

        Prefer the [synchronous endpoint](#operation/solveClusteringProblem) and
        use this Batch Cluster endpoint for

        long running problems only. The work flow is asynchronous:


        - send a POST request towards
        `https://graphhopper.com/api/1/cluster/calculate?key=<your_key>` and
        fetch the job_id.

        - poll the solution every 500ms until it gives `status=finished`. Do
        this with a GET request
          towards `https://graphhopper.com/api/1/cluster/solution/<job_id>?key=<your_key>`.
      operationId: asyncClusteringProblem
      requestBody:
        description: Request object that contains the problem to be solved
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClusterRequest'
      tags:
        - Clustering
      responses:
        '200':
          description: >-
            A jobId you can use to retrieve your solution from the server - see
            solution endpoint.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobId'
          headers:
            X-RateLimit-Limit:
              description: Your current daily credit limit.
              schema:
                type: integer
            X-RateLimit-Remaining:
              description: >-
                Your remaining credits until the reset. This value is measured
                before the current request's cost is deducted. Subtract
                `X-RateLimit-Credits` to get the balance after the request.
              schema:
                type: integer
            X-RateLimit-Reset:
              description: >-
                The number of seconds that you have to wait before a reset of
                the credit count is done.
              schema:
                type: integer
            X-RateLimit-Credits:
              description: >-
                The credit costs for this request. Note it could be a decimal
                and even negative number, e.g. when an async request failed.
              schema:
                type: integer
          links:
            GetSolutionByJobId:
              operationId: getSolution
              parameters:
                jobId: $response.body#/job_id
              description: >
                The `job_id` value returned in the response can be used as the
                `jobId` parameter in `GET /vrp/{jobId}`.
        '400':
          description: Error occurred when reading client request. Request is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequest'
        '500':
          description: Error occurred on server side.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalErrorMessage'
  /cluster/solution/{jobId}:
    get:
      summary: Retrieve solution of a clustering job
      description: >
        This endpoint returns the solution of the clustering problems submitted
        to the [Batch Cluster endpoint](#operation/asyncClusteringProblem).

        You can fetch it with the job_id, you have been sent.
      operationId: getClusterSolution
      parameters:
        - in: path
          name: jobId
          description: Request solution with jobId
          required: true
          schema:
            type: string
      tags:
        - Clustering
      responses:
        '200':
          description: A response containing the solution
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClusterResponse'
          headers:
            X-RateLimit-Limit:
              description: Your current daily credit limit.
              schema:
                type: integer
            X-RateLimit-Remaining:
              description: >-
                Your remaining credits until the reset. This value is measured
                before the current request's cost is deducted. Subtract
                `X-RateLimit-Credits` to get the balance after the request.
              schema:
                type: integer
            X-RateLimit-Reset:
              description: >-
                The number of seconds that you have to wait before a reset of
                the credit count is done.
              schema:
                type: integer
            X-RateLimit-Credits:
              description: >-
                The credit costs for this request. Note it could be a decimal
                and even negative number, e.g. when an async request failed.
              schema:
                type: integer
        '400':
          description: Error occurred on client side such as invalid input.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequest'
        '404':
          description: Requested solution could not be found.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    description: Error message
                    example: Invalid job_id 73314c89-ee4b-459c-aca4-0ad6d6e558da
                  status:
                    type: string
                    description: status
                    default: finished
                    example: finished
        '500':
          description: Error occurred on server side.
