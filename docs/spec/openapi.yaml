  /isochrone:
    get:
      summary: Compute an isochrone
      operationId: getIsochrone
      parameters:
        - name: point
          in: query
          description: Specify the start coordinate
          required: true
          schema:
            type: string
        - name: time_limit
          in: query
          description: Specify which time the vehicle should travel. In seconds.
          schema:
            default: 600
            type: integer
            format: int32
        - name: distance_limit
          in: query
          description: Specify which distance the vehicle should travel. In meters.
          schema:
            type: integer
            format: int32
        - name: profile
          in: query
          schema:
            $ref: '#/components/schemas/VehicleProfileId'
        - name: buckets
          in: query
          description: >-
            Number by which to divide the given `time_limit` to create `buckets`
            nested isochrones of time intervals
            `time_limit-n*time_limit/buckets`. Applies analogously to
            `distance_limit`.
          schema:
            default: 1
            type: integer
            format: int32
        - name: reverse_flow
          in: query
          description: >
            If `false` the flow goes from point to the polygon, if `true` the
            flow goes from the polygon "inside" to the point.

            Example use case for `false`&#58; *How many potential customer can
            be reached within 30min travel time from your store* vs. `true`&#58;
            *How many customers can reach your store within 30min travel time.*
          schema:
            default: false
            type: boolean
      x-codeSamples:
        - lang: curl
          source: >-
            curl
            "https://graphhopper.com/api/1/isochrone?point=51.131108,12.414551&key=api_key"
        - lang: Java
          source: |-
            OkHttpClient client = new OkHttpClient();
            Request request = new Request.Builder()
                    .url("https://graphhopper.com/api/1/isochrone?point=51.131108,12.414551&key=api_key")
                    .get()
                    .build();

            Response response = client.newCall(request).execute();
      tags:
        - Isochrones
      responses:
        '200':
          description: Isochrone Result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IsochroneResponse'
  /matrix:
    post:
      summary: Compute a matrix
      description: >
        Calculate a matrix of travel times and/or distances between N origins
        and M destinations.


        This includes the common cases of routes from one origin to many
        destinations, or from many origins to one

        destination.
      operationId: postMatrix
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/MatrixRequest'
                - $ref: '#/components/schemas/SymmetricalMatrixRequest'
      tags:
        - Matrices
      responses:
        '200':
          description: Matrix API response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MatrixResponse'
          headers:
            X-RateLimit-Limit:
              description: Your current daily credit limit.
              schema:
                type: integer
            X-RateLimit-Remaining:
              description: >-
                Your remaining credits until the reset. This value is measured
                before the current request's cost is deducted. Subtract
                `X-RateLimit-Credits` to get the balance after the request.
              schema:
                type: integer
            X-RateLimit-Reset:
              description: >-
                The number of seconds that you have to wait before a reset of
                the credit count is done.
              schema:
                type: integer
            X-RateLimit-Credits:
              description: >-
                The credit costs for this request. Note it could be a decimal
                and even negative number, e.g. when an async request failed.
              schema:
                type: integer
    get:
      summary: Compute a matrix
      description: >
        For N origins and M destinations, compute routes from all origins to all
        destinations and output

        the result as a matrix of travel times and/or distances.


        This includes the common cases of routes from one origin to many
        destinations, or from many origins to one

        destination.
      operationId: getMatrix
      x-codeSamples:
        - lang: curl
          source: >-
            curl
            "https://graphhopper.com/api/1/matrix?point=49.932707,11.588051&point=50.241935,10.747375&point=50.118817,11.983337&type=json&profile=car&out_array=weights&out_array=times&out_array=distances&key=api_key"
        - lang: Java
          source: |-
            OkHttpClient client = new OkHttpClient();
            Request request = new Request.Builder()
                    .url("https://graphhopper.com/api/1/matrix?point=49.932707,11.588051&point=50.241935,10.747375&point=50.118817,11.983337&type=json&profile=car&out_array=weights&out_array=times&out_array=distances&key=api_key")
                    .get()
                    .build();

            Response response = client.newCall(request).execute();
      parameters:
        - name: profile
          in: query
          schema:
            $ref: '#/components/schemas/VehicleProfileId'
        - name: point
          in: query
          description: >-
            Specify multiple points in `latitude,longitude` for which the
            weight-, route-, time- or distance-matrix should be calculated. In
            this case the starts are identical to the destinations. If there are
            N points, then NxN entries will be calculated. The order of the
            point parameter is important. Specify at least three points. Cannot
            be used together with from_point or to_point.
          required: false
          schema:
            type: array
            items:
              type: string
          explode: true
        - name: from_point
          in: query
          description: >-
            The origin points for the routes in `latitude,longitude`. E.g. if
            you want to calculate the three routes A-&gt;1, A-&gt;2, A-&gt;3
            then you have one from_point parameter and three to_point
            parameters.
          required: false
          schema:
            type: array
            items:
              type: string
          explode: true
        - name: to_point
          in: query
          description: The destination points for the routes in `latitude,longitude`.
          required: false
          schema:
            type: array
            items:
              type: string
          explode: true
        - name: point_hint
          in: query
          description: >-
            Optional parameter. Specifies a hint for each `point` parameter to
            prefer a certain street for the closest location lookup. E.g. if
            there is an address or house with two or more neighboring streets
            you can control for which street the closest location is looked up.
          required: false
          schema:
            type: array
            items:
              type: string
          explode: true
        - name: from_point_hint
          in: query
          description: For the from_point parameter. See point_hint
          required: false
          schema:
            type: array
            items:
              type: string
          explode: true
        - name: to_point_hint
          in: query
          description: For the to_point parameter. See point_hint
          required: false
          schema:
            type: array
            items:
              type: string
          explode: true
        - name: snap_prevention
          in: query
          description: >
            Optional parameter. 'Snapping' is the process of finding the closest
            road location for GPS coordinates provided in the `point` parameter.
            The `snap_prevention` parameter allows you to prevent snapping to
            specific types of roads. For example, if `snap_prevention` is set to
            bridge, the routing engine will avoid snapping to a bridge, even if
            it is the closest road for the given `point`. Current supported
            values: `motorway`, `trunk`, `ferry`, `tunnel`, `bridge` and `ford`.
            Multiple values are specified like
            `snap_prevention=ferry&snap_prevention=motorway`. Note that once
            snapped the routing algorithm can still route over bridges (or the
            other values). To avoid this you need to use the `custom_model`.
          schema:
            type: array
            items:
              type: string
          explode: true
        - name: curbside
          in: query
          description: >-
            Optional parameter. It specifies on which side a point should be
            relative to the driver when she leaves/arrives at a start/target/via
            point. You need to specify this parameter for either none or all
            points. Only supported for motor vehicles and OpenStreetMap.
          required: false
          schema:
            type: array
            items:
              type: string
              enum:
                - any
                - right
                - left
          explode: true
        - name: from_curbside
          in: query
          description: Curbside setting for the from_point parameter. See curbside.
          required: false
          schema:
            type: array
            items:
              type: string
              enum:
                - any
                - right
                - left
          explode: true
        - name: to_curbside
          in: query
          description: Curbside setting for the to_point parameter. See curbside.
          required: false
          schema:
            type: array
            items:
              type: string
              enum:
                - any
                - right
                - left
          explode: true
        - name: out_array
          in: query
          description: >-
            Specifies which arrays should be included in the response. Specify
            one or more of the following options 'weights', 'times',
            'distances'. To specify more than one array use e.g.
            out_array=times&out_array=distances. The units of the entries of
            distances are meters, of times are seconds and of weights is
            arbitrary and it can differ for different vehicles or versions of
            this API.
          required: false
          schema:
            type: array
            items:
              type: string
          explode: true
        - name: fail_fast
          in: query
          description: >-
            Specifies whether or not the matrix calculation should return with
            an error as soon as possible in case some points cannot be found or
            some points are not connected. If set to `false` the
            time/weight/distance matrix will be calculated for all valid points
            and contain the `null` value for all entries that could not be
            calculated. The `hint` field of the response will also contain
            additional information about what went wrong (see its
            documentation).
          required: false
          schema:
            type: boolean
            default: true
      tags:
        - Matrices
      responses:
        '200':
          description: Matrix API response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MatrixResponse'
          headers:
            X-RateLimit-Limit:
              description: Your current daily credit limit.
              schema:
                type: integer
            X-RateLimit-Remaining:
              description: >-
                Your remaining credits until the reset. This value is measured
                before the current request's cost is deducted. Subtract
                `X-RateLimit-Credits` to get the balance after the request.
              schema:
                type: integer
            X-RateLimit-Reset:
              description: >-
                The number of seconds that you have to wait before a reset of
                the credit count is done.
              schema:
                type: integer
            X-RateLimit-Credits:
              description: >-
                The credit costs for this request. Note it could be a decimal
                and even negative number, e.g. when an async request failed.
              schema:
                type: integer
  /matrix/calculate:
    post:
      summary: Submit a matrix computation job
      operationId: calculateMatrix
      description: >
        An alternate endpoint for computing a large matrix asynchronously, where
        a request against the regular 

        endpoint would result in a timeout.


        The request format is the same, but instead of the result, you are given
        a job identification number that

        you can use to retrieve the result once it is available.
                
        In most cases, prefer the regular endpoints.


        Here are some full examples via curl:

        ```bash

        $ curl -X POST -H "Content-Type: application/json"
        "https://graphhopper.com/api/1/matrix/calculate?key=[YOUR_KEY]" -d
        '{"points":[[13.29895,52.48696],[13.370876,52.489575],[13.439026,52.511206]]}'

        {"job_id":"7ac65787-fb99-4e02-a832-2c3010c70097"}

        ```


        Pick the returned `job_id` and use it in the next GET requests:

        ```bash

        $ curl -X GET
        "https://graphhopper.com/api/1/matrix/solution/7ac65787-fb99-4e02-a832-2c3010c70097?key=[YOUR_KEY]"

        {"status":"waiting"}

        ```


        When the calculation is finished (`status:finished`) the JSON response
        will contain the full matrix JSON under `solution`:

        ```bash

        $ curl -X GET
        "https://graphhopper.com/api/1/matrix/solution/7ac65787-fb99-4e02-a832-2c3010c70097?key=[YOUR_KEY]"

        {"solution":{"weights":[[0.0,470.453,945.414],[503.793,0.0,580.871],[970.49,569.511,0.0]],"info":{"copyrights":["GraphHopper","OpenStreetMap
        contributors"]}},"status":"finished"}

        ```


        Please note that if an error occured while calculation the JSON will not
        have a status but contain directly the error message e.g.:

        ```json

        {"message":"Cannot find from_points: 1"}

        ```

        And the optional `hints` array.
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/MatrixRequest'
                - $ref: '#/components/schemas/SymmetricalMatrixRequest'
      tags:
        - Matrices
      responses:
        '200':
          description: A jobId you can use to retrieve your solution from the server.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobId'
          headers:
            X-RateLimit-Limit:
              description: Your current daily credit limit.
              schema:
                type: integer
            X-RateLimit-Remaining:
              description: >-
                Your remaining credits until the reset. This value is measured
                before the current request's cost is deducted. Subtract
                `X-RateLimit-Credits` to get the balance after the request.
              schema:
                type: integer
            X-RateLimit-Reset:
              description: >-
                The number of seconds that you have to wait before a reset of
                the credit count is done.
              schema:
                type: integer
            X-RateLimit-Credits:
              description: >-
                The credit costs for this request. Note it could be a decimal
                and even negative number, e.g. when an async request failed.
              schema:
                type: integer
