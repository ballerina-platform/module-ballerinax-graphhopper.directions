      | height=3.7m, width=2.6+0.34m, length=12m, weight=13000+13000 kg,
      hgv=yes, 3 Axes | ![truck image](./img/truck.png)

      scooter            | Moped mode          | Fast inner city, often used for
      food delivery, is able to ignore certain bollards, maximum speed of
