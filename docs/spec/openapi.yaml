    GeocodingLocation:
      type: object
      properties:
        point:
          $ref: '#/components/schemas/GeocodingPoint'
        osm_id:
          type: integer
          format: int64
          description: The OSM ID of the entity
        osm_type:
          type: string
          description: N = node, R = relation, W = way
        osm_key:
          type: string
          description: The OSM key of the entity
        name:
          type: string
          description: The name of the entity. Can be a boundary, POI, address, etc
        country:
          type: string
          description: The country of the address
        city:
          type: string
          description: The city of the address
        state:
          type: string
          description: The state of the address
        street:
          type: string
          description: The street of the address
        housenumber:
          type: string
          description: The housenumber of the address
        postcode:
          type: string
          description: The postcode of the address
    GeocodingPoint:
      type: object
      properties:
        lat:
          type: number
          format: double
          description: Latitude
        lng:
          type: number
          format: double
          description: Longitude
    MatrixRequest:
      type: object
      properties:
        profile:
          $ref: '#/components/schemas/VehicleProfileId'
        from_points:
          description: >-
            The origin points for the routes in an array of
            `[longitude,latitude]`.
          type: array
          items:
            type: array
            items:
              type: number
              format: double
        to_points:
          description: >-
            The destination points for the routes in an array of
            `[longitude,latitude]`.
          type: array
          items:
            type: array
            items:
              type: number
              format: double
        from_point_hints:
          description: See `point_hints`of symmetrical matrix
          type: array
          items:
            type: string
        to_point_hints:
          description: See `point_hints`of symmetrical matrix
          type: array
          items:
            type: string
        snap_preventions:
          description: See `snap_preventions` of symmetrical matrix
          type: array
          items:
            type: string
        from_curbsides:
          description: See `curbsides`of symmetrical matrix
          type: array
          items:
            type: string
        to_curbsides:
          description: See `curbsides`of symmetrical matrix
          type: array
          items:
            type: string
        out_arrays:
          description: >-
            Specifies which matrices should be included in the response. Specify
            one or more of the following options `weights`, `times`,
            `distances`. The units of the entries of `distances` are meters, of
            `times` are seconds and of `weights` is arbitrary and it can differ
            for different vehicles or versions of this API.
          type: array
          items:
            type: string
        fail_fast:
          description: >-
            Specifies whether or not the matrix calculation should return with
            an error as soon as possible in case some points cannot be found or
            some points are not connected. If set to `false` the
            time/weight/distance matrix will be calculated for all valid points
            and contain the `null` value for all entries that could not be
            calculated. The `hint` field of the response will also contain
            additional information about what went wrong (see its
            documentation).
          type: boolean
          default: true
      example:
        from_points:
          - - -0.11379003524780275
            - 51.53664617804063
          - - -0.10866165161132814
            - 51.538621486960956
          - - -0.11059284210205078
            - 51.53245503603458
        to_points:
          - - -0.09576559066772462
            - 51.512882367963456
          - - -0.08797645568847656
            - 51.51317615367198
        from_point_hints:
          - Copenhagen Street
          - Richmond Avenue
          - White Lion Street
        to_point_hints:
          - Cannon
          - Cornhill
        out_arrays:
          - weights
          - times
          - distances
        vehicle: car
    SymmetricalMatrixRequest:
      type: object
      properties:
        profile:
          $ref: '#/components/schemas/VehicleProfileId'
        points:
          description: >-
            Specify multiple points for which the weight-, route-, time- or
            distance-matrix should be calculated as follows:
            `[longitude,latitude]`. In this case the origins are identical to
            the destinations. Thus, if there are N points, NxN entries are
            calculated. The order of the point parameter is important. Specify
            at least three points. Cannot be used together with `from_point` or
            `to_point.`.
          type: array
          items:
            type: array
            items:
              type: number
              format: double
        point_hints:
          description: >-
            Optional parameter. Specifies a hint for each point in the `points`
            array to prefer a certain street for the closest location lookup.
            E.g. if there is an address or house with two or more neighboring
            streets you can control for which street the closest location is
            looked up.
          type: array
          items:
            type: string
        snap_preventions:
          type: array
          items:
            type: string
            enum:
              - motorway
              - trunk
              - bridge
              - ford
              - tunnel
              - ferry
          description: >-
            Optional parameter. 'Snapping' is the process of finding the closest
            road location for GPS coordinates provided in the `points` array.
            The `snap_preventions` array allows you to prevent snapping to
            specific types of roads. For example, if the array includes
            `bridge`, then the routing engine will avoid snapping to a bridge,
            even if it is the closest road for the given point. Note that once
            snapped the routing algorithm can still route over bridges (or the
            other values). To avoid this you need to use the `custom_model`.
          example:
            - motorway
            - trunk
            - bridge
            - tunnel
            - ferry
            - ford
        curbsides:
          description: >-
            Optional parameter. It specifies on which side a point should be
            relative to the driver when she leaves/arrives at a start/target/via
            point. You need to specify this parameter for either none or all
            points. Only supported for motor vehicles and OpenStreetMap.
          type: array
          items:
            type: string
            enum:
              - right
              - left
              - any
        out_arrays:
          description: >-
            Specifies which matrices should be included in the response. Specify
            one or more of the following options `weights`, `times`,
            `distances`. The units of the entries of `distances` are meters, of
            `times` are seconds and of `weights` is arbitrary and it can differ
            for different vehicle profiles or versions of this API.
          type: array
          items:
            type: string
        fail_fast:
          description: >-
            Specifies whether or not the matrix calculation should return with
            an error as soon as possible in case some points cannot be found or
            some points are not connected. If set to `false` the
            time/weight/distance matrix will be calculated for all valid points
            and contain the `null` value for all entries that could not be
            calculated. The `hint` field of the response will also contain
            additional information about what went wrong (see its
            documentation).
          type: boolean
          default: true
      example:
        points:
          - - -0.11379003524780275
            - 51.53664617804063
          - - -0.10866165161132814
            - 51.538621486960956
          - - -0.11059284210205078
            - 51.53245503603458
        point_hints:
          - Copenhagen Street
          - Richmond Avenue
          - White Lion Street
        out_arrays:
          - weights
          - times
          - distances
        vehicle: car
    MatrixResponse:
      type: object
      properties:
        distances:
          description: >-
            The distance matrix for the specified points in the same order as
            the time matrix. The distances are in meters. If `fail_fast=false`
            the matrix will contain `null` for connections that could not be
            found.
          type: array
          items:
            type: array
            items:
              type: number
              format: int64
        times:
          description: >-
            The time matrix for the specified points in the order [[from1->to1,
            from1->to2, ...], [from2->to1, from2->to2, ...], ...]. The times are
            in seconds. If `fail_fast=false` the matrix will contain `null` for
            connections that could not be found.
          type: array
          items:
            type: array
            items:
              type: number
              format: int64
        weights:
          description: >-
            The weight matrix for the specified points in the same order as the
            time matrix. The weights for different vehicle profiles can have a
            different unit but the weights array is perfectly suited as input
            for Vehicle Routing Problems as it is currently faster to calculate.
            If `fail_fast=false` the matrix will contain `null` for connections
            that could not be found.
          type: array
          items:
            type: array
            items:
              type: number
              format: double
        info:
          $ref: '#/components/schemas/ResponseInfo'
        hints:
          description: Optional. Additional response data.
          type: array
          items:
            type: object
            properties:
              message:
                description: Short description of this hint
                type: string
              details:
                description: Details of this hint
                type: string
              invalid_from_points:
                description: >-
                  Optional. An array of from_point indices of points that could
                  not be found. Will only be added if `fail_fast=false` and some
                  `from_point`s were not found.`
                type: array
                items:
                  type: number
                  format: int32
              invalid_to_points:
                description: >-
                  Optional. An array of to_point indices of points that could
                  not be found. Will only be added if `fail_fast=false` and some
                  `to_point`s were not found.`
                type: array
                items:
                  type: number
                  format: int32
              point_pairs:
                description: >-
                  Optional. An array of two-element arrays representing the
                  from/to_point indices of points for which no connection could
                  be found. Will only be added if `fail_fast=false` and some
                  connections were not found.
                type: array
                items:
                  type: array
                  items:
                    type: number
                    format: int32
      example:
        distances:
          - - 0
            - 97653
            - 48887
          - - 97426
            - 0
            - 121035
          - - 49006
            - 121049
            - 0
        times:
          - - 0
            - 4197
            - 2994
          - - 4192
            - 0
            - 6074
          - - 3006
            - 6062
            - 0
        weights:
          - - 0
            - 5662.551
            - 3727.147
          - - 5653.807
            - 0
            - 7889.653
          - - 3741.528
            - 7878.365
            - 0
        info:
          copyrights:
            - GraphHopper
            - OpenStreetMap contributors
    RouteRequest:
      type: object
      properties:
        profile:
          $ref: '#/components/schemas/VehicleProfileId'
        points:
          description: >
            The query points used to calculate the route, requiring at least a
            start and a destination point, with optional via-points in between.
          type: array
          items:
            type: array
            items:
              type: number
              format: double
          example:
            - - 11.539421
              - 48.118477
            - - 11.559023
              - 48.12228
        point_hints:
          description: >-
            Optional parameter. Specifies a hint for each point in the `points`
            array to prefer a certain street for the closest location lookup.
            E.g. if there is an address or house with two or more neighboring
            streets you can control for which street the closest location is
            looked up. Make sure you do not include the house number of city
            name and only the street name to improve the quality of the
            matching.
          type: array
          items:
            type: string
          example:
            - Lindenschmitstraße
            - Thalkirchener Str.
        snap_preventions:
          type: array
          items:
            type: string
            enum:
              - motorway
              - trunk
              - bridge
              - ford
              - tunnel
              - ferry
          description: >-
            Optional parameter. 'Snapping' is the process of finding the closest
            road location for GPS coordinates provided in the `points` array.
            The `snap_preventions` array allows you to prevent snapping to
            specific types of roads. For example, if the array includes
            `bridge`, then the routing engine will avoid snapping to a bridge,
            even if it is the closest road for the given point. Note that once
            snapped the routing algorithm can still route over bridges (or the
            other values). To avoid this you need to use the `custom_model`.
          example:
            - motorway
            - trunk
            - bridge
            - tunnel
            - ferry
            - ford
        curbsides:
          description: >-
            Optional parameter. It specifies on which side a point should be
            relative to the driver when she leaves/arrives at a start/target/via
            point. You need to specify this parameter for either none or all
            points. Only supported for motor vehicle profiles and OpenStreetMap.
          type: array
          items:
            type: string
            enum:
              - any
              - right
              - left
          example:
            - any
            - right
        locale:
          description: >
            The locale of the resulting turn instructions. E.g. `pt_PT` for
            Portuguese or `de` for German.
          type: string
          default: en
        elevation:
          type: boolean
          description: >
            If `true`, a third coordinate, the altitude, is included with all
            positions in the response.

            This changes the format of the `points` and `snapped_waypoints`
            fields of the response, in both their

            encodings. Unless you switch off the `points_encoded` parameter, you
            need special code on the

            client side that can handle three-dimensional coordinates.
          default: false
        details:
          type: array
          items:
            type: string
          description: >
            Optional parameter. The following path details are available:
            `street_name`, `street_ref`, `street_destination`, `leg_time`,
            `leg_distance`, `roundabout`, `country`, `time`, `distance`,
            `max_speed`,

            `max_weight`, `max_width`, `toll`, `road_class`, `road_class_link`,
            `road_access`, `road_environment`, `hazmat`, `hazmat_tunnel`,
            `hazmat_water`, 

            `lanes`, `surface`, `smoothness`, `hike_rating`, `mtb_rating`,
            `foot_network`, `bike_network`. Read more about the usage of path
            details [here](https://discuss.graphhopper.com/t/2539).
        optimize:
          type: string
          default: 'false'
          description: >
            Normally, the calculated route will visit the points in the order
            you specified them.

            If you have more than two points, you can set this parameter to
            `"true"` and the points may be re-ordered to minimize the total
            travel time.

            Keep in mind that the limits on the number of locations of the Route
            Optimization API applies, and the request costs more credits.
        instructions:
          type: boolean
          default: true
          description: |
            If instructions should be calculated and returned
        calc_points:
          type: boolean
          default: true
          description: |
            If the points for the route should be calculated at all.
        debug:
          type: boolean
          default: false
          description: |
            If `true`, the output will be formatted.
        points_encoded:
          type: boolean
          default: true
          description: >
            Allows changing the encoding of location data in the response. The
            default is polyline encoding, which is compact

            but requires special client code to unpack. (We provide it in our
            JavaScript client library!)

            Set this parameter to `false` to switch the encoding to simple
            coordinate pairs like `[lon,lat]`, or `[lon,lat,elevation]`.

            See the description of the response format for more information.
        ch.disable:
          type: boolean
          default: false
          description: >
            Use `true` to enable the flexible mode to use the `custom_model` or
            any of the following options below.
        custom_model:
          $ref: '#/components/schemas/CustomModel'
        headings:
          type: array
          items:
            type: integer
            format: int32
          description: >
            Favour a heading direction for a certain point. Specify either one
            heading for the start point or as many as there are points.

            In this case headings are associated by their order to the specific
            points. Headings are given as north based clockwise angle between 0
            and 360 degree.

            This headings parameter also influences the tour generated with
            `algorithm=round_trip` and forces the initial direction.  Requires
            `ch.disable=true`.
        heading_penalty:
          type: integer
          format: int32
          default: 300
          description: >
            Time penalty in seconds for not obeying a specified heading.
            Requires `ch.disable=true`.
        pass_through:
          type: boolean
          default: false
          description: >
            If `true`, u-turns are avoided at via-points with regard to the
            `heading_penalty`. Requires `ch.disable=true`.
        algorithm:
          type: string
          enum:
            - round_trip
            - alternative_route
          description: >
            Rather than looking for the shortest or fastest path, this parameter
            lets you solve two different problems related to routing:

            With `alternative_route`, we give you not one but several routes
            that are close to optimal, but

            not too similar to each other. Limitation: works with custom_model
            but not with custom profiles.

            With `round_trip`, the route will get you back to where you started.
            This is meant for fun (think of

            a bike trip), so we will add some randomness.

            You can control both of these features with additional parameters,
            see below. 
        round_trip.distance:
          type: integer
          format: int32
          default: 10000
          description: >
            If `algorithm=round_trip`, this parameter configures approximative
            length of the resulting round trip.
        round_trip.seed:
          type: integer
          format: int64
          description: >
            If `algorithm=round_trip`, this sets the random seed. Change this to
            get a different tour for each value.
        alternative_route.max_paths:
          type: integer
          format: int32
          default: 2
          description: >
            If `algorithm=alternative_route`, this parameter sets the number of
            maximum paths which should be calculated. Increasing can lead to
            worse alternatives.
        alternative_route.max_weight_factor:
          type: number
          default: 1.4
          description: >
            If `algorithm=alternative_route`, this parameter sets the factor by
            which the alternatives routes can be longer than the optimal route.
            Increasing can lead to worse alternatives.
        alternative_route.max_share_factor:
          type: number
          default: 0.6
          description: >
            If `algorithm=alternative_route`, this parameter specifies how
            similar an alternative route can be to the optimal route. Increasing
            can lead to worse alternatives.
      example:
        profile: bike
        points:
          - - 11.539421
            - 48.118477
          - - 11.559023
            - 48.12228
        point_hints:
          - Lindenschmitstraße
          - Thalkirchener Str.
        snap_preventions:
          - motorway
          - ferry
          - tunnel
        details:
          - road_class
          - surface
    CustomModel:
      type: object
      properties:
        speed:
          description: See [speed customization](#tag/Custom-Model/Customizing-speed)
          type: array
          items:
            type: object
        priority:
          description: See [priority customization](#tag/Custom-Model/Customizing-priority)
          type: array
          items:
            type: object
        distance_influence:
          description: >-
            Use higher values to prefer shorter routes. See
            [here](#tag/Custom-Model/Customizing-distance_influence) for more
            details.
          type: number
          default: 70
        areas:
          type: object
          $ref: '#/components/schemas/FeatureCollection'
          description: >
            Areas are given in a GeoJson format as FeatureCollection. See more
            details and an example [here](#tag/Custom-Model/Define-areas).
      description: >
        The custom_model modifies the routing behaviour of the specified
        profile. See the [detailed documentation](#tag/Custom-Model). 

        Below is a complete request example in Berlin that limits all speeds to
        100km/h, excludes motorways and makes shorter routes a bit more likely
        than the default due to a higher distance_influence. 

        Note that it also includes the `"ch.disable": true` parameter which is
        required to make use of `custom_model`.


        ```json

        {
          "points": [
            [
              13.31543,
              52.509535
            ],
            [
              13.29779,
              52.512434
            ]
          ],
          "profile": "car",
          "ch.disable": true,
          "custom_model": {
            "speed": [
              {
                "if": "true",
                "limit_to": "100"
              }
            ],
            "priority": [
              {
                "if": "road_class == MOTORWAY",
                "multiply_by": "0"
              }
            ],
            "distance_influence": 100
          }
        } 

        ```
    CustomModelForProfile:
      type: object
      properties:
        speed:
          description: See [speed customization](#tag/Custom-Model/Customizing-speed)
          type: array
          items:
            type: object
        priority:
          description: See [priority customization](#tag/Custom-Model/Customizing-priority)
          type: array
          items:
            type: object
        distance_influence:
          description: >-
            Use higher values to prefer shorter routes. See
            [here](#tag/Custom-Model/Customizing-distance_influence) for more
            details.
          type: number
          default: 70
        areas:
          type: object
          description: >
            Areas are given in a GeoJson format. Currently only one format is
            supported: one object with type Feature, a geometry with type
            Polygon and optional (but ignored) id and properties fields. See
            more details and an example [here](#tag/Custom-Model/Define-areas).
      description: >
        The custom_model modifies the routing behaviour of the given `profile`.
        See the [detailed documentation](#tag/Custom-Model). 

        Here is a complete example that limits all speeds to 100km/h, avoids
        motorways and makes shorter routes a bit more likely than the default
        due to a higher distance_influence.


        ```json

        {
          "speed": [
            {
              "if": "true",
              "limit_to": 100
            }
          ],
          "priority": [
            {
              "if": "road_class == MOTORWAY",
              "multiply_by": 0.1
            }
          ],
          "distance_influence": 100
        }

        ```        
    ProfileRequest:
      type: object
      properties:
        profile:
          type: string
          description: The built-in profile your new custom profile shall be based on.
          enum:
            - foot
            - bike
            - ecargobike
            - car
            - small_truck
            - truck
            - scooter
        bounds:
          type: object
          description: >-
            The area of the profile, either a rectangle (`bbox`) or polygons
            (`features`).
          anyOf:
            - $ref: '#/components/schemas/BBox'
            - $ref: '#/components/schemas/FeatureCollection'
        custom_model:
          $ref: '#/components/schemas/CustomModelForProfile'
      example:
        bounds:
          bbox:
            - 11.45462
            - 48.00954
            - 11.77322
            - 48.2076
        custom_model:
          priority:
            - if: road_access == PRIVATE
              multiply_by: '0'
            - if: road_class == MOTORWAY
              multiply_by: '0'
        profile: car
    ProfileResponse:
      type: object
      properties:
        profile:
          type: string
          description: The built-in profile this custom profile is based on.
        bounds:
          type: object
          description: The area of the profile as specified in the request.
          anyOf:
            - $ref: '#/components/schemas/BBox'
            - $ref: '#/components/schemas/FeatureCollection'
        custom_model:
          $ref: '#/components/schemas/CustomModelForProfile'
        id:
          type: string
          description: >-
            The name of the created profile. Use this as the `profile` parameter
            for the /route API etc. For route optimization requests you need to
            define a vehicle_type where you can enter the custom profile.
      example:
        id: cp_shc_1_6544924f-4d20-4f71-b86d-6b1f0740fcf8
        profile: car
        bounds:
          bbox:
            - 11.45462
            - 48.00954
            - 11.77322
            - 48.2076
        custom_model:
          areas:
            type: FeatureCollection
            features: []
          priority:
            - if: road_access == PRIVATE
              multiply_by: '0'
            - if: road_class == MOTORWAY
              multiply_by: '0'
          speed: []
    ProfileGetResponse:
      type: array
      description: The existing custom profiles including their ids
      items:
        $ref: '#/components/schemas/ProfileResponse'
    RouteResponse:
      type: object
      properties:
        paths:
          type: array
          items:
            $ref: '#/components/schemas/RouteResponsePath'
        info:
          $ref: '#/components/schemas/ResponseInfo'
    EncodedLineString:
      type: string
      description: >-
        A polyline-encoded list of positions. You'll need to decode this string
        in client code. We provide open source code in
        [Java](https://github.com/graphhopper/graphhopper/blob/e649aaed8d3f4378bf2d8889bbbc2318261eabb2/web-api/src/main/java/com/graphhopper/http/WebHelper.java#L54)
        and
        [JavaScript](https://github.com/graphhopper/directions-api-js-client/blob/cf43d1a5bc93a3e8007a44fcfc551117e4fa49bc/src/GHUtil.js#L27).
    BBox:
      type: object
      properties:
        bbox:
          type: array
          description: >-
            A rectangular area given as an array [minLon, minLat, maxLon,
            maxLat]. The created profile will only work in this area. The
            maximum area size is 160 000 square kilometers.
          items:
            type: number
            format: double
    FeatureCollection:
      type: object
      description: >-
        A GeoJSON FeatureCollection. For `bounds` the `type` is optional and
        every feature must be a Polygon.
      properties:
        type:
          type: string
          enum:
            - FeatureCollection
        features:
          description: A FeatureCollection is an array of type "Feature" from GeoJSON
          type: array
          items:
            type: object
            properties:
              type:
                type: string
                enum:
                  - Feature
              geometry:
                $ref: '#/components/schemas/Polygon'
    RouteResponsePath:
      type: object
      properties:
        distance:
          description: >
            The total distance, in meters. To get this information for one 'leg'
            please read [this blog
            post](https://www.graphhopper.com/blog/2019/11/28/routing-api-using-path-details/).
          type: number
          format: double
        time:
          description: >
            The total travel time, in milliseconds. To get this information for
            one 'leg' please read [this blog
            post](https://www.graphhopper.com/blog/2019/11/28/routing-api-using-path-details/).
          type: integer
          format: int64
        ascend:
          description: |
            The total ascent, in meters.
          type: number
          format: double
        descend:
          description: |
            The total descent, in meters.
          type: number
          format: double
        points:
          description: >
            The geometry of the route. The format depends on the value of
            `points_encoded`.
          anyOf:
            - $ref: '#/components/schemas/EncodedLineString'
            - $ref: '#/components/schemas/LineString'
        snapped_waypoints:
          description: >
            The snapped input points. The format depends on the value of
            `points_encoded`.
          anyOf:
            - $ref: '#/components/schemas/EncodedLineString'
            - $ref: '#/components/schemas/LineString'
        points_encoded:
          description: >
            Whether the `points` and `snapped_waypoints` fields are
            polyline-encoded strings rather than JSON arrays

            of coordinates. See the field description for more information on
            the two formats.
          type: boolean
        bbox:
          description: >
            The bounding box of the route geometry. Format: `[minLon, minLat,
            maxLon, maxLat]`.
          type: array
          items:
            type: number
            format: double
        instructions:
          type: array
          description: >
            The instructions for this route. This feature is under active
            development, and our instructions can sometimes be misleading,

            so be mindful when using them for navigation.
          items:
            type: object
            properties:
              text:
                type: string
                description: >-
                  A description what the user has to do in order to follow the
                  route. The language depends on the locale parameter.
              street_name:
                type: string
                description: >-
                  The name of the street to turn onto in order to follow the
                  route.
              heading:
                type: number
                format: double
                description: The optional heading for this roundabout instruction.
              last_heading:
                type: number
                format: double
                description: The optional last heading for this roundabout instruction.
              distance:
                type: number
                format: double
                description: The distance for this instruction, in meters.
              time:
                type: integer
                format: int32
                description: The duration for this instruction, in milliseconds.
              interval:
                type: array
                items:
                  type: integer
                  format: int32
                description: >
                  Two indices into `points`, referring to the beginning and the
                  end of the segment of the route

                  this instruction refers to.
              sign:
                type: integer
                format: int32
                description: >
                  A number which specifies the sign to show:


                  | sign | description  |

                  |---|---|

                  |-98| an U-turn without the knowledge if it is a right or left
                  U-turn |

                  | -8| a left U-turn |

                  | -7| keep left |

                  | -6| **not yet used**: leave roundabout |

                  | -3| turn sharp left |

                  | -2| turn left |

                  | -1| turn slight left |

                  |  0| continue on street |

                  |  1| turn slight right |

                  |  2| turn right |

                  |  3| turn sharp right |

                  |  4| the finish instruction before the last point |

                  |  5| the instruction before a via point |

                  |  6| the instruction before entering a roundabout |

                  |  7| keep right |

                  |  8| a right U-turn |

                  |  *| **For future compatibility** it is important that all
                  clients are able to handle also unknown instruction sign
                  numbers
              exit_number:
                type: integer
                format: int32
                description: >
                  Only available for roundabout instructions (sign is 6). The
                  count of exits at which the route leaves the roundabout.
              turn_angle:
                type: number
                format: double
                description: >
                  Only available for roundabout instructions (sign is 6). The
                  radian of the route within the roundabout `0 < r < 2*PI` for
                  clockwise and

                  `-2*PI < r < 0` for counterclockwise turns.
        details:
          type: object
          description: >
            Details, as requested with the `details` parameter. Consider the
            value `{"street_name": [[0,2,"Frankfurter
            Straße"],[2,6,"Zollweg"]]}`.

            In this example, the route uses two streets: The first, Frankfurter
            Straße, is

            used between `points[0]` and `points[2]`, and the second, Zollweg,
            between `points[2]` and `points[6]`.

            Read more about the usage of path details
            [here](https://discuss.graphhopper.com/t/2539).
        points_order:
          type: array
          items:
            type: integer
          description: >
            An array of indices (zero-based), specifiying the order in which the
            input points are visited.

            Only present if the `optimize` parameter was used.
    ResponseInfo:
      type: object
      description: Additional information for your request
      properties:
        copyrights:
          description: >-
            Attribution according to our documentation is necessary if no
            white-label option included.
          type: array
          items:
            type: string
        took:
          type: number
          format: double
    IsochroneResponse:
      type: object
      properties:
        polygons:
          type: array
          description: >
            The list of polygons in GeoJson format. It can be used e.g. in the
            Leaflet framework:


            ```

            L.geoJson(json.polygons).addTo(map)

            ```


            The number of polygon is identical to the specified buckets in the
            query. Every polygon contains the bucket number in the properties
            section of the GeoJson.
          items:
            $ref: '#/components/schemas/IsochroneResponsePolygon'
      example:
        polygons:
          - properties:
              bucket: 0
            type: Feature
            geometry:
              type: Polygon
              coordinates:
                - - 13.351851
                  - 52.51345
                - - 13.350402
                  - 52.516949
                - - 13.352598
                  - 52.522252
                - - 13.351851
                  - 52.51345
    IsochroneResponsePolygon:
      type: object
      description: A found path
      properties:
        properties:
          type: object
          properties:
            bucket:
              type: integer
              format: int32
        type:
          type: string
        geometry:
          $ref: '#/components/schemas/Polygon'
    LineString:
      type: object
      properties:
        type:
          type: string
        coordinates:
          type: array
          description: >
            A list of coordinate pairs or triples, `[lon,lat]` or
            `[lon,lat,elevation]`.
          items:
            type: array
            items:
              type: number
    Polygon:
      type: object
      properties:
        type:
          type: string
          enum:
            - Polygon
        coordinates:
          type: array
          items:
            type: array
            items:
              type: array
              items:
                type: number
    GHError:
      type: object
      properties:
        message:
          type: string
        hints:
          description: Optional error information.
          type: array
          items:
            type: object
            properties:
              message:
                type: string
    JobId:
      type: object
      properties:
        job_id:
          type: string
          format: uuid
          description: >-
            UUID. Unique id for your job/request with which you can fetch your
            solution
          example: 44886560-b584-4da5-b245-768151dacd8f
    BadRequest:
      type: object
      properties:
        message:
          type: string
          description: Short error message
          example: Bad Request
        hints:
          type: array
          description: Optional error information.
          items:
            $ref: '#/components/schemas/ErrorMessage'
        status:
          type: string
          description: status
          default: finished
          example: finished
    ErrorMessage:
      type: object
      properties:
        message:
          type: string
          description: error message
          example: >-
            unsupported json property [vehiles]. allowed properties: [vehicles,
            vehicle_types, services, shipments, relations, algorithm,
            objectives, cost_matrices, configuration]
        details:
          type: string
          description: Details
          example: class java.lang.IllegalArgumentException
    InternalErrorMessage:
      type: object
      properties:
        code:
          type: integer
          format: int32
          default: 500
          example: 500
        message:
          type: string
          description: Details
          example: There has been an internal server error.
    Request:
      type: object
      properties:
        vehicles:
          type: array
          description: Specifies the available vehicles.
          minItems: 1
          items:
            $ref: '#/components/schemas/Vehicle'
        vehicle_types:
          type: array
          description: >-
            Specifies the available vehicle types. These types can be assigned
            to vehicles.
          items:
            $ref: '#/components/schemas/VehicleType'
        services:
          type: array
          description: >-
            Specifies the orders of the type "service". These are, for example,
            pickups, deliveries, or other stops to be visited by the specified
            vehicles. Each of these orders contains only one location.
          items:
            $ref: '#/components/schemas/Service'
        shipments:
          type: array
          description: >-
            Specifies the available shipments. Each shipment consists of a
            pickup and a delivery. For a single shipment, the pickup must always
            occur before the delivery. However, pickups and deliveries from
            multiple shipments can be sequenced independently.
          items:
            $ref: '#/components/schemas/Shipment'
        relations:
          type: array
          description: Defines additional relationships between orders.
          items:
            anyOf:
              - $ref: '#/components/schemas/JobRelation'
              - $ref: '#/components/schemas/GroupRelation'
        algorithm:
          $ref: '#/components/schemas/Algorithm'
        objectives:
          type: array
          description: >-
            Specifies an objective function. The vehicle routing problem is
            solved in such a way that this objective function is minimized.
          items:
            $ref: '#/components/schemas/Objective'
          example:
            - type: min
              value: vehicles
            - type: min
              value: completion_time
        cost_matrices:
          type: array
          description: Specifies your own transport time and distance matrices.
          items:
            $ref: '#/components/schemas/CostMatrix'
        configuration:
          $ref: '#/components/schemas/Configuration'
          description: Specifies general configurations.
    Vehicle:
      type: object
      properties:
        vehicle_id:
          type: string
          description: >-
            Specifies the ID of the vehicle. Ids must be unique, i.e. if there
            are two vehicles with the same ID, an error is returned.
          example: vehicle-1
        type_id:
          type: string
          description: >-
            The type ID assigns a vehicle type to this vehicle. You can specify
            types in the array of vehicle types. If you omit the type ID, the
            default type is used. The default type is a `car` with a capacity of
            0.
          default: default-type
          example: my-own-type
        shifts:
          type: array
          items:
            $ref: '#/components/schemas/Shift'
          description: An array of shift configurations for this vehicle.
        start_address:
          $ref: '#/components/schemas/Address'
        end_address:
          $ref: '#/components/schemas/Address'
          description: >-
            If this is omitted AND return_to_depot is true then the vehicle
            needs to return to its start_address.
        break:
          anyOf:
            - $ref: '#/components/schemas/TimeWindowBreak'
            - $ref: '#/components/schemas/DriveTimeBreak'
        return_to_depot:
          type: boolean
          description: >-
            If it is false, the algorithm decides where to end the vehicle
            route. It ends in one of your customers' locations. The end is
            chosen such that it contributes to the overall objective function,
            e.g. min transport_time. If it is true, you can either specify a
            specific end location (which is then regarded as end depot) or you
            can leave it and the driver returns to its start location.
          default: true
        earliest_start:
          type: integer
          format: int64
          description: >-
            Earliest start of vehicle in seconds. It is recommended to use the
            unix timestamp.
          default: 0
        latest_end:
          type: integer
          format: int64
          description: >-
            Latest end of vehicle in seconds, i.e. the time the vehicle needs to
            be at its end location at latest. Omit this field to indicate no
            limit.
        latest_start:
          type: integer
          format: int64
          description: >-
            Latest start of vehicle in seconds. If specified and greater than
            earliest_start, the optimizer determines the best departure time
            within the [earliest_start, latest_start] window to minimize waiting
            time. (beta)
        departure_preference:
          type: string
          enum:
            - early
            - late
          description: >-
            Controls departure preference when latest_start is set. "late"
            (default) departs as late as possible while meeting all time
            windows. "early" departs as early as possible, eliminating waiting
            time along the route. Ignored without latest_start. (beta)
          default: late
        skills:
          type: array
          items:
            type: string
          description: An array of skills, i.e. an array of strings (not case sensitive).
          example:
            - drilling_machine
            - screw_driver
        max_distance:
          type: integer
          format: int64
          description: Specifies the maximum distance (in meters) a vehicle can go.
          example: 400000
        max_driving_time:
          type: integer
          format: int64
          description: >-
            Specifies the maximum driving time (in seconds) a vehicle/driver is
            allowed, i.e. the maximum time spent on the road (service and
            waiting times are not included). Note that `preparation_time` of
            services counts as driving time.
          example: 28800
        max_service_time:
          type: integer
          format: int64
          description: >-
            Specifies the maximum on-site time (in seconds) a vehicle/driver is
            allowed, i.e. the sum of all service durations (scaled by the
            vehicle type's service_time_factor) plus setup times along the
            route. Driving, waiting and break times are not included.
          example: 14400
        max_working_time:
          type: integer
          format: int64
          description: >-
            Specifies the maximum working time (in seconds) a vehicle/driver is
            allowed: driving time (incl. preparation times) plus on-site time
            (service durations scaled by service_time_factor plus setup times).
            Waiting and break times are not included. Use `max_route_duration`
            instead if waiting time should count towards the limit.
          example: 36000
        max_route_duration:
          type: integer
          format: int64
          description: >-
            Specifies the maximum duration (in seconds) of the vehicle's route,
            i.e. the time between the vehicle's actual departure from its start
            location and its arrival at its end location (or at its last stop if
            `return_to_depot` is false). Unlike `max_working_time`, waiting and
            break times count towards this limit, so it bounds the time the
            driver is away. Unlike `latest_end`, it is measured from the actual
            departure: with `latest_start` the optimizer may depart later than
            `earliest_start`, and the limit applies to the route from that later
            departure.
          example: 36000
        max_jobs:
          type: integer
          format: int32
          description: Specifies the maximum number of jobs a vehicle can load.
          example: 12
        min_jobs:
          type: integer
          format: int32
          description: >-
            Specifies the minimum number of jobs a vehicle should load. This is
            a soft constraint, i.e. if it is not possible to fulfill “min_jobs”,
            we will still try to get as close as possible to this constraint.
          example: 12
        max_activities:
          type: integer
          format: int32
          description: Specifies the maximum number of activities a vehicle can conduct.
          example: 24
        move_to_end_address:
          type: boolean
          description: >-
            Indicates whether a vehicle should be moved even though it has not
            been assigned any jobs.
      required:
        - vehicle_id
    VehicleProfileId:
      type: string
      description: >-
        The routing profile. It determines the network, speed and other physical
        attributes used when computing the route. See the section about [routing
        profiles](#tag/Map-Data-and-Routing-Profiles) for more details and valid
        profile values.
      default: car
    Shift:
      type: object
      description: Shift of vehicle.
      properties:
        shift_id:
          type: string
          description: A unique identifier for this vehicle's shift.
        start_address:
          $ref: '#/components/schemas/Address'
        end_address:
          $ref: '#/components/schemas/Address'
          description: >-
            If this is omitted AND return_to_depot is true then the vehicle
            needs to return to its start_address.
        earliest_start:
          type: integer
          format: int64
          description: >-
            Earliest start of vehicle in seconds. It is recommended to use the
            unix timestamp.
          default: 0
        latest_end:
          type: integer
          format: int64
          description: >-
            Latest end of vehicle in seconds, i.e. the time the vehicle needs to
            be at its end location at latest. Omit this field to indicate no
            limit.
        latest_start:
          type: integer
          format: int64
          description: >-
            Latest start of vehicle in seconds. If specified and greater than
            earliest_start, the optimizer determines the best departure time
            within the [earliest_start, latest_start] window to minimize waiting
            time. (beta)
        departure_preference:
          type: string
          enum:
            - early
            - late
          description: >-
            Controls departure preference when latest_start is set. "late"
            (default) departs as late as possible while meeting all time
            windows. "early" departs as early as possible, eliminating waiting
            time along the route. Ignored without latest_start. (beta)
          default: late
        return_to_depot:
          type: boolean
          description: >-
            If true, vehicle returns to its start location (or specified end
            location). If false, vehicle can end at any customer location that
            optimizes the objective function.
          default: true
        max_service_time:
          type: integer
          format: int64
          description: >-
            Specifies the maximum on-site time (in seconds) for this shift's
            route, i.e. the sum of all service durations (scaled by
            service_time_factor) plus setup times. Driving, waiting and break
            times are not included. Defaults to the vehicle's max_service_time.
          example: 14400
        max_working_time:
          type: integer
          format: int64
          description: >-
            Specifies the maximum working time (in seconds) for this shift's
            route: driving time (incl. preparation times) plus on-site time.
            Waiting and break times are not included. Defaults to the vehicle's
            max_working_time.
          example: 36000
        max_route_duration:
          type: integer
          format: int64
          description: >-
            Specifies the maximum duration (in seconds) of this shift's route,
            i.e. the time between the actual departure and the arrival at the
            end location, waiting and break times included. Defaults to the
            vehicle's max_route_duration.
          example: 36000
        break:
          anyOf:
            - $ref: '#/components/schemas/TimeWindowBreak'
            - $ref: '#/components/schemas/DriveTimeBreak'
    Algorithm:
      type: object
      description: Use `objectives` instead.
      deprecated: true
      properties:
        problem_type:
          type: string
          enum:
            - min
            - min-max
        objective:
          type: string
          enum:
            - transport_time
            - completion_time
    Address:
      type: object
      properties:
        location_id:
          type: string
          description: Specifies the id of the location.
          example: 550e8400-e29b-11d4-a716-446655440000
        name:
          type: string
          description: Name of location.
          example: Queens Victoria Street 70, Second Floor, Flat 245
        lon:
          format: double
          type: number
          description: Longitude of location.
          example: -0.092869
        lat:
          format: double
          type: number
          description: Latitude of location.
          example: 51.512665
        street_hint:
          type: string
          description: >-
            Optional parameter. Specifies a hint containing the street name to
            better snap the coordinates (lon,lat) to the road network. For
            example, if an address or building has two or more neighboring
            streets, you can control which street is used to find the closest
            location.
          example: Queens Victoria Street 70
        curbside:
          type: string
          enum:
            - right
            - left
            - any
          default: any
          description: >
            Optional parameter. Specifies on which side a point should be
            relative to the driver when they leave/arrive at a start/target/via
            point. Only supported for motor vehicles and OpenStreetMap.

            If you would like to arrive at this address without having to cross
            the street, use `curbside=right/left` for countries with
            right/left-hand driving. Using `curbside=any` is the same as not
            specifying this parameter at all.
      required:
        - location_id
        - lon
        - lat
    ResponseAddress:
      type: object
      description: Address of activity
      properties:
        location_id:
          type: string
          description: Specifies the id of the location.
          example: 550e8400-e29b-11d4-a716-446655440000
        name:
          type: string
          description: Name of location.
          example: Queens Victoria Street 70, Second Floor, Flat 245
        lon:
          format: double
          type: number
          description: Longitude of location.
          example: -0.092869
        lat:
          format: double
          type: number
          description: Latitude of location.
          example: 51.512665
        street_hint:
          type: string
          description: >-
            Optional parameter. Specifies a hint for each address to better snap
            the coordinates (lon,lat) to road network. E.g. if there is an
            address or house with two or more neighboring streets you can
            control for which street the closest location is looked up.
          example: Queens Victoria Street 70
        snapped_waypoint:
          $ref: '#/components/schemas/SnappedWaypoint'
    SnappedWaypoint:
      type: object
      description: >-
        Access point to the road network. It is only available if
        `return_snapped_waypoints` is true (by default it is false).
      properties:
        lon:
          format: double
          type: number
          description: Longitude of location.
          example: -0.092869
        lat:
          format: double
          type: number
          description: Latitude of location.
          example: 51.512665
    DriveTimeBreak:
      type: object
      properties:
        duration:
          type: integer
          format: int64
          description: Specifies the duration of the break in seconds.
          example: 2700
        max_driving_time:
          type: integer
          format: int64
          description: Specifies the max driving time (in a row) without break in seconds.
          example: 14400
        initial_driving_time:
          type: integer
          format: int64
          description: >-
            Specifies the initial (current) driving time of a driver to allow
            dynamic adaptations in seconds.
          example: 3600
        possible_split:
          type: array
          items:
            type: integer
            format: int64
          description: >-
            Array specifying how a break duration (in seconds) can be split into
            several smaller breaks
          example:
            - 900
            - 1800
      required:
        - duration
        - max_driving_time
    TimeWindowBreak:
      type: object
      properties:
        earliest:
          type: integer
          format: int64
          description: Specifies the earliest start time of the break in seconds.
          example: 1550136467
        latest:
          type: integer
          format: int64
          description: Specifies the latest start time of break in seconds.
          example: 1550148467
        duration:
          type: integer
          format: int64
          description: Specifies the duration of the break in seconds.
          example: 2700
      required:
        - earliest
        - latest
        - duration
    VehicleType:
      type: object
      properties:
        type_id:
          type: string
          description: >-
            Specifies the id of the vehicle type. If a vehicle needs to be of
            this type, it should refer to this with its type_id attribute.
          example: my-own-type
        profile:
          $ref: '#/components/schemas/VehicleProfileId'
        capacity:
          type: array
          description: >-
            Specifies an array of capacity dimension values which need to be int
            values. For example, if there are two dimensions such as volume and
            weight then it needs to be defined as [ 1000, 300 ] assuming a
            maximum volume of 1000 and a maximum weight of 300.
          items:
            type: integer
            format: int32
          default:
            - 0
          example:
            - 100
            - 500
        speed_factor:
          format: double
          type: number
          description: >-
            Specifies a speed factor for this vehicle type. For example, if a
            vehicle using this type should travel at half the speed calculated
            by our routing engine, set the speed factor to 0.5.
          default: 1
        service_time_factor:
          format: double
          type: number
          description: >-
            Specifies a service time factor for this vehicle type. For example,
            if a vehicle/driver using this type can complete services twice as
            fast as specified in the service or shipment, set this to 0.5.
          default: 1
        cost_per_meter:
          format: double
          type: number
          description: >-
            **_BETA feature_**! Cost parameter per distance unit, here meter is
            used
        cost_per_second:
          format: double
          type: number
          description: >-
            **_BETA feature_**! Cost parameter per time unit, here second is
            used
        cost_per_activation:
          format: double
          type: number
          description: >-
            **_BETA feature_**! Cost parameter vehicle activation, i.e. fixed
            costs per vehicle
        consider_traffic:
          type: boolean
          description: >-
            Specifies whether traffic should be considered. If "tomtom" is used
            and this is false, free-flow travel times from TomTom are
            calculated. If this is true, historical traffic information is used.
            Traffic data is not yet available for "openstreetmap", so setting
            this to true has no effect when using OpenStreetMap.
          default: false
        network_data_provider:
          type: string
          description: >-
            Specifies the network data provider. Either use
            [`openstreetmap`](#tag/Map-Data-and-Routing-Profiles/OpenStreetMap)
            (default) or [`tomtom`](#tag/Map-Data-and-Routing-Profiles/TomTom)
            (add-on required).
          enum:
            - openstreetmap
            - tomtom
          default: openstreetmap
      required:
        - type_id
    Service:
      type: object
      properties:
        id:
          type: string
          description: >-
            Specifies the id of the service. Ids need to be unique so there must
            not be two services/shipments with the same id.
          example: 7fe77504-7df8-4497-843c-02d70b6490ce
        type:
          type: string
          description: >-
            Specifies type of service. This makes a difference if items are
            loaded or unloaded, i.e. if one of the size dimensions > 0. If it is
            specified as `service` or `pickup`, items are loaded and will stay
            in the vehicle for the rest of the route (and thus consumes capacity
            for the rest of the route). If it is a `delivery`, items are
            implicitly loaded at the beginning of the route and will stay in the
            route until delivery (and thus releases capacity for the rest of the
            route).
          enum:
            - service
            - pickup
            - delivery
          default: service
          example: delivery
        priority:
          type: integer
          format: int32
          description: >
            Specifies the priority. Can be 1 = high priority to 10 = low
            priority. Priority only affects the solution when not all services
            can be assigned  (e.g., due to insufficient vehicle capacity,
            conflicting time windows,  or vehicle constraints). In these cases,
            the optimizer preferentially  assigns high-priority services and
            leaves low-priority services unassigned.  The lower the priority,
            the earlier these services are omitted from  the solution. When all
            services can be served within the given constraints,  priority has
            no effect - all services are assigned regardless of their  priority
            values, and the optimizer focuses solely on the specified objective 
            (e.g., minimizing distance or number of vehicles).
          default: 2
          example: 1
        name:
          type: string
          description: A meaningful name for the service, e.g. `"deliver pizza"`.
          example: deliver pizza
        address:
          $ref: '#/components/schemas/Address'
        duration:
          type: integer
          minimum: 0
          maximum: 604800
          format: int64
          description: >-
            Specifies the duration of the service in seconds, i.e. how long it
            takes to perform the actual service. This time is charged for each
            activity—if multiple services occur at the same location, their
            durations are summed.
          default: 0
          example: 1800
        preparation_time:
          type: integer
          format: int64
          minimum: 0
          maximum: 604800
          description: >-
            Specifies the preparation time in seconds. This time is added after
            arrival and before the service can begin, modeling tasks like
            finding a parking spot. Preparation time is only charged once when
            the location differs from the previous stop—if multiple consecutive
            activities share the same location, it is applied only to the first.
          default: 0
          example: 300
        setup_time:
          type: integer
          format: int64
          minimum: 0
          maximum: 604800
          description: >-
            Specifies the setup time in seconds. This is a fixed overhead
            charged when arriving at a new location (e.g., dock check-in,
            security clearance, equipment preparation). Unlike `duration`, setup
            time is only charged once per location—if multiple consecutive
            activities share the same location, it is applied only to the first.
            The activity timeline is: arrival → preparation_time → waiting (if
            early) → setup_time → duration.
          default: 0
          example: 600
        time_windows:
          type: array
          items:
            $ref: '#/components/schemas/TimeWindow'
          description: >-
            Specifies an array of time window objects (see TimeWindow object
            below). Specify the time either with the recommended Unix timestamp
            (the number of seconds since 1970-01-01) or you can count the
            seconds relative to Monday morning 00:00 and define the whole week
            in seconds. For example, Monday 9am is represented by 9 hours * 3600
            sec/hour = 32400. Wednesday 1pm corresponds to 2 days * 24 hours/day
            * 3600 sec/hour + 13 hours * 3600 sec/hour = 219600. See our
            tutorial for more information.
          example:
            - earliest: 32400
              latest: 36000
            - earliest: 50400
              latest: 54000
        size:
          type: array
          description: >-
            Size can have multiple dimensions and should correspond to the
            capacity dimension array of the vehicle type. For example, if the
            item that needs to be delivered has two size dimensions, volume and
            weight, specify it as follows: [ 20, 5 ], assuming a volume of 20
            and a weight of 5.
          items:
            type: integer
            format: int32
          default:
            - 0
          example:
            - 30
            - 5
            - 1
        required_skills:
          type: array
          items:
            type: string
          description: >-
            Specifies an array of required skills, i.e. an array of strings (not
            case sensitive). For example, if this service needs to be performed
            by a technician with a `drilling_machine` and a `screw_driver`,
            specify the array as follows: `["drilling_machine","screw_driver"]`.
            This means that the service can only be done by a vehicle
            (technician) that has both `drilling_machine` AND `screw_driver` in
            its skill array. Otherwise, it remains unassigned.
          example:
            - drilling_machine
            - screw_driver
        allowed_vehicles:
          type: array
          items:
            type: string
          description: >-
            Specifies an array of allowed vehicles, i.e. an array of vehicle
            IDs. For example, if this service can only be performed by EITHER
            `technician_peter` OR `technician_stefan`, specify this as follows:
            `["technician_peter","technician_stefan"]`.
          example:
            - technician_peter
            - technician_stefan
        disallowed_vehicles:
          type: array
          items:
            type: string
          description: >-
            Specifies an array of disallowed vehicles, i.e. an array of vehicle
            IDs.
          example:
            - driver-A
            - driver-B
        preferred_vehicles:
          type: array
          items:
            $ref: '#/components/schemas/PreferredVehicle'
          description: Specifies an array of preferred vehicles.
        max_time_in_vehicle:
          type: integer
          format: int64
          description: >-
            Specifies the maximum time in seconds a delivery can stay in the
            vehicle. Currently, it only works with services of
            "type":"delivery". Omit this field to indicate no limit.
          example: 900
        group:
          type: string
          description: >-
            Group this service belongs to. Orders with the same group label are
            treated as a contiguous cluster — they stay together as a block, but
            the optimizer picks the internal sequence. Groups can also be
            referenced in group-level relations to enforce constraints like
            `in_sequence` across entire clusters.
          example: group-A
      required:
        - id
    Shipment:
      type: object
      properties:
        id:
          type: string
          description: >-
            Specifies the ID of the shipment. IDs must be unique, so there must
            not be two services/shipments with the same ID.
          example: 7fe77504-7df8-4497-843c-02d70b6490ce
        name:
          type: string
          description: >-
            A meaningful name for the shipment, e.g. "pick up and deliver pizza
            to Peter".
          example: pick up and deliver pizza to Peter
        priority:
          type: integer
          format: int32
          description: >
            Specifies the priority. Can be 1 = high priority to 10 = low
            priority. Priority only affects the solution when not all shipments
            can be assigned  (e.g., due to insufficient vehicle capacity,
            conflicting time windows,  or vehicle constraints). In these cases,
            the optimizer preferentially  assigns high-priority shipments and
            leaves low-priority shipments unassigned.  The lower the priority,
            the earlier these shipments are omitted from  the solution. When all
            shipments can be served within the given constraints,  priority has
            no effect - all shipments are assigned regardless of their  priority
            values, and the optimizer focuses solely on the specified objective 
            (e.g., minimizing distance or number of vehicles).
          default: 2
          example: 1
        pickup:
          $ref: '#/components/schemas/Stop'
        delivery:
          $ref: '#/components/schemas/Stop'
        size:
          type: array
          description: >-
            Size can have multiple dimensions and should correspond to the
            capacity dimension array of the vehicle type. For example, if the
            item that needs to be delivered has two size dimensions, volume and
            weight, specify it as follows: [ 20, 5 ], assuming a volume of 20
            and a weight of 5.
          items:
            type: integer
            format: int32
          default:
            - 0
          example:
            - 3
        required_skills:
          type: array
          items:
            type: string
          description: >-
            Specifies an array of required skills, i.e. an array of strings (not
            case sensitive). For example, if this shipment needs to be handled
            by a technician with a `drilling_machine` and a `screw_driver`,
            specify the array as follows: `["drilling_machine","screw_driver"]`.
            This means that the shipment can only be done by a vehicle
            (technician) that has both `drilling_machine` AND `screw_driver` in
            its skill array. Otherwise, it remains unassigned.
          example:
            - drilling_machine
            - screw_driver
        allowed_vehicles:
          type: array
          items:
            type: string
          description: >-
            Specifies an array of allowed vehicles, i.e. an array of vehicle
            IDs. For example, if this shipment can only be handled by EITHER
            "technician_peter" OR "technician_stefan", specify this as follows:
            ["technician_peter","technician_stefan"].
          example:
            - technician_peter
            - technician_stefan
        disallowed_vehicles:
          type: array
          items:
            type: string
          description: >-
            Specifies an array of disallowed vehicles, i.e. an array of vehicle
            IDs.
          example:
            - driver-A
            - driver-B
        preferred_vehicles:
          type: array
          items:
            $ref: '#/components/schemas/PreferredVehicle'
          description: Specifies an array of preferred vehicles.
        max_time_in_vehicle:
          type: integer
          format: int64
          description: >-
            Specifies the maximum time in seconds a shipment can stay in the
            vehicle. Omit this field to indicate no limit.
          example: 1800
      required:
        - id
        - pickup
        - delivery
    Pickup:
      $ref: '#/components/schemas/Stop'
    Stop:
      type: object
      properties:
        address:
          $ref: '#/components/schemas/Address'
          description: Specifies pickup or delivery address.
        duration:
          type: integer
          minimum: 0
          maximum: 604800
          format: int64
          description: >-
            Specifies the duration of the pickup or delivery in seconds, e.g.
            how long it takes to load or unload items. This time is charged for
            each stop—if multiple pickups or deliveries occur at the same
            location, their durations are summed.
          default: 0
          example: 1800
        preparation_time:
          type: integer
          minimum: 0
          maximum: 604800
          format: int64
          description: >-
            Specifies the preparation time in seconds. This time is added after
            arrival and before the pickup or delivery can begin, modeling tasks
            like finding a parking spot. Preparation time is only charged once
            when the location differs from the previous stop—if multiple
            consecutive activities share the same location, it is applied only
            to the first.
          default: 0
          example: 300
        setup_time:
          type: integer
          format: int64
          minimum: 0
          maximum: 604800
          description: >-
            Specifies the setup time in seconds. This is a fixed overhead
            charged when arriving at a new location (e.g., dock check-in,
            security clearance, equipment preparation). Unlike `duration`, setup
            time is only charged once per location—if multiple consecutive
            activities share the same location, it is applied only to the first.
            The activity timeline is: arrival → preparation_time → waiting (if
            early) → setup_time → duration.
          default: 0
          example: 600
        time_windows:
          type: array
          items:
            $ref: '#/components/schemas/TimeWindow'
          description: >-
            Specifies an array of time window objects (see time window object
            below). For example, if an item needs to be delivered between 7am
            and 10am then specify the array as follows: [ { "earliest": 25200,
            "latest" : 32400 } ] (starting the day from 0 in seconds).
          example:
            - earliest: 32400
              latest: 36000
            - earliest: 50400
              latest: 54000
        group:
          type: string
          description: >-
            Group this stop belongs to. Orders with the same group label are
            treated as a contiguous cluster — they stay together as a block, but
            the optimizer picks the internal sequence. Groups can also be
            referenced in group-level relations to enforce constraints like
            `in_sequence` across entire clusters.
          example: ASAP
    TimeWindow:
      type: object
      properties:
        earliest:
          type: integer
          format: int64
          description: >-
            Specifies the opening time of the time window in seconds, i.e. the
            earliest time the service can start.
          default: 0
        latest:
          type: integer
          format: int64
          description: >-
            Specifies the closing time of the time window in seconds, i.e. the
            latest time the service can start. Omit this field to indicate no
            limit.
    PreferredVehicle:
      type: object
      properties:
        vehicle_id:
          type: string
          description: Id of the preferred vehicle.
        priority:
          type: integer
          format: int64
          description: >-
            Number between 1 and 10 which indicates the priority of the
            preferred vehicle. 1 indicates the highest priority, 10 the lowest.
          default: 2
    Configuration:
      type: object
      description: >-
        Specifies general configurations that are taken into account when
        solving the vehicle routing problem.
      properties:
        routing:
          $ref: '#/components/schemas/Routing'
        optimization:
          $ref: '#/components/schemas/Optimization'
    Optimization:
      type: object
      description: This contains all optimization specific configurations.
      properties:
        free_insertion:
          type: boolean
          description: >-
            If you use groups, you sometimes want to place orders without group
            assignment in the best position, i.e. sometimes in the middle of a
            group and not before or after the group. This is not allowed by
            default. However, if this field here is "true", these orders
            (without a group assignment) can be inserted freely.
          default: false
        free_insertion_exempt_groups:
          type: array
          items:
            type: string
          description: >-
            When `free_insertion` is enabled, ungrouped orders can be inserted
            anywhere, including inside groups. Use this property to specify
            groups where ungrouped orders should NOT be inserted. This is useful
            when you have groups like "asap" (must be served first) or "last"
            (must be served last) that should stay compact. For example, with
            `free_insertion_exempt_groups: ["asap", "last"]`, ungrouped orders
            can be inserted freely between other groups, but not inside the
            "asap" or "last" groups, and not between start and "asap" or between
            "last" and end when using `in_direct_sequence` relations with these
            groups.
        auto_assign_radius:
          type: number
          description: >-
            Radius in meters. When set to a positive value, ungrouped jobs are
            automatically assigned to the nearest existing group based on road
            distance. This is useful when you use groups and group-level
            `in_sequence` to define an area visit order, and want new jobs to
            automatically cluster into the right area. Jobs outside the radius
            of all groups remain ungrouped. Requires `free_insertion: true` for
            ungrouped jobs to be placed freely.
          default: 0
    Routing:
      type: object
      description: This contains all routing specific configurations.
      properties:
        calc_points:
          type: boolean
          description: >-
            It lets you specify whether the API should provide you with route
            geometries for vehicle routes or not. Thus, you do not need to do
            extra routing to get the polyline for each route.
          default: false
        consider_traffic:
          type: boolean
          description: >-
            Indicates whether historical traffic information should be
            considered.
          default: false
        network_data_provider:
          type: string
          description: >-
            Specifies the data provider. Read more about it
            [here](#tag/Map-Data-and-Routing-Profiles).
          enum:
            - openstreetmap
            - tomtom
          default: openstreetmap
        curbside_strictness:
          type: string
          default: soft
          description: >-
            In some cases curbside constraints cannot be fulfilled. For example
            in one-way streets you cannot arrive at a building that is on the
            left side of the street such that the building is to the right of
            you (unless you drove the one-way street the wrong/illegal way). You
            can set the `curbside_strictness` to `soft` to ignore the curbside
            constraint in such cases or set it to `strict` to get an error
            response instead. You can also set it to `ignore` to ignore all
            curbside constraints (this is useful to compare the results with and
            without constraints without modifying every single address).
          enum:
            - ignore
            - soft
            - strict
        fail_fast:
          type: boolean
          description: >-
            Indicates whether matrix calculation should fail immediately when
            points cannot be connected.
          default: false
        return_snapped_waypoints:
          type: boolean
          description: >-
            Indicates whether the solution should include snapped waypoints.
            Unlike the address coordinates, a snapped waypoint is the access
            point to the road network.
          default: false
        snap_preventions:
          type: array
          items:
            type: string
            enum:
              - motorway
              - trunk
              - bridge
              - ford
              - tunnel
              - ferry
          description: >-
            Optional parameter. 'Snapping' is the process of finding the closest
            road location for GPS coordinates provided in the `points` array.
            The `snap_preventions` array allows you to prevent snapping to
            specific types of roads. For example, if the array includes
            `bridge`, then the routing engine will avoid snapping to a bridge,
            even if it is the closest road for the given point. Note that once
            snapped the routing algorithm can still route over bridges (or the
            other values). To avoid this you need to use the `custom_model`.
          example:
            - motorway
            - trunk
            - bridge
            - tunnel
            - ferry
            - ford
    Objective:
      type: object
      properties:
        type:
          type: string
          description: >
            Type of objective function, i.e. `min`, `min-max`, or `balance`.

             * `min`: Minimizes the objective value.
             * `min-max`: Minimizes the maximum objective value.
             * `balance`: **(Beta)** Optimizes for balanced workloads across drivers. Use with `value: completion_time` to balance working time, or `value: activities` to balance the number of stops per driver.

            For instance, `min` -> `vehicles` minimizes the number of employed
            vehicles.

            `min` -> `completion_time` minimizes the sum of your vehicle routes'
            completion time.


            If you use, for example, `min-max` -> `completion_time`, it
            minimizes the maximum of your vehicle routes' completion time, i.e.
            it minimizes the overall makespan.

            This only makes sense if you have more than one vehicle. In case of
            one vehicle, switching from `min` to `min-max` should not have any
            impact.

            If you have more than one vehicle, then the algorithm tries to
            constantly move stops from one vehicle to another such that

            the completion time of longest vehicle route can be further reduced.
            For example, if you have one vehicle that takes 8 hours

            to serve all customers, adding another vehicle (and using `min-max`)
            might halve the time to serve all customers to 4 hours. However,

            this usually comes with higher transport costs.


            If you want to minimize `vehicles` first and, second,
            `completion_time`, you can also combine different objectives like
            this:


            ```json

            "objectives" : [
               {
                  "type": "min",
                  "value": "vehicles"
               },
               {
                  "type": "min",
                  "value": "completion_time"
               }
            ]

            ```


            If you want to balance activities or the number of stops among all
            employed drivers, you need to specify it as follows:


            ```json

            "objectives" : [
               {
                  "type": "min-max",
                  "value": "completion_time"
               },
               {
                  "type": "min-max",
                  "value": "activities"
               }
            ]

            ```


            #### Balance Objective (Beta)


            The `balance` objective type provides a more sophisticated approach
            to workload balancing compared to `min-max`.

            While `min-max` only minimizes the maximum route value, `balance`
            optimizes for equal distribution of work across all drivers

            by minimizing the coefficient of variation (CV) of workloads.


            Use `balance` with:
             * `value: completion_time` - Balance working time (service time + travel time + waiting time) across drivers
             * `value: activities` - Balance the number of stops per driver

            The optional `level` parameter (1-3) controls how strongly to
            prioritize balance:
             * `level: 1` - Mild balance preference, allows some variation for better travel efficiency
             * `level: 2` - Moderate balance (default), good trade-off between balance and efficiency
             * `level: 3` - Strict balance, prioritizes equal workloads even at the cost of longer travel

            Example:

            ```json

            "objectives" : [
               {
                  "type": "balance",
                  "value": "completion_time",
                  "level": 2
               }
            ]

            ```


            **When to use `balance` vs `min-max`:**
             * Use `balance` when you want all drivers to have similar workloads (fairness)
             * Use `min-max` when you only care about minimizing the longest route (makespan)

            **Note:** The `balance` objective currently only supports services.
            Requests that combine `balance` objectives with shipments will
            return a `400` error.
          default: min
          enum:
            - min
            - min-max
            - balance
        value:
          type: string
          default: transport_time
          description: >
            The value of the objective function.

            The objective value `transport_time` solely considers the time

            your drivers spend on the road, i.e. transport time. In contrary to
            `transport_time`, `completion_time` also takes waiting times at
            customer sites into account.

            The `completion_time` of a route is defined as the time from
            starting to ending the route,

            i.e. the route's transport time, the sum of waiting times plus the
            sum of activity durations.

            The `completion_time_last_stop`, on the other hand, refers to the
            completion time of the very last order in a tour or, in other words,

            the completion time without the last section from the last stop to
            the end of the tour.

            This is typically used if the orders are to be processed as quickly
            as possible.

            If you solely want to minimize route duration, you should use simply
            use `route_duration`.

            The objective value `vehicles` can only be used along with `min` and
            minimizes vehicles.


            For `balance` objective type, only `completion_time` and
            `activities` are supported.
          enum:
            - completion_time
            - completion_time_last_stop
            - route_duration
            - transport_time
            - vehicles
            - activities
        level:
          type: integer
          format: int32
          minimum: 1
          maximum: 3
          default: 2
          description: >
            **(Beta)** Level for `balance` objectives (1-3). Controls how
            strongly to prioritize balanced workloads.

             * `1` - Accept some workload variation for better travel efficiency
             * `2` - Moderate balance (default)
             * `3` - Strictly equal workloads, even at cost of longer travel

            Only valid when `type` is `balance`. Ignored for other objective
            types.
      example:
        type: min
        value: vehicles
      required:
        - type
        - value
    CostMatrix:
      type: object
      properties:
        type:
          type: string
          description: Type of cost matrix. Currently "default" and "google" are supported.
          enum:
            - default
            - google
        location_ids:
          type: array
          items:
            type: string
        data:
          type: object
          description: JSON data of matrix response
          properties:
            times:
              minItems: 1
              type: array
              items:
                type: array
                items:
                  type: integer
                  format: int64
            distances:
              minItems: 1
              type: array
              items:
                type: array
                items:
                  type: number
                  format: double
            info:
              type: object
              description: Additional information for your request
              properties:
                copyrights:
                  type: array
                  items:
                    type: string
                took:
                  type: number
                  format: double
        profile:
          type: string
          description: Vehicle profile, or empty for a catch-all fallback.
    GroupRelation:
      type: object
      properties:
        type:
          type: string
          description: >
            Specifies the type of relation. It must be either of type
            `in_sequence`, `in_direct_sequence` or `neighbor`.
          example: in_direct_sequence
        groups:
          type: array
          description: An array of groups that should be related
          items:
            type: string
            description: group of services or shipments
          example:
            - group-A
            - group-B
      required:
        - type
        - groups
    JobRelation:
      type: object
      properties:
        type:
          type: string
          description: >+
            Specifies the type of relation. It must be either of type
            `in_same_route`, `not_in_same_route`, `in_sequence`,
            `in_direct_sequence`, `neighbor` or `in_area_sequence`.


            `in_same_route`: As the name suggests, it enforces the specified
            services or shipments to be in the same route. It can be specified
            as follows:


            ```json

            {
               "type": "in_same_route",
               "ids": ["serv_i_id","serv_j_id"]
            }

            ```


            This enforces service i to be in the same route as service j no
            matter which vehicle will be employed. If a specific vehicle
            (driver) is required to conduct this, just add a `vehicle_id` like
            this:


            ```

            {
               "type": "in_same_route",
               "ids": ["serv_i_id","serv_j_id"],
               "vehicle_id": "vehicle1"
            }

            ```


            This not only enforces service i and j to be in the same route, but
            also ensures that both services are in the route of `vehicle1`.


            *Tip*: This way initial loads and vehicle routes can be modelled.
            For example, if your vehicles are already on the road and new orders
            come in, then vehicles can still be rescheduled subject to the
            orders that have already been assigned to these vehicles.


            `not_in_same_route`: It ensures that 2 or more orders are not
            transported by the same vehicle. It can be specified as follows:


            ```json

            {
               "type": "not_in_same_route",
               "ids": ["serv_i_id","serv_j_id"]
            }

            ```



            `in_sequence`: This relation type enforces n jobs to be in sequence.
            It can be specified as


            ```json

            {
               "type": "in_sequence",
               "ids": ["serv_i_id","serv_j_id"]
            }

            ```


            which means that service j needs to be in the same route as service
            i AND it needs to occur somewhere after service i. As described
            above, if a specific vehicle needs to perform these services, just
            add `vehicle_id`.



            `in_direct_sequence`: This enforces n services or shipments to be in
            direct sequence. It can be specified as


            ```json

            {
               "type": "in_direct_sequence",
               "ids": ["serv_i_id","serv_j_id","serv_k_id"]
            }

            ```


            This causes service j to occur directly after service i, and service
            k to occur directly after service j, i.e. in strict sequence. Again,
            a specific vehicle can be assigned by adding a `vehicle_id` to the
            relation.


            When a plain shipment id (without the `_pickup`/`_delivery` suffix
            described below) is used in an `in_direct_sequence` relation, it
            stands for the whole shipment: its pickup directly followed by its
            delivery. For example, `"ids": ["ship_1","ship_2"]` enforces the
            strict activity sequence pickup of 1, delivery of 1, pickup of 2,
            delivery of 2 — with no other stops in between. If other activities
            should be allowed between a shipment's pickup and delivery,
            reference the activities individually via the `_pickup`/`_delivery`
            suffixes instead.


            `neighbor`: This specifies a neighbor relationship, i.e., if
            services i and j are to be neighbors, i must be either immediately
            before or after j. It can be specified as follows:


            ```json

            {
                "type": "neighbor",
                "ids": ["serv_i_id","serv_j_id"]
            }

            ```


            `in_area_sequence`: This defines an area-level visit order. You pick
            one job per area as an anchor and set a radius. All other jobs
            within the radius of an anchor are automatically clustered into that
            area. Areas are visited in the specified order, and within each area
            the optimizer handles the details. It can be specified as follows:


            ```json

            {
               "type": "in_area_sequence",
               "ids": ["job_area_a","job_area_b","job_area_c"],
               "area_radius": 5000
            }

            ```


            This means: visit the area around `job_area_a` first, then the area
            around `job_area_b`, then `job_area_c`. Any ungrouped job within
            5000 meters (road distance) of an anchor is automatically assigned
            to that area. Jobs outside all radii are placed wherever fits best.


            You can assign the area sequence to a specific vehicle:


            ```json

            {
               "type": "in_area_sequence",
               "ids": ["job_area_a","job_area_b"],
               "area_radius": 5000,
               "vehicle_id": "vehicle1"
            }

            ```


            Multiple `in_area_sequence` relations can be used to assign
            different area sequences to different vehicles. If an anchor job
            already has a `group`, that group name is used instead of an
            auto-generated one, and nearby jobs are assigned to it.


            *Special IDs*:

            If you look at the previous example and you want service i to be the
            first in the route, use the special ID `start` as follows:


            ```json

            {
               "type": "in_direct_sequence",
               "ids": ["start","serv_i_id","serv_j_id","serv_k_id"]
            }

            ```


            This enforces the direct sequence of i, j, and k at the beginning of
            the route. If this sequence should be at the end of the route, use
            the special ID `end` like this:


            ```json

            {
               "type": "in_direct_sequence",
               "ids": ["serv_i_id","service_j_id","serv_k_id","end"]
            }

            ```


            If you deal with services then you need to use the 'id' of your
            services in the field 'ids'. To also consider sequences of the
            pickups and deliveries of your shipments, you need to use a special
            ID, i.e. use the shipment id plus the keyword `_pickup` or
            `_delivery`. For example, to ensure that the pickup and delivery of
            the shipment with the id 'my_shipment' are direct neighbors, you
            need the following specification:


            ```

            {
               "type": "in_direct_sequence",
               "ids": ["my_ship_pickup","my_ship_delivery"]
            }

            ```

          example: in_direct_sequence
        ids:
          type: array
          description: >-
            Specifies an array of shipment and/or service ids that are in
            relation. If you deal with services then you need to use the id of
            your services in ids. To also consider sequences of the pickups and
            deliveries of your shipments, you need to use a special ID, i.e. use
            your shipment id plus the keyword `_pickup` or `_delivery`. If you
            want to place a service or shipment activity at the beginning of
            your route, use the special ID `start`. In turn, use `end` to place
            it at the end of the route.
          items:
            type: string
          example:
            - pickup-1
            - pickup-2
        vehicle_id:
          type: string
          description: >-
            Id of pre-assigned vehicle, i.e. the vehicle id that is determined
            to conduct the services and shipments in this relation.
          example: driver-Peter
        area_radius:
          type: number
          description: >-
            Radius in meters. Required for `in_area_sequence` relations. Jobs
            within this road distance of an anchor job are automatically
            assigned to that area.
          example: 5000
      required:
        - type
        - ids
    Response:
      type: object
      properties:
        copyrights:
          type: array
          items:
            type: string
            description: Attribution
          example:
            - GraphHopper
            - OpenStreetMap contributors
        status:
          type: string
          enum:
            - waiting_in_queue
            - processing
            - finished
          description: Indicates the current status of the job
          example: finished
        waiting_time_in_queue:
          type: integer
          format: int64
          description: Waiting time in milliseconds.
          example: 300000
        processing_time:
          type: integer
          format: int64
          description: >-
            Processing time in ms. If job is still waiting in queue,
            processing_time is 0
          example: 900000
        solution:
          $ref: '#/components/schemas/Solution'
    Solution:
      type: object
      description: Only available if status field indicates `finished`.
      properties:
        costs:
          type: integer
          format: int32
          deprecated: true
        distance:
          type: integer
          format: int32
          description: >-
            Overall distance traveled in meters, i.e. the sum of each route's
            transport distance.
          example: 1200
        time:
          type: integer
          format: int64
          deprecated: true
          description: Use `transport_time` instead.
        transport_time:
          type: integer
          format: int64
          description: >-
            Overall time travelled in seconds, i.e. the sum of each route's
            transport time.
          example: 12000
        max_operation_time:
          type: integer
          format: int64
          description: Operation time of longest route in seconds.
          example: 4000
        waiting_time:
          type: integer
          format: int64
          description: Overall waiting time in seconds.
          example: 200
        service_duration:
          type: integer
          format: int64
          description: Overall service time in seconds.
          example: 1200
        preparation_time:
          type: integer
          format: int64
          description: Overall preparation time in seconds.
        setup_time:
          type: integer
          format: int64
          description: Overall setup time in seconds.
        completion_time:
          type: integer
          format: int64
          description: >-
            Overall completion time in seconds, i.e. the sum of each route's
            operation time.
          example: 12000
        no_vehicles:
          type: integer
          format: int32
          description: Number of employed vehicles.
          example: 10
        no_unassigned:
          type: integer
          format: int32
          description: Number of jobs that could not be assigned to final solution.
          example: 1
        routes:
          type: array
          description: An array of routes
          items:
            $ref: '#/components/schemas/Route'
        unassigned:
          type: object
          properties:
            services:
              type: array
              description: An array of ids of unassigned services
              items:
                type: string
                description: Id of unassigned service
              example:
                - service-1
                - service-3
            shipments:
              type: array
              description: An array of ids of unassigned shipments
              example:
                - shipment-5
              items:
                type: string
                description: Id of unassigned shipments
            breaks:
              type: array
              description: An array of ids of unassigned breaks
              items:
                type: string
                description: Id of unassigned breaks
            details:
              type: array
              description: >-
                An array of details, i.e. reason for unassigned services or
                shipments
              items:
                $ref: '#/components/schemas/Detail'
            activities:
              type: array
              description: >
                Per-activity breakdown of every unassigned job. For each
                unassigned **service** there is exactly one entry; for each
                unassigned **shipment** there are two entries (one with `type:
                "pickupShipment"` and one with `type: "deliverShipment"`), both
                sharing the shipment id.


                Schedule-derived fields (`arr_time`, `end_time`, `waiting_time`,
                `distance`, `driving_time`, `preparation_time`, `setup_time`,
                `load_before`, `load_after`) are zero or omitted because the job
                was never placed on a route. The descriptive fields `name`,
                `priority`, and `group` are echoed from the original request
                when present, so consumers can render or audit unassigned stops
                without joining back to the request. `time_window` is omitted
                because the solver never picked one.
              items:
                $ref: '#/components/schemas/Activity'
    Detail:
      type: object
      properties:
        id:
          type: string
          description: Id of unassigned service/shipment
        code:
          type: integer
          format: int32
          description: >
            Reason code (most likely reason). See `reasons` array for additional
            probable reasons.


            Code   |  Reason

            :------|:---------

            1 | cannot serve required skill

            2 | cannot be visited within time window

            3 | does not fit into any vehicle due to capacity

            4 | cannot be assigned due to max distance constraint of vehicles

            21 | could not be assigned due to relation constraint

            22 | could not be assigned due to allowed vehicle constraint

            23 | could not be assigned due to max-time-in-vehicle constraint

            24 | driver does not need a break

            25 | could not be assigned due to disallowed vehicle constraint

            26 | could not be assigned due to max drive time constraint

            27 | could not be assigned due to max job constraint

            28 | could not be assigned due to max activity constraint

            29 | could not be assigned due to group relation constraint

            30 | could not be assigned due to driving time break

            31 | could not be assigned due to max service time constraint

            32 | could not be assigned due to max working time constraint

            33 | could not be assigned due to max route duration constraint

            50 | underlying location cannot be accessed over road network by at
            least one vehicle

            51 | location is isolated and cannot reach any other location over
            road network
        reason:
          type: string
          description: Human readable reason as listed above (most likely reason)
        reasons:
          type: array
          description: >
            Array of probable reasons why this job could not be assigned, sorted
            by likelihood (most likely first).

            This provides more context than the single `code`/`reason` fields,
            which only show the most likely reason.

            For example, a job might fail due to a relation constraint (code
            21), but the underlying cause

            could be a time window violation (code 2). In this case, both
            reasons would appear in this array.
          items:
            $ref: '#/components/schemas/ReasonEntry'
    ReasonEntry:
      type: object
      description: A single reason entry with code and human-readable description
      properties:
        code:
          type: integer
          format: int32
          description: Reason code (see Detail.code for the full list of codes)
        reason:
          type: string
          description: Human readable reason
    Route:
      type: object
      properties:
        vehicle_id:
          type: string
          description: Id of vehicle that operates route
          example: driver-stefan
        distance:
          type: integer
          format: int64
          description: Distance of route in meters.
          example: 10000
        transport_time:
          type: integer
          format: int64
          description: Transport time of route in seconds
          example: 1800
        completion_time:
          type: integer
          format: int64
          description: Completion time of route in seconds
          example: 1800
        waiting_time:
          type: integer
          format: int64
          description: Waiting time of route in seconds
        service_duration:
          type: integer
          format: int64
          description: Service duration of route in seconds
        preparation_time:
          type: integer
          format: int64
          description: Preparation time of route in seconds
        setup_time:
          type: integer
          format: int64
          description: Setup time of route in seconds
        activities:
          type: array
          description: Array of activities
          items:
            $ref: '#/components/schemas/Activity'
        points:
          type: array
          description: One entry for every vehicle
          items:
            description: >-
              The geometry of the route. The format depends on the value of
              `points_encoded`.
            anyOf:
              - $ref: '#/components/schemas/EncodedLineString'
              - $ref: '#/components/schemas/LineString'
    Activity:
      type: object
      properties:
        type:
          type: string
          description: type of activity
          enum:
            - start
            - end
            - service
            - pickupShipment
            - deliverShipment
            - pickup
            - delivery
            - break
        id:
          type: string
          description: >-
            Id referring to the underlying service or shipment, i.e. the
            shipment or service this activity belongs to
        name:
          type: string
          description: >-
            Human-readable name copied from the underlying service or shipment,
            if one was set on the request. Omitted for `start`/`end` activities
            and when the request did not specify a name.
        location_id:
          type: string
          description: Id that refers to address
        address:
          $ref: '#/components/schemas/ResponseAddress'
        arr_time:
          type: integer
          format: int64
          description: >-
            Arrival time at this activity in seconds. If type is `start`, this
            is not available (since it makes no sense to have `arr_time` at
            start). However, `end_time` is available and actually means
            \"departure time\" at start location. It is important to note that
            `arr_time` does not necessarily mean \"start of underlying
            activity\", it solely means arrival time at activity location. If
            this activity has no time windows and if there are no further
            preparation times, `arr_time` is equal to activity start time.
        end_time:
          type: integer
          format: int64
          description: >-
            End time of and thus departure time at this activity. If type is
            `end`, this is not available (since it makes no sense to have an
            `end_time` at end) `end_time` at each activity is equal to the
            departure time at the activity location.
        end_date_time:
          type: string
          format: date-time
          description: >-
            Translation of unix timestamp in `end_time` to end date time string
            with zone offset. It will be in the following ISO-8601 format:
            2007-12-03T10:15:30+01:00.
        arr_date_time:
          type: string
          format: date-time
          description: >-
            Translation of unix timestamp in `arr_time` to arrival date time
            string with zone offset. It will be in the following ISO-8601
            format: 2007-12-03T10:15:30+01:00.
        waiting_time:
          type: integer
          format: int64
          description: >-
            Waiting time at this activity in seconds. A waiting time can occur
            if the activity has at least one time window. If `arr_time` <
            `time_window.earliest` a waiting time of `time_window_earliest` -
            `arr_time` occurs.
        preparation_time:
          type: integer
          format: int64
          description: preparation time at this activity in seconds
        setup_time:
          type: integer
          format: int64
          description: >-
            Setup time at this activity in seconds. Setup time is charged when
            the location differs from the previous activity, representing
            location overhead like dock check-in or security clearance.
        distance:
          type: integer
          format: int64
          description: Cumulative distance from start to this activity in meters.
        driving_time:
          type: integer
          format: int64
          description: Cumulative driving time from start to this activity in seconds.
        load_before:
          type: array
          description: Array with size/capacity dimensions before this activity
          items:
            type: integer
            format: int32
            description: dimension value
        load_after:
          type: array
          description: Array with size/capacity dimensions after this activity
          items:
            type: integer
            format: int32
            description: dimension value
        priority:
          type: integer
          format: int32
          minimum: 1
          maximum: 10
          description: >-
            Priority copied from the underlying service or shipment (1 =
            highest, 10 = lowest, default 2). Omitted for `start`/`end`
            activities.
        group:
          type: string
          description: >-
            Group identifier copied from the underlying activity (pickup or
            delivery side for shipments). Omitted for `start`/`end` activities
            and when the request did not specify a group.
        departure_window:
          type: object
          description: >-
            The feasible departure window for the start activity. Only present
            on start activities when the vehicle has latest_start set. Shows the
            earliest and latest feasible departure times. (beta)
          properties:
            earliest:
              type: integer
              format: int64
              description: Earliest feasible departure time in seconds.
            latest:
              type: integer
              format: int64
              description: Latest feasible departure time in seconds.
        time_window:
          allOf:
            - $ref: '#/components/schemas/TimeWindow'
            - description: >-
                The time window the solver actually scheduled this activity
                into. Only present when the request specified at least one
                explicit, non-default time window for the activity; the trivial
                `[0, MAX]` window is suppressed.
